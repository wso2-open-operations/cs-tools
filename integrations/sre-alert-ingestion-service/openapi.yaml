  /prometheus:
    post:
      tags: [alerts]
      operationId: postPrometheusAlert
      summary: Receive a Prometheus Alertmanager alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /servicenow:
    post:
      tags: [alerts]
      operationId: postServicenowAlert
      summary: Receive an alert ServiceNow has already transformed (temporary)
      description: >-
        Temporary route for the parallel run. The body is one canonical alert object, or an
        array of them, with the eight fields ServiceNow's AlertCoreUtils.init receives.
      requestBody:
        $ref: '#/components/requestBodies/CanonicalAlertPayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /site24x7:
    post:
      tags: [alerts]
      operationId: postSite24x7Alert
      summary: Receive a Site24x7 alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  requestBodies:
    SourcePayload:
      required: true
      description: The source's native webhook payload, sent as-is (up to 1 MiB).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    CanonicalAlertPayload:
      required: true
      description: One canonical alert, or a non-empty array of them (up to 1 MiB).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CanonicalAlert'
              - type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/CanonicalAlert'
  responses:
    Stored:
      description: Every alert in the request was stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Stored'
    Rejected:
      description: The request was rejected (bad payload, unauthorized, or too large). No alert id was used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The alert could not be stored now (queue full, storage failure or timeout).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CanonicalAlert:
      type: object
      description: >-
        Stored as sent, with no defaults. Needs at least one of these fields; other keys are ignored.
      minProperties: 1
      additionalProperties: true
      properties:
        service:
          type: string
        metric_name:
          type: string
        severity:
          type: string
          example: Critical
        category:
          type: string
        environment:
          type: string
        source:
          type: string
          example: AWS
        unique_identifier:
          type: string
        description:
          type: string
    Stored:
      type: object
      properties:
        status:
          type: string
          example: stored
        alt_ids:
          type: array
          items:
            type: string
            example: ALT000000123
        count:
          type: integer
          example: 1
        alerts:
          type: array
          description: The transformed, canonical alert(s) that were stored.
          items:
            $ref: '#/components/schemas/CanonicalAlert'
    Error:
      type: object
      properties:
        status:
          type: string
          example: rejected
        error:
          type: string
