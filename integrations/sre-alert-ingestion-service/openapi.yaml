openapi: 3.0.3
info:
  title: SRE Alert API
  version: 1.0.0
  description: >-
    Receives alert webhooks from monitoring sources, normalizes them into the
    canonical alert and stores them for sre-alert-core-service. One POST route per source.
servers:
  - url: /api/wso2/v1/sre_alert_api
tags:
  - name: alerts
paths:
  /aws:
    post:
      tags: [alerts]
      operationId: postAwsAlert
      summary: Receive an AWS alert webhook
      description: >-
        An SNS SubscriptionConfirmation is confirmed and emailed to the team named by ?team=
        (answers 200, stores nothing); notifications are stored as alerts.
      parameters:
        - name: team
          in: query
          required: false
          description: Team to email about SNS subscription confirmations (default "Default").
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '200':
          description: SNS subscription confirmation handled; nothing stored.
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /azure:
    post:
      tags: [alerts]
      operationId: postAzureAlert
      summary: Receive an Azure Monitor alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /datadog:
    post:
      tags: [alerts]
      operationId: postDatadogAlert
      summary: Receive a Datadog alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /elasticsearch:
    post:
      tags: [alerts]
      operationId: postElasticsearchAlert
      summary: Receive an Elasticsearch alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /gcp:
    post:
      tags: [alerts]
      operationId: postGcpAlert
      summary: Receive a GCP alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /icinga:
    post:
      tags: [alerts]
      operationId: postIcingaAlert
      summary: Receive an Icinga alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /openobserve:
    post:
      tags: [alerts]
      operationId: postOpenobserveAlert
      summary: Receive an OpenObserve alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Unavailable'

  /opensearch:
    post:
      tags: [alerts]
      operationId: postOpensearchAlert
      summary: Receive an OpenSearch alert webhook
      requestBody:
        $ref: '#/components/requestBodies/SourcePayload'
      responses:
        '201':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
