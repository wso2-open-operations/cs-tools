            createdOn:
              type: string
              format: date-time
            createdBy:
              type: string

    IncidentUpdateRequest:
      type: object
      description: >
        Incident fields to update — a thin proxy of entity-service's own
        UpdateIncidentRequest, forwarded verbatim. All fields are optional,
        but entity-service requires at least one. Not enumerated exhaustively
        here (e.g. priority/state/resolutionCode key values); see
        entity-service's own domain.UpdateIncidentRequest for the complete,
        authoritative field set.
      properties:
        subject:
          type: string
        impact:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        urgency:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        assignmentGroupId:
          type: string
          format: uuid
        assignedEngineerId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        additionalComments:
          type: string
        workNotes:
          type: string
        watchList:
          type: array
          items:
            type: string

    IncidentUpdateResponse:
      type: object
      properties:
        message:
          type: string
        incident:
          type: object
          description: >
            The full updated incident representation (entity-service's own
            IncidentView), not enumerated exhaustively here.

    SearchIncidentsRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Case-insensitive free-text match against incident fields.
            priorities:
              type: array
              items:
                type: string
                enum: [HIGH, MEDIUM, LOW]
            parentIds:
              type: array
              items:
                type: string
            number:
              type: string
              description: Exact match against the incident's human-readable number (e.g. "INC0010001").
            filters:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  op:
                    type: string
                  values:
                    type: array
                    items:
                      type: string
              description: >
                Generic field/op/values filter array. Forwarded verbatim; the
                entity service validates the supported field/op combinations.
        sortBy:
          type: object
          properties:
            field:
              type: string
              enum: [createdOn, updatedOn, openedOn]
            order:
              type: string
              enum: [asc, desc]
        pagination:
          $ref: '#/components/schemas/Pagination'

