            - WALK_IN
            - AZURE
            - EMAIL_INTERNAL
            - SITE_247
            - DIRECT
            - PHONE
            - SENTINEL
            - VIRTUAL_AGENT
            - CHAT
            - EMAIL_EXTERNAL
        impact:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        urgency:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        assignmentGroupId:
          type: string
          format: uuid
        assignedEngineerId:
          type: string
          format: uuid
        subject:
          type: string
        watchList:
          type: array
