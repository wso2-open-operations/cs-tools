      description: >
        ServiceNow data source only; there is no Postgres equivalent. Read-only:
        this operation does not require a forwarded end-user identity token, so a
        pure M2M call through this service succeeds.
      operationId: getInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The invoice with the given ID.
          content:
