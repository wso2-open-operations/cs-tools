      description: >
        ServiceNow-backed, same as POST /incidents. This operation requires a
        forwarded end-user identity token on the entity-service side; this
        service is strictly M2M with no mechanism to supply one, so every
        call here currently receives a mapped 401. Kept for API-shape
        completeness, not because it currently succeeds.
