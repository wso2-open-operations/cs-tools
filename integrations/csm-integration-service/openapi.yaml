        mechanism to forward an end-user identity token, but the
        entity-service operation falls back to a separately-configured M2M
        credential for the external data source when no end-user token is
        present, and only
        returns 401 if that fallback credential is itself unconfigured in the
        target environment. So this call is unconditionally backed by the external data source
        with no Postgres fallback — whether it succeeds depends on the target
        environment's data source and, on the external data source, its M2M credential
