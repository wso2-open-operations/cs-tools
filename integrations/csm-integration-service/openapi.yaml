              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{id}:
    patch:
      summary: Update a case's state, severity, or workState ((or other fields on the external data source)).
      description: >
        The request body is forwarded to the entity service verbatim; the
        entity service enforces its own field-combination rules (e.g. exactly
        one of state/severity/workState) and 400s otherwise. Unlike
        PATCH /projects/{id}, whether this operation requires a forwarded
        end-user identity token depends on entity-service's own data source.
        On a Postgres data source, a state/severity/workState update (optionally
        combined with resolutionCode/cause/closeNotes when state is closed or
        solution_proposed) succeeds through this M2M-only service — no token
        check on that path. Every other field this shape accepts (watchList,
        assigneeEmail, type and its companions, parentId, relatedCaseId,
        autocloseHoldUntil, subject, description, deploymentId,
        deployedProductId, the fix-ETA group, acknowledge, workaroundProvided)
        is Postgres-rejected with 400, not proxied through to a token check.
        On the external data source, every field this operation accepts —
        including a bare state/severity/workState update — requires a
        forwarded identity token this service cannot supply, so every call
        currently receives a mapped 401 there, with no field combination that
        succeeds.
      operationId: patchCase
      security:
        - oauth2ClientCredentials:
            - cases:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Case fields to update. Field-combination rules are enforced upstream.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdateRequest'
      responses:
        "200":
          description: The case was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseUpdateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported a missing or invalid forwarded identity — always when entity-service runs on the external data source, given this service's M2M-only design; not returned on a Postgres data source, where an unsupported field is a 400 instead)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (the caller's token lacks the `cases:write` scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: GatewayTimeout (the upstream did not answer in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/search:
    post:
      summary: Search cases.
      description: >
        A generic passthrough to entity-service's own POST /cases/search —
        the request body is forwarded verbatim (build whatever filter/
        pagination shape entity-service's own contract accepts, e.g. an
        exact-match filter on "number" to look up a case by case number) and
        the response is returned as-is. No special-casing for any particular
        lookup shape.
      operationId: searchCases
      security:
        - oauth2ClientCredentials:
            - cases:read
      requestBody:
        description: Case search payload, mirroring entity-service's own POST /cases/search contract.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchPayload'
      responses:
        "200":
          description: Cases matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (no usable caller token was forwarded by the gateway, or the upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (the caller's token lacks this operation's scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: GatewayTimeout (the upstream did not answer in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{id}/comments:
    post:
      summary: Add a comment to a case.
      description: >
        The caller supplies only "type" and "content"; this service supplies
        entity-service's actorEmail field itself, from its own configured
        trusted M2M identity (UMT_INTEGRATION_ACTOR_EMAIL), the same way it
        does for POST /cases/{id}/tags — never from the caller, since
        an unchecked caller-supplied actorEmail would let any caller claim to
        be any user. On DATA_SOURCE=postgres, that configured value must
        match an entry in entity-service's M2M_TRUSTED_ACTOR_EMAILS allowlist
        or every call here receives a mapped 403; when it matches, the
        comment is created successfully with no forwarded end-user identity
        needed. On the external data source, entity-service's path
        still requires a forwarded end-user identity token unconditionally
        and ignores actorEmail entirely — since this service is strictly M2M
        with no mechanism to supply one, calls against that data source
        still receive a mapped 401.
      operationId: createCaseComment
      security:
        - oauth2ClientCredentials:
            - cases:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCommentCreateRequest'
      responses:
        "201":
          description: The comment was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCommentCreateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: >
            Unauthorized — always for the external data source, since this
            service has no forwarded end-user identity to supply and that
            data source's entity-service path requires one unconditionally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: >
            Forbidden — the configured UMT_INTEGRATION_ACTOR_EMAIL is unset
            or is not on entity-service's M2M_TRUSTED_ACTOR_EMAILS allowlist
            (DATA_SOURCE=postgres only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: GatewayTimeout (the upstream did not answer in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{id}/tags:
    post:
      summary: Add a tag/label to a case.
      description: >
        The caller supplies only "label"; this service supplies
        entity-service's actorEmail field itself, from its own configured
        trusted M2M identity (UMT_INTEGRATION_ACTOR_EMAIL), the same way it
        does for POST /cases/{id}/comments — never from the caller, since
        an unchecked caller-supplied actorEmail would let any caller claim to
        be any user. Postgres-backed; a pure M2M call succeeds when that
        configured value matches an entry in entity-service's
        M2M_TRUSTED_ACTOR_EMAILS allowlist, and 403s otherwise.
      operationId: addCaseTag
      security:
        - oauth2ClientCredentials:
            - cases:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseTagCreateRequest'
      responses:
        "201":
          description: The tag was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseTagCreateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: >
            Unauthorized — on the external data source, entity-service forwards
            this call to the external data source with an empty user token (this service has
            no end-user identity to forward), and that source returns 401.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: >
            Forbidden — the configured UMT_INTEGRATION_ACTOR_EMAIL is unset
            or is not on entity-service's M2M_TRUSTED_ACTOR_EMAILS allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
