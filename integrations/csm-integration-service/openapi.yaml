components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          # Placeholder — fill in with the actual token endpoint for this service's
          # Choreo-managed API once it's provisioned. Not a real/guessed URL.
          tokenUrl: "<token_url>"
          # One scope per operation group. Every operation below except
          # GET /health lists the single scope it requires; a consumer is
          # granted the scopes for the operations it needs and no others.
          scopes:
            accounts:read: Read accounts (get by id, search).
            contacts:read: Search an account's or a project's contacts.
            projects:read: Read projects (get by id, search).
            projects:write: Update a project's closure-state fields.
            cases:read: Search cases.
            cases:write: Update a case, add a comment or a tag to it.
            opportunities:read: Read opportunities and project-opportunity links.
            invoices:read: Read invoices.
            vulnerabilities:sync: Replace the product-vulnerability record set.
            incidents:read: Search incidents.
            incidents:write: Create and update incidents.
            services:read: Search IT services.
            alert-incident-mappings:read: Look up alert-incident mappings.
            alert-incident-mappings:write: Create alert-incident mappings.
            cloud-status:read: Read the public cloud status dashboard data.

  schemas:
    CloudStatusResult:
      type: object
      description: >
        The envelope the legacy status endpoints return, reproduced here
        so these endpoints are a DROP-IN REPLACEMENT rather than a second
        integration. The dashboard checks
        `json?.result?.message == "success"` and then reads
        `json.result.data`, so cutting over is a change to its endpoint URLs
        and nothing else — no new controller, no parallel code path.


        `data` is forwarded byte-for-byte from entity-service. That matters
        beyond tidiness: on /availabilities the `availability` field is a
        JSON STRING for six clouds and a bare NUMBER for asgardeo, and a
        decode/re-encode would flatten the distinction.
      properties:
        result:
          type: object
          properties:
            code:
              type: integer
              description: 0 on success. The dashboard gates on message, not this.
            message:
              type: string
              enum: [success]
            cloud:
              type: string
            data:
              description: The endpoint's payload, forwarded unchanged.
          required: [code, message, cloud, data]
      required: [result]
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results per page.
        offset:
          type: integer
          description: Zero-based offset into the result set.

    Account:
      type: object
      properties:
        id:
          type: string
        sfId:
          type: string
        name:
          type: string
        tier:
          type: string
          enum: [basic, enterprise]
        region:
          type: string
        activationDate:
          type: string
          format: date-time
        deactivationDate:
          type: string
          format: date-time
        ownerId:
          type: string
        technicalOwnerId:
          type: string
        agentEnabled:
          type: boolean
        kbReferencesEnabled:
          type: boolean
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    AccountSearchPayload:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Case-insensitive match against account name or Salesforce ID.

    AccountSearchResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    AccountContactSearchPayload:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Searches across contact name and email (case-insensitive).
        pagination:
          $ref: '#/components/schemas/Pagination'

    AccountContactSearchResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
              isPrimary:
                type: boolean
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Project:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        sfId:
          type: string
        name:
          type: string
        projectKey:
          type: string
        subscriptionType:
          type: string
          enum:
            - development_support
            - managed_cloud_subscription
            - evaluation_subscription
            - subscription
            - cloud_evaluation_support
            - internal
            - platformer_subscription
            - cloud_support
            - professional_services
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing external-system
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectSearchPayload:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
          description: Case-insensitive match against name, key, and subscription type.
        endDateFrom:
          type: string
          format: date
          description: Only projects ending on or after this date (yyyy-MM-dd).
        endDateTo:
          type: string
          format: date
          description: Only projects ending on or before this date (yyyy-MM-dd).
        onboardingStatus:
          type: array
          items:
            type: string
          description: Only projects whose onboarding status is any of these, e.g. "In-Progress".
        subRegion:
          type: string
          description: Only projects whose account has this sub-region (case-insensitive).
        arrTodayGte:
          type: string
          description: Minimum account ARR. Rejected with 400 on the Postgres data source.

    ProjectSearchResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProjectContactSearchPayload:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Searches across contact name and email (case-insensitive).
        pagination:
          $ref: '#/components/schemas/Pagination'

    ProjectContactSearchResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
              registrationState:
                type: string
              notificationsEnabled:
                type: boolean
              roles:
                type: array
                description: Project roles, e.g. PORTAL_USER, SECURITY_CONTACT, BUSINESS_CONTACT.
                items:
                  type: string
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ProjectUpdateRequest:
      type: object
      minProperties: 1
      description: >
        All fields are optional individually, but at least one is required —
        enforced by the entity service, which 400s if none is set.
      properties:
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        endDateClosureState:
          type: string
        invoiceDueDateClosureState:
          type: string
        complianceViolationClosureState:
          type: string
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing external-system
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectUpdateResult:
      type: object
      properties:
        id:
          type: string
        updatedBy:
          type: string
        updatedOn:
          type: string
          format: date-time
        closureState:
          type: string
          nullable: true
        endDateClosureState:
          type: string
          nullable: true
        invoiceDueDateClosureState:
          type: string
          nullable: true
        complianceViolationClosureState:
          type: string
          nullable: true
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true

    ProjectUpdateResponse:
      type: object
      properties:
        message:
          type: string
        project:
          $ref: '#/components/schemas/ProjectUpdateResult'

    CaseUpdateRequest:
      type: object
      minProperties: 1
      description: >
        state, severity, and workState are mutually exclusive of each other
        and of every other field in this request — exactly one of them, or
        one combination of the other (external-data-source-only) fields, is required
        per call. Only state/severity/workState succeed through this
        M2M-only service; every other field requires a forwarded end-user
        identity token this service cannot supply. See the entity service's
        own OpenAPI spec for the full field set and combination rules — this
        is deliberately not fully re-specified here. The body is forwarded
        verbatim: a field the entity service does not recognise is rejected
        there with 400, not silently accepted.
      properties:
        state:
          type: string
        severity:
          type: string
        workState:
          type: string
        markFixIssued:
          type: boolean
          description: >
            True-only, first-write-wins: records that a fix has been issued
            for the case. Mutually exclusive with state, severity, workState,
            and every other field in this request. A second call on an
            already-marked case is a no-op success, not an error. Postgres
            data source only (or the dual-write data source, which
            asynchronously mirrors the write to the external data source) — unlike
            state/severity/workState, this succeeds through this M2M-only
            service unconditionally, with no data-source-dependent 401.
          enum: [true]

    CaseUpdateResult:
      type: object
      properties:
        id:
          type: string
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: string
        state:
          type: string
        severity:
          type: string
        workState:
          type: string
          nullable: true
      additionalProperties: true

    CaseUpdateResponse:
      type: object
      properties:
        message:
          type: string
        case:
          $ref: '#/components/schemas/CaseUpdateResult'

    CaseCommentCreateRequest:
      type: object
      description: >
        Only type and content are read; any other field (including
        actorEmail) is ignored and never forwarded.
      required:
        - type
        - content
      properties:
        type:
          type: string
          description: Comment type, e.g. comment, work_note, or activity.
        content:
          type: string
          description: >
            actorEmail is never accepted here — this service supplies it
            itself from its own configured M2M identity
            (UMT_INTEGRATION_ACTOR_EMAIL).

    CaseCommentCreateResult:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string

    CaseCommentCreateResponse:
      type: object
      properties:
        message:
          type: string
        comment:
          $ref: '#/components/schemas/CaseCommentCreateResult'

    CaseTagCreateRequest:
      type: object
      description: >
        Only label is read; any other field (including actorEmail) is
        ignored and never forwarded.
      required:
        - label
      properties:
        label:
          type: string
          description: >
            The label text to add. actorEmail is never accepted here — this
            service supplies it itself from its own configured M2M identity
            (UMT_INTEGRATION_ACTOR_EMAIL).

    CaseTagCreateResponse:
      type: object
      description: >
        Mirrors entity-service's flat domain.Tag response verbatim — no
        message/tag wrapper, no createdOn/createdBy.
      properties:
        id:
          type: string
        label:
          type: string
        color:
          type: string
          nullable: true

    CaseFieldFilter:
      type: object
      description: A single "field op values" predicate in a case search filter expression, mirroring entity-service's own case-search contract.
      properties:
        field:
          type: string
        op:
          type: string
        values:
          type: array
          items:
            type: string

    CaseSearchPayload:
      type: object
      description: >
        Forwarded verbatim to entity-service's own POST /cases/search — this
        service does not define or validate the filter/pagination shape
        itself. See entity-service's own OpenAPI spec for the full contract.
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          type: object
          properties:
            filters:
              type: array
              items:
                $ref: '#/components/schemas/CaseFieldFilter'

    CaseSearchResponse:
      type: object
      properties:
        cases:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ProductVulnerabilitySyncPayload:
      type: array
      minItems: 1
      description: >
        The complete current set of product-vulnerability records. Any record
        omitted from this array is treated as removed by the downstream sync,
        which is why the array may not be empty: an empty set is rejected with
        400 rather than forwarded.
      items:
        type: object
        additionalProperties: true
        description: >
          Opaque per-record payload passed through to the entity service
          as-is — its shape is not defined or validated by this layer.

    EntityRef:
      type: object
      description: A minimal reference to another entity — id plus a display name.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true

    SearchOpportunitiesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        accountId:
          type: string
          format: uuid
          description: Restrict to opportunities linked to this account.

    Opportunity:
      type: object
      description: >
        Salesforce data, read from the external data source or from the CSM database on Postgres. Every field but id is nullable — the external data source can
        omit any of them entirely for a sparsely-populated row.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        account:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        eulaVersion:
          type: string
          nullable: true
        eulaVersionDecimal:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
          description: Sales stage, e.g. "50 - Closed Won".

    SearchOpportunitiesResponse:
      type: object
      properties:
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/Opportunity'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    SearchInvoicesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        opportunityId:
          type: string
          format: uuid
          description: Restrict to invoices linked to this opportunity.

    Invoice:
      type: object
      description: >
        Salesforce data, read from the external data source or from the CSM database on Postgres. Every field but id is nullable — the external data source can
        omit any of them entirely for a sparsely-populated row.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        invoicedAmount:
          type: string
          nullable: true
        invoiceDate:
          type: string
          format: date
          nullable: true
        invoicedPaidDate:
          type: string
          format: date
          nullable: true
          description: Date the invoice was paid, if paid.
        invoicedDueDate:
          type: string
          format: date
          nullable: true
        invoiceOriginalDueDate:
          type: string
          format: date
          nullable: true
          description: The invoice's original due date before any extension.
        opportunity:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        classification:
          type: string
          nullable: true
          description: Short classification code (e.g. "CL").
        sfId:
          type: string
          nullable: true
          description: Salesforce record ID linked to this invoice, if any.

    SearchInvoicesResponse:
      type: object
      properties:
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    SearchProjectOpportunityLinksRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        projectId:
          type: string
          format: uuid
          description: Restrict to links for this project.
        opportunityId:
          type: string
          format: uuid
          description: Restrict to links for this opportunity.

    ProjectOpportunityLink:
      type: object
      description: >
        Salesforce data, read from the external data source or from the CSM database on Postgres. Every field but id is nullable — the external data source can
        omit either reference entirely for a sparsely-populated row.
      properties:
        id:
          type: string
          format: uuid
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        opportunity:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'

    SearchProjectOpportunityLinksResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/ProjectOpportunityLink'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProductVulnerabilitySyncResponse:
      type: object
      description: >
        Fields may be partial or omitted depending on the entity service's
