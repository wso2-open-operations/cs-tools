  /project-opportunity-links/search:
    post:
      summary: Search project-opportunity links.
      description: >
        ServiceNow data source only; there is no Postgres equivalent. A project can
        have more than one linked opportunity — one row per link — so this always
        returns a list. No by-id fetch: the underlying data has no single-record
        endpoint. Read-only: this operation does not require a forwarded end-user
        identity token, so a pure M2M call through this service succeeds.
      operationId: searchProjectOpportunityLinks
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProjectOpportunityLinksRequest'
      responses:
        "200":
          description: Project-opportunity links matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectOpportunityLinksResponse'
        "400":
