  /vulnerabilities/sync:
    post:
      summary: Full-replace sync of product-vulnerability records.
      description: >
        This is a full-replace sync, not an incremental delta: the caller must
        submit the complete current set of product-vulnerability records on
        every call. The entity service's downstream externally backed operation
        deletes any existing record not present in the submitted set. Because
        of that, the body must be a non-empty JSON array: an empty array (which
        would delete every record) or a body that is not an array is rejected
        with 400 and never forwarded. A valid, non-empty array is forwarded to
        the entity service verbatim.
      operationId: syncProductVulnerabilities
      security:
        - oauth2ClientCredentials:
            - vulnerabilities:sync
      requestBody:
        description: Complete current set of product-vulnerability records.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVulnerabilitySyncPayload'
      responses:
        "201":
          description: The sync was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVulnerabilitySyncResponse'
        "400":
          description: >
            BadRequest — the body is not valid JSON, is not an array, or is an
            empty array (an empty set is never accepted because it would remove
            every record); or the upstream rejected a record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (no usable caller token was forwarded by the gateway, or the upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (the caller's token lacks the `vulnerabilities:sync` scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
