openapi: 3.0.1
info:
  title: CSM Integration Service API
  version: 1.0.0
  description: >
    Project/account search and their Contacts sub-resource, incident
    creation, and alert-incident mapping create/lookup, for third-party
    (M2M) consumers. Fronted by Choreo's API Manager gateway (subscription +
    client credentials) — this service performs no inbound auth of its own.
security:
  - oauth2ClientCredentials: []
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check endpoint.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ok

  /accounts/{id}:
    get:
      summary: Get an account by ID.
      operationId: getAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The account with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/search:
    post:
      summary: Search accounts.
      operationId: searchAccounts
      requestBody:
        description: Account search payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSearchPayload'
      responses:
        "200":
          description: Accounts matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}/contacts/search:
    post:
      summary: Search contacts for an account.
      operationId: searchAccountContacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Account contact search payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountContactSearchPayload'
      responses:
        "200":
          description: Contacts for the given account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContactSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}:
    get:
      summary: Get a project by ID.
      operationId: getProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The project with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update closure-state fields or hasAgent/hasKbReferences toggles on a project.
      description: >
        ServiceNow-data-source only. Used by the Account Closure Process (ACP)
        automation to write closure-state fields on a project. The request body
        is forwarded to the entity service verbatim — at least one field is
        required, and the entity service enforces that (400 if none is set).
        This operation requires a forwarded end-user identity token on the
        entity-service side; this service is strictly M2M with no mechanism to
        supply one, so every call here currently receives a mapped 401. Kept
        for API-shape completeness, not because it currently succeeds.
      operationId: updateProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Closure-state fields to update. At least one is required.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        "200":
          description: The project was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported a missing or invalid forwarded identity — always, for this operation, given this service's M2M-only design)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/search:
    post:
      summary: Search projects.
      operationId: searchProjects
      requestBody:
        description: Project search payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSearchPayload'
      responses:
        "200":
          description: Projects matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/contacts/search:
    post:
      summary: Search contacts for a project.
      operationId: searchProjectContacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Project contact search payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectContactSearchPayload'
      responses:
        "200":
          description: Contacts for the given project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContactSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /incidents:
    post:
      summary: Create an incident.
      description: >
        ServiceNow-backed. The request body is forwarded to the entity service
        verbatim. This operation requires a forwarded end-user identity token
        on the entity-service side; this service is strictly M2M with no
        mechanism to supply one, so every call here currently receives a
        mapped 401. Kept for API-shape completeness, not because it currently
        succeeds.
      operationId: createIncident
      requestBody:
        description: Incident details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        "201":
          description: The incident was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIncidentResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported a missing or invalid forwarded identity — always, for this operation, given this service's M2M-only design)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /incidents/search:
    post:
      summary: Search incidents.
      description: >
        ServiceNow-backed, same as POST /incidents. This operation requires a
        forwarded end-user identity token on the entity-service side; this
        service is strictly M2M with no mechanism to supply one, so every
        call here currently receives a mapped 401. Kept for API-shape
        completeness, not because it currently succeeds.
      operationId: searchIncidents
      requestBody:
        description: Incident search payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchIncidentsRequest'
      responses:
        "200":
          description: Incidents matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchIncidentsResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported a missing or invalid forwarded identity — always, for this operation, given this service's M2M-only design)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alert-incident-mappings:
    post:
      summary: Create an alert-incident mapping.
      description: >
        Postgres-only entity-service operation with no ServiceNow dependency —
        unlike POST /incidents above, this does not require a forwarded
        end-user identity token, so this service's M2M identity is sufficient
        and the call is expected to actually succeed today. The request body
        is forwarded to the entity service verbatim.
      operationId: createAlertIncidentMapping
      requestBody:
        description: Alert-incident mapping details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertIncidentMappingRequest'
      responses:
        "201":
          description: The alert-incident mapping was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertIncidentMappingView'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (Choreo gateway rejected an unauthenticated M2M caller; not expected from the entity service itself for this operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Conflict (an alert-incident mapping with this alertNumber already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alert-incident-mappings/lookup:
    post:
      summary: Look up alert-incident mappings by source and unique identifier.
      description: >
        Postgres-only entity-service operation with no ServiceNow dependency —
        same situation as POST /alert-incident-mappings above; expected to
        actually succeed today. Returns an empty `mappings` array (not 404)
        when nothing matches.
      operationId: lookupAlertIncidentMappings
      requestBody:
        description: Lookup criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupAlertIncidentMappingsRequest'
      responses:
        "200":
          description: Alert-incident mappings matching the lookup criteria (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupAlertIncidentMappingsResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (Choreo gateway rejected an unauthenticated M2M caller; not expected from the entity service itself for this operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          # Placeholder — fill in with the actual token endpoint for this service's
          # Choreo-managed API once it's provisioned. Not a real/guessed URL.
          tokenUrl: "<token_url>"
          scopes: {}

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results per page.
        offset:
          type: integer
          description: Zero-based offset into the result set.

    Account:
      type: object
      properties:
        id:
          type: string
        sfId:
          type: string
        name:
          type: string
        tier:
          type: string
          enum: [basic, enterprise]
        region:
          type: string
        activationDate:
          type: string
          format: date-time
        deactivationDate:
          type: string
          format: date-time
        ownerId:
          type: string
        technicalOwnerId:
          type: string
        agentEnabled:
          type: boolean
        kbReferencesEnabled:
          type: boolean
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    AccountSearchPayload:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Case-insensitive match against account name or Salesforce ID.

    AccountSearchResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    AccountContactSearchPayload:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Searches across contact name and email (case-insensitive).
        pagination:
          $ref: '#/components/schemas/Pagination'

    AccountContactSearchResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
              isPrimary:
                type: boolean
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Project:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        sfId:
          type: string
        name:
          type: string
        projectKey:
          type: string
        subscriptionType:
          type: string
          enum:
            - development_support
            - managed_cloud_subscription
            - evaluation_subscription
            - subscription
            - cloud_evaluation_support
            - internal
            - platformer_subscription
            - cloud_support
            - professional_services
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing ServiceNow
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectSearchPayload:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
          description: Case-insensitive match against name, key, and subscription type.

    ProjectSearchResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProjectContactSearchPayload:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Searches across contact name and email (case-insensitive).
        pagination:
          $ref: '#/components/schemas/Pagination'

    ProjectContactSearchResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
              registrationState:
                type: string
              notificationsEnabled:
                type: boolean
              roles:
                type: array
                items:
                  type: string
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ProjectUpdateRequest:
      type: object
      minProperties: 1
      description: >
        All fields are optional individually, but at least one is required —
        enforced by the entity service, which 400s if none is set.
      properties:
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        endDateClosureState:
          type: string
        invoiceDueDateClosureState:
          type: string
        complianceViolationClosureState:
          type: string
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing ServiceNow
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectUpdateResult:
      type: object
      properties:
        id:
          type: string
        updatedBy:
          type: string
        updatedOn:
          type: string
          format: date-time
        closureState:
          type: string
          nullable: true
        endDateClosureState:
          type: string
          nullable: true
        invoiceDueDateClosureState:
          type: string
          nullable: true
        complianceViolationClosureState:
          type: string
          nullable: true
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true

    ProjectUpdateResponse:
      type: object
      properties:
        message:
          type: string
        project:
          $ref: '#/components/schemas/ProjectUpdateResult'

    CreateIncidentRequest:
      type: object
      required:
        - callerId
        - category
        - serviceId
        - impact
        - urgency
        - subject
      properties:
        callerId:
          type: string
          format: uuid
        category:
          type: string
          enum: [INQUIRY, SERVICE_INTERRUPTION, SECURITY]
        subcategory:
          type: string
          description: >
            One of a large fixed set of subcategory codes (e.g. DHCP, MEMORY,
            PHISHING). Not enumerated here in full; forwarded verbatim to the
            entity service, which validates it.
        serviceId:
          type: string
          format: uuid
        serviceOfferingId:
          type: string
          format: uuid
        configurationItemId:
          type: string
          format: uuid
        contactType:
          type: string
          enum:
            - SELF_SERVICE
            - EMAIL
            - WALK_IN
            - AZURE
            - EMAIL_INTERNAL
            - SITE_247
            - DIRECT
            - PHONE
            - SENTINEL
            - VIRTUAL_AGENT
            - CHAT
            - EMAIL_EXTERNAL
        impact:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        urgency:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        assignmentGroupId:
          type: string
          format: uuid
        assignedEngineerId:
          type: string
          format: uuid
        subject:
          type: string
        watchList:
          type: array
          items:
            type: string
        additionalComments:
          type: string
        workNotes:
          type: string
        parentId:
          type: string
        parentIncidentId:
          type: string
        changeRequestId:
          type: string
        problemId:
          type: string
        causedById:
          type: string

    CreateIncidentResponse:
      type: object
      properties:
        message:
          type: string
        incident:
          type: object
          properties:
            id:
              type: string
            number:
              type: string
            createdOn:
              type: string
              format: date-time
            createdBy:
              type: string

    SearchIncidentsRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Case-insensitive free-text match against incident fields.
            priorities:
              type: array
              items:
                type: string
                enum: [HIGH, MEDIUM, LOW]
            parentIds:
              type: array
              items:
                type: string
            number:
              type: string
              description: Exact match against the incident's human-readable number (e.g. "INC0010001").
            filters:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  op:
                    type: string
                  values:
                    type: array
                    items:
                      type: string
              description: >
                Generic field/op/values filter array. Forwarded verbatim; the
                entity service validates the supported field/op combinations.
        sortBy:
          type: object
          properties:
            field:
              type: string
              enum: [createdOn, updatedOn, openedOn]
            order:
              type: string
              enum: [asc, desc]
        pagination:
          $ref: '#/components/schemas/Pagination'

    SearchIncidentView:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        openedOn:
          type: string
          format: date-time
        subject:
          type: string
        caller:
          type: object
          additionalProperties: true
        priority:
          type: string
        state:
          type: string
        category:
          type: string
        parent:
          type: object
          additionalProperties: true
        parentIncident:
          type: object
          additionalProperties: true
        assignmentGroup:
          type: object
          additionalProperties: true
        assignedTo:
          type: object
          additionalProperties: true
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: string

    SearchIncidentsResponse:
      type: object
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/SearchIncidentView'
