        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        "201":
          description: The incident was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIncidentResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
