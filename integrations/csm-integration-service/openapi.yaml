        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: GatewayTimeout (the upstream did not answer in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update closure-state fields or hasAgent/hasKbReferences toggles on a project.
      description: >
        external-data-source only. Used by the Account Closure Process (ACP)
        automation to write closure-state fields on a project. The request body
        is forwarded to the entity service verbatim — at least one field is
        required, and the entity service enforces that (400 if none is set).
        This operation requires a forwarded end-user identity token on the
        entity-service side; this service is strictly M2M with no mechanism to
        supply one, so every call here currently receives a mapped 401. Kept
        for API-shape completeness, not because it currently succeeds.
      operationId: updateProject
      security:
        - oauth2ClientCredentials:
            - projects:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Closure-state fields to update. At least one is required.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        "200":
          description: The project was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdateResponse'
        "400":
          description: >-
            BadRequest. Entity-service's validation message is passed through when
            it is safe to show, e.g. `sortBy: "name" is not a valid sort field; use
            endDate`; otherwise "Invalid request payload."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported a missing or invalid forwarded identity — always, for this operation, given this service's M2M-only design)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (the caller's token lacks this operation's scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: GatewayTimeout (the upstream did not answer in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

