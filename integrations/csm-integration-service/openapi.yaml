        "403":
          description: Forbidden (the caller's token lacks the `contacts:read` scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
