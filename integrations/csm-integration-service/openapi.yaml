openapi: 3.0.1
info:
  title: CSM Integration Service API
  version: 1.0.0
  description: >
    Project/account search and their Contacts sub-resource, incident
    creation, and alert-incident mapping create/lookup, for third-party
    (M2M) consumers. Fronted by Choreo's API Manager gateway (subscription +
    client credentials), which authenticates every caller; this service
    performs no authentication of its own.

    Authorization is per operation: every operation except GET /health
    names the one OAuth2 scope it requires (see the `oauth2ClientCredentials`
    security scheme for the full list), and the service enforces it from the
    scope claim of the caller token the gateway forwards. A request with no
    usable token is answered 401; one whose token lacks the operation's
    scope is answered 403, before anything is forwarded upstream.

    Request bodies: every body is capped at 1 MiB (413 above that) and must
    be valid JSON (400 otherwise). An operation whose requestBody is marked
    required rejects an empty body with 400; the read-only searches marked
    required: false (contacts, opportunities, invoices, project-opportunity
    links) treat an empty body as "no filters".
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check endpoint.
      description: >
        Reports whether this service can reach the entity service it forwards
        every other operation to. The result is cached for up to 15 seconds,
        so a change in reachability shows within that window. Requires no
        token and no scope.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ok — the entity service is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: ServiceUnavailable — the entity service is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /accounts/{id}:
    get:
      summary: Get an account by ID.
      operationId: getAccount
      security:
        - oauth2ClientCredentials:
            - accounts:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The account with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (no usable caller token was forwarded by the gateway, or the upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (the caller's token lacks the `accounts:read` scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: GatewayTimeout (the upstream did not answer in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/search:
    post:
      summary: Search accounts.
      operationId: searchAccounts
      security:
        - oauth2ClientCredentials:
            - accounts:read
      requestBody:
        description: Account search payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSearchPayload'
      responses:
        "200":
          description: Accounts matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (no usable caller token was forwarded by the gateway, or the upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (the caller's token lacks the `accounts:read` scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: TooManyRequests (the upstream is rate limiting; its Retry-After header is passed through when it sends a well-formed one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: GatewayTimeout (the upstream did not answer in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}/contacts/search:
    post:
      summary: Search contacts for an account.
      operationId: searchAccountContacts
      security:
        - oauth2ClientCredentials:
            - contacts:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Account contact search payload. Optional; an empty body means no filters.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountContactSearchPayload'
      responses:
        "200":
          description: Contacts for the given account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContactSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (no usable caller token was forwarded by the gateway, or the upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden (the caller's token lacks the `contacts:read` scope, or the upstream refused the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
