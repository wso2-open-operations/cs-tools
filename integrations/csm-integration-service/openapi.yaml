          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alert-incident-mappings:
    post:
      summary: Create an alert-incident mapping.
      description: >
        Postgres-only entity-service operation with no ServiceNow dependency —
        unlike POST /incidents above, this does not require a forwarded
        end-user identity token, so this service's M2M identity is sufficient
        and the call is expected to actually succeed today. The request body
        is forwarded to the entity service verbatim.
      operationId: createAlertIncidentMapping
      requestBody:
        description: Alert-incident mapping details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertIncidentMappingRequest'
      responses:
        "201":
          description: The alert-incident mapping was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertIncidentMappingView'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (Choreo gateway rejected an unauthenticated M2M caller; not expected from the entity service itself for this operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Conflict (an alert-incident mapping with this alertNumber already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alert-incident-mappings/lookup:
    post:
      summary: Look up alert-incident mappings by source and unique identifier.
      description: >
        Postgres-only entity-service operation with no ServiceNow dependency —
        same situation as POST /alert-incident-mappings above; expected to
        actually succeed today. Returns an empty `mappings` array (not 404)
        when nothing matches.
      operationId: lookupAlertIncidentMappings
      requestBody:
        description: Lookup criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupAlertIncidentMappingsRequest'
      responses:
        "200":
          description: Alert-incident mappings matching the lookup criteria (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupAlertIncidentMappingsResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (Choreo gateway rejected an unauthenticated M2M caller; not expected from the entity service itself for this operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vulnerabilities/sync:
    post:
      summary: Full-replace sync of product-vulnerability records.
      description: >
        This is a full-replace sync, not an incremental delta: the caller must
        submit the complete current set of product-vulnerability records on
        every call. The entity service's downstream ServiceNow-backed operation
        deletes any existing record not present in the submitted set. The
        request body is forwarded to the entity service verbatim.
      operationId: syncProductVulnerabilities
      requestBody:
        description: Complete current set of product-vulnerability records.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVulnerabilitySyncPayload'
      responses:
        "201":
          description: The sync was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVulnerabilitySyncResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (upstream reported an authorization failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          # Placeholder — fill in with the actual token endpoint for this service's
          # Choreo-managed API once it's provisioned. Not a real/guessed URL.
          tokenUrl: "<token_url>"
          scopes: {}

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results per page.
        offset:
          type: integer
          description: Zero-based offset into the result set.

    Account:
      type: object
      properties:
        id:
          type: string
        sfId:
          type: string
        name:
          type: string
        tier:
          type: string
          enum: [basic, enterprise]
        region:
          type: string
        activationDate:
          type: string
          format: date-time
        deactivationDate:
          type: string
          format: date-time
        ownerId:
          type: string
        technicalOwnerId:
          type: string
        agentEnabled:
          type: boolean
        kbReferencesEnabled:
          type: boolean
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    AccountSearchPayload:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Case-insensitive match against account name or Salesforce ID.

    AccountSearchResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    AccountContactSearchPayload:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Searches across contact name and email (case-insensitive).
        pagination:
          $ref: '#/components/schemas/Pagination'

    AccountContactSearchResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
              isPrimary:
                type: boolean
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Project:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        sfId:
          type: string
        name:
          type: string
        projectKey:
          type: string
        subscriptionType:
          type: string
          enum:
            - development_support
            - managed_cloud_subscription
            - evaluation_subscription
            - subscription
            - cloud_evaluation_support
            - internal
            - platformer_subscription
            - cloud_support
            - professional_services
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing ServiceNow
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectSearchPayload:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
          description: Case-insensitive match against name, key, and subscription type.

    ProjectSearchResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProjectContactSearchPayload:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Searches across contact name and email (case-insensitive).
        pagination:
          $ref: '#/components/schemas/Pagination'

    ProjectContactSearchResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
              registrationState:
                type: string
              notificationsEnabled:
                type: boolean
              roles:
                type: array
                items:
                  type: string
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ProjectUpdateRequest:
      type: object
      minProperties: 1
      description: >
        All fields are optional individually, but at least one is required —
        enforced by the entity service, which 400s if none is set.
      properties:
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        endDateClosureState:
          type: string
        invoiceDueDateClosureState:
          type: string
        complianceViolationClosureState:
          type: string
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing ServiceNow
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectUpdateResult:
      type: object
      properties:
        id:
          type: string
        updatedBy:
          type: string
        updatedOn:
          type: string
          format: date-time
        closureState:
          type: string
          nullable: true
        endDateClosureState:
          type: string
          nullable: true
        invoiceDueDateClosureState:
          type: string
          nullable: true
        complianceViolationClosureState:
          type: string
          nullable: true
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true

    ProjectUpdateResponse:
      type: object
      properties:
        message:
          type: string
        project:
          $ref: '#/components/schemas/ProjectUpdateResult'

    CaseUpdateRequest:
      type: object
      minProperties: 1
      description: >
        state, severity, and workState are mutually exclusive of each other
        and of every other field in this request — exactly one of them, or
        one combination of the other (ServiceNow-only) fields, is required
        per call. Only state/severity/workState succeed through this
        M2M-only service; every other field requires a forwarded end-user
        identity token this service cannot supply. See the entity service's
        own OpenAPI spec for the full field set and combination rules — this
        is deliberately not fully re-specified here.
      properties:
        state:
          type: string
        severity:
          type: string
        workState:
          type: string
      additionalProperties: true

    CaseUpdateResult:
      type: object
      properties:
        id:
          type: string
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: string
        state:
          type: string
        severity:
          type: string
        workState:
          type: string
          nullable: true
      additionalProperties: true

    CaseUpdateResponse:
      type: object
      properties:
        message:
          type: string
        case:
          $ref: '#/components/schemas/CaseUpdateResult'

    CaseCommentCreateRequest:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          description: Comment type, e.g. comment, work_note, or activity.
        content:
          type: string

    CaseCommentCreateResult:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string

    CaseCommentCreateResponse:
      type: object
      properties:
        message:
          type: string
        comment:
          $ref: '#/components/schemas/CaseCommentCreateResult'

    EntityRef:
      type: object
      description: A minimal reference to another entity — id plus a display name.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true

    SearchOpportunitiesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        accountId:
          type: string
          format: uuid
          description: Restrict to opportunities linked to this account.

    Opportunity:
      type: object
      description: >
        Sourced from ServiceNow's Salesforce-sync data (ServiceNow data source only;
        no Postgres equivalent). Every field but id is nullable — ServiceNow can
        omit any of them entirely for a sparsely-populated row.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        account:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        eulaVersion:
          type: string
          nullable: true
        eulaVersionDecimal:
          type: string
          nullable: true

    SearchOpportunitiesResponse:
      type: object
      properties:
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/Opportunity'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    SearchInvoicesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        opportunityId:
          type: string
          format: uuid
          description: Restrict to invoices linked to this opportunity.

    Invoice:
      type: object
      description: >
        Sourced from ServiceNow's Salesforce-sync data (ServiceNow data source only;
        no Postgres equivalent). Every field but id is nullable — ServiceNow can
        omit any of them entirely for a sparsely-populated row.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        invoicedAmount:
          type: string
          nullable: true
        invoiceDate:
          type: string
          format: date
          nullable: true
        invoicedPaidDate:
          type: string
          format: date
          nullable: true
          description: Date the invoice was paid, if paid.
        invoicedDueDate:
          type: string
          format: date
          nullable: true
        invoiceOriginalDueDate:
          type: string
          format: date
          nullable: true
          description: The invoice's original due date before any extension.
        opportunity:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        classification:
          type: string
          nullable: true
          description: Short classification code (e.g. "CL").

    SearchInvoicesResponse:
      type: object
      properties:
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    SearchProjectOpportunityLinksRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        projectId:
          type: string
          format: uuid
          description: Restrict to links for this project.
        opportunityId:
          type: string
          format: uuid
          description: Restrict to links for this opportunity.

    ProjectOpportunityLink:
      type: object
      description: >
        Sourced from ServiceNow's Salesforce-sync data (ServiceNow data source only;
        no Postgres equivalent). Every field but id is nullable — ServiceNow can
        omit either reference entirely for a sparsely-populated row.
      properties:
        id:
          type: string
          format: uuid
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        opportunity:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityRef'

    SearchProjectOpportunityLinksResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/ProjectOpportunityLink'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CreateIncidentRequest:
      type: object
      required:
        - callerId
        - category
        - serviceId
        - impact
        - urgency
        - subject
      properties:
        callerId:
          type: string
          format: uuid
        category:
          type: string
          enum: [INQUIRY, SERVICE_INTERRUPTION, SECURITY]
        subcategory:
          type: string
          description: >
            One of a large fixed set of subcategory codes (e.g. DHCP, MEMORY,
            PHISHING). Not enumerated here in full; forwarded verbatim to the
            entity service, which validates it.
        serviceId:
          type: string
          format: uuid
        serviceOfferingId:
          type: string
          format: uuid
        configurationItemId:
          type: string
          format: uuid
        contactType:
          type: string
          enum:
            - SELF_SERVICE
            - EMAIL
            - WALK_IN
            - AZURE
            - EMAIL_INTERNAL
            - SITE_247
            - DIRECT
            - PHONE
            - SENTINEL
            - VIRTUAL_AGENT
            - CHAT
            - EMAIL_EXTERNAL
        impact:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        urgency:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        assignmentGroupId:
          type: string
          format: uuid
        assignedEngineerId:
          type: string
          format: uuid
        subject:
          type: string
        watchList:
          type: array
          items:
            type: string
        additionalComments:
          type: string
        workNotes:
          type: string
        parentId:
          type: string
        parentIncidentId:
          type: string
        changeRequestId:
          type: string
        problemId:
          type: string
        causedById:
          type: string

    CreateIncidentResponse:
      type: object
      properties:
        message:
          type: string
        incident:
          type: object
          properties:
            id:
              type: string
            number:
              type: string
            createdOn:
              type: string
              format: date-time
            createdBy:
              type: string

    SearchIncidentsRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
              description: Case-insensitive free-text match against incident fields.
            priorities:
              type: array
              items:
                type: string
                enum: [HIGH, MEDIUM, LOW]
            parentIds:
              type: array
              items:
                type: string
            number:
              type: string
              description: Exact match against the incident's human-readable number (e.g. "INC0010001").
            filters:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  op:
                    type: string
                  values:
                    type: array
                    items:
                      type: string
              description: >
                Generic field/op/values filter array. Forwarded verbatim; the
                entity service validates the supported field/op combinations.
        sortBy:
          type: object
          properties:
            field:
              type: string
              enum: [createdOn, updatedOn, openedOn]
            order:
              type: string
              enum: [asc, desc]
        pagination:
          $ref: '#/components/schemas/Pagination'

    SearchIncidentView:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        openedOn:
          type: string
          format: date-time
        subject:
          type: string
        caller:
          type: object
          additionalProperties: true
        priority:
          type: string
        state:
          type: string
        category:
          type: string
        parent:
          type: object
          additionalProperties: true
        parentIncident:
          type: object
          additionalProperties: true
        assignmentGroup:
          type: object
          additionalProperties: true
        assignedTo:
          type: object
          additionalProperties: true
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: string

    SearchIncidentsResponse:
      type: object
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/SearchIncidentView'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateAlertIncidentMappingRequest:
      type: object
      required:
        - alertNumber
        - source
        - alertStatus
        - incidentId
      properties:
        alertNumber:
          type: string
        source:
          type: string
        uniqueIdentifier:
          type: string
        service:
          type: string
        metricName:
          type: string
        alertStatus:
          type: string
        incidentId:
          type: string
          format: uuid
        incidentNumber:
          type: string

    LookupAlertIncidentMappingsRequest:
      type: object
      required:
        - source
        - uniqueIdentifier
      properties:
        source:
          type: string
        uniqueIdentifier:
          type: string

    AlertIncidentMappingView:
      type: object
      properties:
        id:
          type: string
        alertNumber:
          type: string
        source:
          type: string
        uniqueIdentifier:
          type: string
        service:
          type: string
        metricName:
          type: string
        alertStatus:
          type: string
        incidentId:
          type: string
        incidentNumber:
          type: string
        createdAt:
          type: string
          format: date-time

    LookupAlertIncidentMappingsResponse:
      type: object
      properties:
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/AlertIncidentMappingView'

    ProductVulnerabilitySyncPayload:
      type: array
      description: >
        The complete current set of product-vulnerability records. Any record
        omitted from this array is treated as removed by the downstream sync.
      items:
        type: object
        additionalProperties: true
        description: >
          Opaque per-record payload passed through to the entity service
          as-is — its shape is not defined or validated by this layer.

    ProductVulnerabilitySyncResponse:
      type: object
      description: >
        Fields may be partial or omitted depending on the entity service's
        response for a given sync.
      properties:
        insertedRecords:
          type: integer
        updatedRecords:
          type: integer
        deletedRecords:
          type: integer
