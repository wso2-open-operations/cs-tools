<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New project access on WSO2 Support</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%;">
          <tr>
            <td style="padding:0 8px 12px 8px; font-size:13px; color:#3f3f46;">
              <b>New project access</b> for <!-- [DISPLAY_NAME] -->
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff; border:1px solid #e4e4e7; border-radius:6px; padding:24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:14px; color:#3f3f46; line-height:22px;">
                    <p style="margin:0 0 18px;">The project <b><!-- [PROJECT_NAME] --></b> (<!-- [PROJECT_KEY] -->) has been added to your WSO2 Support Portal account.</p>
<!-- [BLOCK:ROLES_START] -->
                    <p style="margin:0 0 18px;">Your role: <!-- [ROLES] --></p>
<!-- [BLOCK:ROLES_END] -->
                    <p style="margin:0 0 18px;">You already have a WSO2 account. Sign in as usual with your email address, <b><!-- [EMAIL] --></b>, to see the new project.</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:6px;">
                    <a href="<!-- [PORTAL_URL] -->" style="font-size:14px; font-weight:600; color:rgb(71,96,146); text-decoration:underline;">
                      Sign in to the Support Portal
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 8px 0 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:12px; color:#71717a;">This message was sent by WSO2's support system.</td>
                  <td align="right">
                    <img src="<!-- [LOGO_SRC] -->" alt="WSO2" width="113" height="28" style="display:block; border:0;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
