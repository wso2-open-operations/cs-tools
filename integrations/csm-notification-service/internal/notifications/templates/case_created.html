<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- [CASE_TITLE] --></title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="1200" cellpadding="0" cellspacing="0" style="max-width:1200px; width:100%;">
          <!-- [BLOCK:INTENDED_FOR_START] -->
          <tr>
            <td style="padding:0 8px 4px 8px; font-size:11px; color:#a1a1aa;">Expected sent to: <!-- [INTENDED_FOR] --></td>
          </tr>
          <!-- [BLOCK:INTENDED_FOR_END] -->
          <tr>
            <td style="padding:0 8px 12px 8px; font-size:13px; color:#3f3f46;">
              <!-- [REPORTER_NAME] --> <b>created</b> a case
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff; border:1px solid #e4e4e7; border-radius:6px; padding:24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:13px; font-weight:600; color:#4f7942;">
                    <!-- [PROJECT_NAME] --> / <!-- [CASE_NUMBER] -->
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:4px; padding-bottom:16px; border-bottom:1px solid #e4e4e7;">
                    <a href="<!-- [CASE_LINK] -->" style="color:rgb(71,96,146); font-size:18px; font-weight:600; text-decoration:none;">
                      <!-- [CASE_TITLE] -->
                    </a>
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:16px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" style="font-size:14px; color:#18181b;">
                      <tr>
                        <td style="color:#71717a; width:110px; padding:2px 0; vertical-align:top;">Case Type</td>
                        <td style="padding:2px 0;"><!-- [CASE_TYPE] --></td>
                      </tr>
                      <!-- [BLOCK:PRIORITY_START] -->
                      <tr>
                        <td style="color:#71717a; width:110px; padding:2px 0; vertical-align:top;">Priority</td>
                        <td style="padding:2px 0;"><!-- [PRIORITY] --></td>
                      </tr>
                      <!-- [BLOCK:PRIORITY_END] -->
                      <!-- [BLOCK:PRODUCT_START] -->
                      <tr>
                        <td style="color:#71717a; width:110px; padding:2px 0; vertical-align:top;">Product</td>
                        <td style="padding:2px 0;"><!-- [PRODUCT] --></td>
                      </tr>
                      <!-- [BLOCK:PRODUCT_END] -->
                      <tr>
                        <td style="color:#71717a; width:110px; padding:2px 0; vertical-align:top;">Reported</td>
                        <td style="padding:2px 0;"><!-- [REPORTER_NAME] --></td>
                      </tr>
                      <tr>
                        <td style="color:#71717a; width:110px; padding:2px 0; vertical-align:top;">Created</td>
                        <td style="padding:2px 0;"><!-- [CREATED_AT] --></td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:20px; border-top:1px solid #e4e4e7; font-size:14px; line-height:1.6; color:#18181b;">
                    <!-- [DESCRIPTION] -->
                  </td>
                </tr>
                <!-- [BLOCK:IMPACT_START] -->
                <tr>
                  <td style="padding-top:20px; font-size:14px; color:#18181b;">
                    <div style="font-weight:600; text-decoration:underline; margin-bottom:4px;">Incident Impact Description</div>
                    <div><!-- [INCIDENT_IMPACT_DESCRIPTION] --></div>
                  </td>
                </tr>
                <!-- [BLOCK:IMPACT_END] -->
                <tr>
                  <td style="padding-top:24px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td>
                          <a href="<!-- [COMMENT_LINK] -->" style="font-size:14px; font-weight:600; color:rgb(71,96,146); text-decoration:underline;">
                            Add Comment
                          </a>
                        </td>
                        <td style="padding-left:16px;">
                          <a href="<!-- [CASE_LINK] -->" style="font-size:14px; font-weight:600; color:#3f3f46; text-decoration:underline;">
                            View Case
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 8px 0 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:12px; color:#71717a;">This message was sent by WSO2's support system.</td>
                  <td align="right">
                    <img src="<!-- [LOGO_SRC] -->" alt="WSO2" width="113" height="28" style="display:block; border:0;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
