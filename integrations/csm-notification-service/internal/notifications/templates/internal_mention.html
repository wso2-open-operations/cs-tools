<!DOCTYPE html>

<head>

<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">

          <tr>
            <td style="padding:0 8px 12px 8px; font-size:13px; color:#3f3f46;">
              <!-- [NAME] --> <b>mentioned you</b> in a work note on <a href="<!-- [CASE_LINK] -->" style="color:rgb(71,96,146); text-decoration:none;"><!-- [CASE_NUMBER] --></a>

          </tr>
          <tr>
            <td style="background-color:#ffffff; border:1px solid #e4e4e7; border-radius:6px; padding:24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:14px; line-height:1.6; color:#18181b;">
                    <!-- [CASE_COMMENT] -->
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:24px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>

                            Add Comment
                          </a>
                        </td>
                        <td style="padding-left:16px;">
                          <a href="<!-- [CASE_LINK] -->" style="font-size:14px; font-weight:600; color:#3f3f46; text-decoration:underline;">
                            View Case
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 8px 0 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:12px; color:#71717a;">This message was sent by WSO2's support system.</td>
                  <td align="right">
                    <img src="<!-- [LOGO_SRC] -->" alt="WSO2" width="113" height="28" style="display:block; border:0;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
