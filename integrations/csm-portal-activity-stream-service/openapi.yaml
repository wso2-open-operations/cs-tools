openapi: 3.0.1
info:
  title: CSM Activity Stream Service Health
  description: Health check endpoint for csm-portal-activity-stream-service.
  version: 1.0.0
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check.
      description: >
        Returns 200 OK if the service is running. When the event consumer
        is configured, returns 503 while it is not running (not yet
        started, restarting after an unexpected exit, or stopped), since
        the replica cannot deliver live updates then. No auth required.
      operationId: getHealth
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: ServiceUnavailable (event consumer not running)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unavailable]