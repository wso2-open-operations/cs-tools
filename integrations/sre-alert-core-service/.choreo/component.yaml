schemaVersion: 1.2

endpoints:
  - name: alertz
    displayName: Alertz
    service:
      basePath: /alertz
      port: 8080
    type: REST
    networkVisibilities:
      - Project
  - name: healthz
    displayName: Alert Healthz
    service:
      basePath: /healthz
      port: 8080
    type: REST
    networkVisibilities:
      - Public
  - name: livez
    displayName: Alert Livez
    service:
      basePath: /livez
      port: 8080
    type: REST
    networkVisibilities:
      - Project
  - name: dbz
    displayName: Alert DB Health
    service:
      basePath: /dbz
      port: 8080
    type: REST
    networkVisibilities:
      - Public
  # The read API (/alert-mute-rules/{id}/muted-incidents, /alert-mute-rules/muted-counts,
  # /alert-field-values). Keep the gateway's OAuth2 security on: callers (the CSM portal backend and
  # csm-integration-service, ALERT_CORE_BASE_URL there) send a client-credentials token of an app
  # subscribed to this API, and this service lets in only the client ids in ALERT_CORE_READ_CLIENT_IDS,
  # read from the x-jwt-assertion the gateway forwards. Organization, not Project: its URL is https.
  - name: read-api
    displayName: Alert Core Read API
    service:
      basePath: /
      port: 8080
    type: REST
    networkVisibilities:
      - Organization
