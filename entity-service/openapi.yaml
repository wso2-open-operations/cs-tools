openapi: 3.0.1
info:
  title: Entity Service API
  version: 1.0.0
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check endpoint.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ok

  /event-publish-failures:
    post:
      summary: >-
        Record that a backend's publish to the event bus was never
        acknowledged by Event Hub. Replaces the old event_outbox — there is
        no claim/dispatch lifecycle here, since csm-notification-service is a
        pure Kafka consumer now and never talks to this table; this exists
        purely for visibility and manual remediation.
      operationId: createEventPublishFailure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventPublishFailureRequest'
      responses:
        "201":
          description: Row created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPublishFailure'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /event-publish-failures/search:
    post:
      summary: Search event_publish_failures rows, newest first, optionally filtered by resolution state.
      operationId: searchEventPublishFailures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEventPublishFailuresRequest'
      responses:
        "200":
          description: Rows matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEventPublishFailuresResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /event-publish-failures/{id}/resolve:
    post:
      summary: >-
        Mark a row resolved (e.g. after successfully republishing the event
        by hand). Idempotent — resolving an already-resolved row is a no-op
        success that preserves the original resolvedOn.
      operationId: resolveEventPublishFailure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPublishFailure'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Row not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      summary: Get the profile of the currently authenticated user.
      description: >
        Returns profile fields for the user identified by the x-user-id-token header.
        Supported by the ServiceNow data source only.
      operationId: getUserMe
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserMeResponse'
        "401":
          description: Unauthorized — x-user-id-token header is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update the profile of the currently authenticated user.
      description: >
        Updates mutable profile fields for the user identified by the x-user-id-token header.
        Supported by the ServiceNow data source only.
      operationId: patchUserMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserMeRequest'
      responses:
        "200":
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchUserMeResponse'
        "400":
          description: Bad request — missing or invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized — x-user-id-token header is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      summary: Get one user's full profile.
      description: >
        Returns the user row plus group and team membership, and for external contacts
        their per-project access with the reason access is or is not granted. ServiceNow
        data source only. A deactivated user is still returned — that state is usually the
        answer the caller is looking for.
      operationId: getUser
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SNUserDetail'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/search:
    post:
      summary: Search users with optional filters, sort, and pagination.
      description: >
        Returns a paginated list of users. When the data source is ServiceNow
        the response uses `SNUser` (name, timeZone, active, roles); when the
        data source is postgres it uses `User` (firstName, lastName, userType).
      operationId: searchUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchUsersRequest'
      responses:
        "200":
          description: Users matching the supplied filters.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SearchUsersResponse'
                  - $ref: '#/components/schemas/SearchSNUsersResponse'
        "400":
          description: Bad request — invalid filter value, sort field, or pagination limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}:
    get:
      summary: Get an account by ID.
      operationId: getAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The account with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SNAccountDetail'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/search:
    post:
      summary: Search accounts by name or Salesforce ID.
      operationId: searchAccounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAccountsRequest'
      responses:
        "200":
          description: Accounts matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAccountsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}/contacts/search:
    post:
      summary: Search contacts for an account.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: searchAccountContacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAccountContactsRequest'
      responses:
        "200":
          description: Contacts matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAccountContactsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}:
    get:
      summary: Get a project by ID.
      operationId: getProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailsView'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update a project's closure-state fields or hasAgent/hasKbReferences toggles.
      description: >
        ServiceNow data source only; there is no Postgres equivalent. At least one
        field must be provided. closureState itself is not settable — it is derived
        automatically from the three closure sub-state fields by an SN business
        rule, so setting one of those and re-fetching the project is how a caller
        observes the resulting overall status.
      operationId: updateProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        "200":
          description: The project was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdateResponse'
        "400":
          description: Bad request — no field provided, or an invalid value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Missing or invalid x-user-id-token header (ServiceNow data source only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/search:
    post:
      summary: Search projects by name, key, or subscription type.
      operationId: searchProjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProjectsRequest'
      responses:
        "200":
          description: Projects matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/contacts/{contactId}:
    get:
      summary: Get one contact's attributes for a single project.
      description: >
        Returns the contact's roles on this project, their registration state and their
        notification preference. ServiceNow data source only. Returns 404 when the contact is
        not a contact on this project — including when their row has no linked contact record
        and therefore no id to match.
      operationId: getProjectContact
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The contact's attributes for this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContact'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contact not found on this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/contacts/search:
    post:
      summary: Search contacts for a project.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: searchProjectContacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProjectContactsRequest'
      responses:
        "200":
          description: Contacts matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectContactsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/metadata:
    get:
      summary: Get a project's reference metadata (choice lists, feature flags).
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: getProjectMetadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The project's reference metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMetadataResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/stats:
    get:
      summary: Get a project's overall statistics.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: getProjectStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The project's overall statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/cases/stats:
    get:
      summary: Get a project's case statistics, optionally filtered by case type and/or creator.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: getProjectCaseStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: caseTypes
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [case, default_case, service_request, security_report_analysis, announcement, engagement]
          description: >
            Restrict to these case types, one of case/service_request/
            security_report_analysis/announcement/engagement (matching the
            case-search type filter's vocabulary — translated to ServiceNow's
            own caseTypes values internally, e.g. case → default_case).
            `default_case` is also accepted as an alias for `case` — see
            CreateCaseRequest.type's description. Repeated for multiple
            values, e.g. ?caseTypes=a&caseTypes=b.
        - name: createdBy
          in: query
          required: false
          schema:
            type: string
          description: Restrict to cases created by this user.
      responses:
        "200":
          description: The project's case statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCaseStatsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/conversations/stats:
    get:
      summary: Get a project's conversation statistics, optionally filtered by creator.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: getProjectConversationStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: createdBy
          in: query
          required: false
          schema:
            type: string
          description: Restrict to conversations created by this user.
      responses:
        "200":
          description: The project's conversation statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConversationStatsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/deployments/stats:
    get:
      summary: Get a project's deployment statistics.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: getProjectDeploymentStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The project's deployment statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDeploymentStatsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/time-cards/stats:
    get:
      summary: Get a project's time-card statistics, optionally filtered by a date range.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: getProjectTimeCardStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Restrict to time cards on or after this date (yyyy-MM-dd).
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Restrict to time cards on or before this date (yyyy-MM-dd).
      responses:
        "200":
          description: The project's time-card statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTimeCardStatsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/change-requests/stats:
    get:
      summary: Get a project's change-request statistics.
      description: ServiceNow data source only; there is no Postgres equivalent.
      operationId: getProjectChangeRequestStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The project's change-request statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectChangeRequestStatsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/search:
    post:
      summary: Search products by name.
      description: >
        Returns a paginated list of products matching the search query.
        When the ServiceNow data source is active the response uses
        SearchSNProductsResponse (no timestamp fields; class is a ServiceNow label).
        Otherwise the response uses SearchProductsResponse.
      operationId: searchProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProductsRequest'
      responses:
        "200":
          description: Products matching the search query.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SearchProductsResponse'
                  - $ref: '#/components/schemas/SearchSNProductsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Missing or invalid x-user-id-token header (ServiceNow data source only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}/versions/search:
    post:
      summary: Search versions of a specific product.
      operationId: searchProductVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProductVersionsRequest'
      responses:
        "200":
          description: Product versions matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProductVersionsResponse'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deployments:
    post:
      summary: Create a new deployment.
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        "201":
          description: Deployment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeploymentResponse'
