components:
  schemas:
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results per page. Defaults to 20, capped at 50.
        offset:
          type: integer
          description: Zero-based offset into the result set.

    GetUserMeResponse:
      type: object
      required: [id, email, lastName, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        timeZone:
          type: string
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UserGroupRef'
          description: >
            Every group the caller belongs to, derived from live membership on each call.
            Which of them is a team is deliberately not decided here: the team registry
            that names teams is the caller's own configuration, so the caller maps these
            names to a team. Empty when the best-effort membership lookup failed --
            it never fails the identity response, so callers must treat an empty list as
            "unknown", not as an error.

    PatchUserMeRequest:
      type: object
      required: [timeZone]
      properties:
        timeZone:
          type: string
          description: User's preferred time zone (e.g. "America/New_York")

    PatchUserMeUpdated:
      type: object
      required: [id, updatedBy, updatedOn]
      properties:
        id:
          type: string
          format: uuid
        updatedBy:
          type: string
        updatedOn:
          type: string

    PatchUserMeResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/PatchUserMeUpdated'

    SearchUsersRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UserPagination'
        filters:
          $ref: '#/components/schemas/SearchUsersFilters'
        sortBy:
          $ref: '#/components/schemas/UserSortBy'

    UserPagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: Number of results per page. Defaults to 10, capped at 50.
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Zero-based offset into the result set.

    SearchUsersFilters:
      type: object
      properties:
        searchQuery:
          type: string
          maxLength: 200
          description: Case-insensitive match against username and email.
        roleIds:
          type: array
          maxItems: 20
          items:
            type: string
          description: Filter by one or more roles. ServiceNow data source only.
        userNames:
          type: array
          maxItems: 50
          items:
            type: string
          description: Filter to specific usernames (exact match).
        emails:
          type: array
          maxItems: 50
          items:
            type: string
          description: Filter to specific email addresses (exact match).
        userIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
          description: >
            Restrict to specific users. Intersects with the other filters. Supplying this
            also lifts the active-only default, so a deactivated user stays retrievable by
            id. ServiceNow data source only.
        groupIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
          description: >
            Restrict to members of these groups. Resolved to a user-id set before the
            upstream call, because the data source cannot join users against group
            membership in one query. ServiceNow data source only.
        groupNames:
          type: array
          maxItems: 50
          items:
            type: string
          description: >
            Restrict to members of the groups with these exact display names, resolved to a
            user-id set exactly as groupIds is. It exists alongside groupIds because a
            caller's team registry is keyed by group name: group ids differ between
            environments while the names do not, and a configured team may carry no id at
            all. ServiceNow data source only.
        active:
          type: boolean
          nullable: true
          description: When set, restricts results to active or inactive users.

    UserSortBy:
      type: object
      properties:
        field:
          type: string
          enum: [name, createdOn, updatedOn]
          description: Column to sort by.
        order:
          type: string
          enum: [asc, desc]
          description: Sort direction.

    User:
      type: object
      description: User as stored in the postgres data source.
      properties:
        id:
          type: string
        userName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        userType:
          type: string
          enum: [internal, customer, system]
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    SNUser:
      type: object
      description: User as returned by the ServiceNow data source.
      properties:
        id:
          type: string
          format: uuid
        userName:
          type: string
        name:
          type: string
        email:
          type: string
        timeZone:
          type: string
          nullable: true
        mobilePhone:
          type: string
          nullable: true
          description: >
            The number the on-call escalation flow dials — the only phone field the
            platform surfaces.
        userType:
          $ref: '#/components/schemas/UserType'
        active:
          type: boolean
        createdOn:
          type: string
        updatedOn:
          type: string
        roles:
          type: array
          items:
            type: string

    UserType:
      type: string
      description: >
        Whether the user is staff or a customer/partner contact. The ServiceNow data source
        emits internal or external; the postgres source emits internal, customer or system.
        Callers branching on staff-vs-not must treat customer and external alike.
      enum: [internal, external, customer, system]

    UserGroupRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    UserProjectAccess:
      type: object
      description: >
        One project-contact row for a user, reported as stored rather than as filtered. A
        row with no linked contact record makes the project, and every case on it, silently
        invisible to that user. grantsCaseAccess mirrors contactRecordPresent directly --
        deliberately not the stricter email-match rule the live access check enforces, since
        that only diverges for integration/system accounts.
      required: [projectId, projectName, projectKey, contactEmail, contactRecordPresent, grantsCaseAccess]
      properties:
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        projectKey:
          type: string
          description: The project's short human-readable key (e.g. "TESTPROSSUB").
        contactEmail:
          type: string
          description: The email as stored on the row itself.
        contactRecordPresent:
          type: boolean
          description: False when the row has no contact record linked.
        contactRecordEmail:
          type: string
          description: The linked record's own email, which may differ from contactEmail.
        registrationState:
          type: string
        notificationsEnabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
        grantsCaseAccess:
          type: boolean

    SNUserDetail:
      type: object
      description: >
        One user's full profile. The membership and project-access blocks are best-effort:
