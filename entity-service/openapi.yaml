              description: >-
                A generic field/op/values filter array. See
                ProblemFieldFilter for the supported field/op combinations.
        groupBy:
          type: string
          enum: [state, assignmentGroup]
          description: The field to aggregate problem counts by.
        maxGroups:
          type: integer
          description: >-
