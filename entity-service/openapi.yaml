        `worstCaseFixEta` are supported only for the ServiceNow data source.
        `resolutionCode`, `cause`, and `closeNotes` are optional and may only be provided alongside
        `state` when the state is `closed` or `solution_proposed`.
      oneOf:
        - required: [state]
        - required: [severity]
        - required: [workState]
        - required: [watchList]
        - required: [assigneeEmail]
        - required: [acknowledge]
        - required: [bestCaseFixEta]
        - required: [mostLikelyFixEta]
        - required: [worstCaseFixEta]
      properties:
        state:
          type: string
          enum: [open, work_in_progress, waiting_on_wso2, awaiting_info, reopened, solution_proposed, closed]
          description: The new state to transition the case to.
        severity:
          type: string
          enum: [catastrophic, critical, high, medium, low]
          description: The new severity of the case.
        workState:
          type: string
          enum: [ongoing, paused]
          description: The new work sub-state of the case. Only applicable when the case state is work_in_progress.
        watchList:
          type: array
          items:
            type: string
            format: email
          description: List of email addresses to set as the case watch list (ServiceNow only).
        assigneeEmail:
          type: string
          format: email
          description: Email of the engineer to assign to this case (ServiceNow only).
        acknowledge:
          type: boolean
          enum: [true]
          description: |
            Acknowledge the case as the calling engineer: a first-write-wins claim that
            someone has seen it and picked it up, which is distinct from assignment.
            Succeeds without changing anything if the case is already acknowledged, in
            which case the response carries `alreadyAcknowledged: true`. Only `true` is
            accepted; there is no way to remove an acknowledgement. Requires an elevated
            support role, and is supported only by data sources that record
            acknowledgement.
        resolutionCode:
          type: string
          enum:
            - SOLVED_FIXED_BY_SUPPORT_GUIDANCE_PROVIDED
            - SOLVED_FIXED_BY_CLOSING_RELATED_INCIDENT
            - SOLVED_FIXED_BY_CLOSING_RELATED_RD_TICKET
            - SOLVED_WORKAROUND_PROVIDED
            - SOLVED_BY_CUSTOMER
            - CONSIDERED_FOR_ROADMAP
            - INCONCLUSIVE_OUT_OF_SCOPE
            - INCONCLUSIVE_CANNOT_REPRODUCE
            - INCONCLUSIVE_NO_WORKAROUND
            - DUPLICATE_ISSUE
            - VOIDED_CANCELED
            - ON_HOLD
            - CONSIDERED_FOR_ROADMAP_ALT
            - SOLVED_FIXED_THE_ISSUE
            - SOLVED_WORKAROUND_PROVIDED_ALT
            - SOLVED_BY_CONTRIBUTOR
            - SOLVED_BY_NOVERA
            - ABRUPTLY_CLOSED_DUE_TO_NON_RESPONSIVENESS
          description: Resolution code. Only allowed when state is closed or solution_proposed.
        cause:
          type: string
          enum:
            - SOLUTION_ARCHITECTURE
            - DEPLOYMENT_ARCHITECTURE
            - USER_ERROR_CONFIGURATION
            - USER_ERROR_PRODUCT_CONCEPT
            - USER_ERROR_RUNTIME
            - USER_ERROR_RECOMMENDATION_BEST_PRACTICES
            - CUSTOMIZATION_LIMITATION
            - CUSTOMIZATION_BUG
            - DOCUMENTATION_GAP
            - DOCUMENTATION_ERROR
            - PRODUCT_LIMITATION
            - PRODUCT_BUG
            - PRODUCT_REGRESSION
            - PRODUCT_MIGRATION
            - INFRASTRUCTURE_DATABASE
            - INFRASTRUCTURE_OS
            - INFRASTRUCTURE_NETWORK
            - INFRASTRUCTURE_JDK
            - INFRASTRUCTURE_LDAP
            - INFRASTRUCTURE_LOAD_BALANCER
            - INFRASTRUCTURE_IAAS
            - INFRASTRUCTURE_EXTERNAL_PRODUCT
            - INFRASTRUCTURE_PROXY
            - INFRASTRUCTURE_OTHER
            - UNKNOWN
          description: Root-cause category. Only allowed when state is closed or solution_proposed.
        closeNotes:
          type: string
          description: Close notes. Only allowed when state is closed or solution_proposed.
        bestCaseFixEta:
          type: string
          format: date
          description: >-
            Internal-only best-case fix-commitment date (date-only, YYYY-MM-DD), visible
            to CSM engineers only (ServiceNow only).
        mostLikelyFixEta:
          type: string
          format: date
          description: >-
            Internal-only most-likely fix-commitment date (date-only, YYYY-MM-DD), visible
            to CSM engineers only (ServiceNow only).
        worstCaseFixEta:
          type: string
          format: date
          description: >-
            Internal-only worst-case fix-commitment date (date-only, YYYY-MM-DD), visible
            to CSM engineers only (ServiceNow only).

