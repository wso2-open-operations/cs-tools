            createdBy:
              type: string
            createdOn:
              type: string
              format: date-time
            state:
              type: string

    CaseFieldFilter:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          enum:
            - type
            - state
            - severity
            - engagementType
            - issueType
            - workState
            - tag
            - projectId
            - deploymentId
            - assignedUserId
            - createdBy
            - createdOn
            - updatedOn
            - closedOn
            - resolvedOn
            - product
            - projectOnboardingStatus
            - projectType
            - creTeam
            - sreTeam
            - accountId
            - resolutionNotes
            - parentId
            - taskSLABusinessElapsedPercent
            - escalationLevel
            - escalation
            - number
            - internalId
        op:
          type: string
          enum: [eq, in, notIn, isEmpty, isNotEmpty, gte, lte]
        values:
          type: array
          items:
            type: string
          description: |
            Required and non-empty for eq/in/notIn/gte/lte; absent/ignored for
            isEmpty/isNotEmpty.
      description: |
        One predicate in a case search's generic filter expression array:
        "field op values". Replaces the old individually-named filter fields
        (types, states, severities, projectIds, ...) with a single extensible
        contract, so a new filtering capability no longer needs a new named
        field threaded through every layer.

        Not every field/op combination is valid; OpenAPI cannot express a
        conditional enum constraint, so the supported combinations are listed
        here instead. A request naming an unsupported field, or a supported
        field with an incompatible op, is rejected with a validation error.

        - **type** (in): case type, one of case/service_request/
          security_report_analysis/announcement/engagement/hosting/
          hosting_query/hosting_task. `default_case` is also accepted as an
          alias for `case` (ServiceNow's own raw caseType wire value; kept
          for the currently-in-production customer-portal frontend, which
          predates this API's `case` enum). For the ServiceNow data source
          each value is translated to its SN caseTypes equivalent (case →
          default_case).
          - `hosting`: a managed-cloud hosting case.
          - `hosting_query`: a managed-cloud hosting query, a lighter-weight
            question than a full hosting case.
          - `hosting_task`: an internal hosting task raised against a
            managed-cloud deployment.
        - **state** (in / notIn): one of open/work_in_progress/
          waiting_on_wso2/awaiting_info/reopened/solution_proposed/closed. in
          matches cases in any of the given states; notIn matches cases in
          none of them. The two are independent and may be combined. notIn is
          not supported inside an anyOf branch, and not supported by the
          relational data source.
        - **severity** (in): one of catastrophic/critical/high/medium/low.
          Only applicable when a type filter includes case.
        - **engagementType** (in): one of migration/consultancy/
          new_feature_improvement/follow_up/onboarding. Only applicable when a
          type filter includes engagement.
        - **issueType** (in): one of error/partial_outage/
          performance_degradation/question/security_or_compliance/
          total_outage.
        - **workState** (in): one of ongoing/paused. Only applicable when
          state is work_in_progress. For the ServiceNow data source, ongoing
          maps to key 1 and paused maps to key 2.
        - **tag** (in / notIn): free-text case tag labels. in matches cases
          carrying any of the given tags; notIn excludes cases carrying any of
          them.
        - **projectId** (in): project UUIDs.
        - **deploymentId** (in): deployment UUIDs.
        - **assignedUserId** (in / isEmpty): in matches assigned-engineer user
          UUIDs; isEmpty (values ignored) matches cases with no assigned
          engineer. isNotEmpty is not supported (no way to express "assigned
          to someone, but not to anyone in particular").
        - **createdBy** (in / eq): in matches a list of literal creator email
          addresses. eq only supports the single literal value
          `"__current_user_email__"`, meaning "the authenticated caller" (the
          old createdByMe:true behavior) — any other literal email must use
          in with a single value instead.
        - **createdOn** / **updatedOn** / **closedOn** / **resolvedOn**
          (gte / lte): a single RFC3339 timestamp or YYYY-MM-DD date bounding
          the case's created, last-updated, closed, or resolved timestamp
          respectively. gte is inclusive "on or after"; lte is inclusive "on
          or before". A lte bound earlier than its own gte bound is rejected
          with a validation error. resolvedOn has no equivalent in the
          relational data source and is rejected there.
        - **product** (in): product family names (e.g. "API Manager",
          "Identity Server", "Asgardeo"). Matches every version of each named
          product. Only applied by the ServiceNow data source.
        - **projectOnboardingStatus** (in / notIn): free-text SN choice labels
          for the parent project's onboarding status (e.g. "Completed",
          "In-Progress", "Not-Applicable" -- not a closed enum at this
          layer). notIn matches cases whose value is NOT one of the given
          labels -- e.g. `{"field": "projectOnboardingStatus", "op": "notIn",
          "values": ["In-Progress"]}` means "onboarding status is not in
          progress".
        - **projectType** (in): the parent project's type, matched by the
          project type's name (e.g. "Subscription").
        - **creTeam** (in): the parent account's CRE (Customer Renewal &
          Expansion) team, as team UUIDs.
        - **sreTeam** (in): the parent account's SRE (Site Reliability
          Engineering) team, as team UUIDs.
        - **accountId** (in): the case's parent customer account, as account
          UUIDs.
        - **resolutionNotes** (isEmpty): values ignored; matches cases with
          empty resolution notes. isNotEmpty is not supported: false and
          omitted were always treated identically for this filter, so there
          is no distinct "resolution notes present" behavior to express.
        - **parentId** (eq): a single case UUID; matches child cases of that
          case (the hierarchical major-case/child-case relationship).
        - **taskSLABusinessElapsedPercent** (gte / lte): a non-negative
          integer. Matches cases with at least one Task SLA record whose
          businessElapsedPercent falls within the given bound(s) (both bounds
          may be supplied together to express a range, e.g. gte 75 + lte 100
          for "at risk or breached"). Not capped at 100: a long-overdue,
          never-resolved SLA's percentage keeps climbing well past it (values
          in the tens of thousands are real, observed data), so 100 means
          "breached", not "the maximum possible value". Only applied by the
          ServiceNow data source (a Task SLA table join); filtering logic is
          confined to the SN adapter.
        - **escalationLevel** (in): one or more escalation level ids, "0"
          (EL0, not escalated) through "5" (EL5, CEO). Matches cases whose
          current escalation level is any of the given ids.
        - **escalation** (isEmpty / isNotEmpty): values ignored; isEmpty
          matches cases with no active escalation, isNotEmpty matches cases
          with an active escalation.
        - **number** (eq): a single case number (e.g. "CS0441174"); matches
          exactly. Routed as a first-class filter rather than through the
          free-text searchQuery scan.
        - **internalId** (eq): a single WSO2 case id; matches exactly. Routed
          as a first-class filter rather than through the free-text
          searchQuery scan.

    CaseFilterBranch:
      type: object
      description: >-
        One branch of SearchCasesFilters.anyOf: a set of CaseFieldFilter
        predicates ANDed together. The predicate array is wrapped in an
        object rather than expressed as a bare array so the branch's AND
        semantics are explicit and named.
      properties:
        filters:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CaseFieldFilter'
          description: >-
            The predicates ANDed together within this branch -- see
            CaseFieldFilter. At least one is required: a branch with no
            predicates constrains nothing, and since the branches are OR'd
            against each other it would widen the entire result set to every
            case rather than narrowing it. Rejected with a 400.
      required: [filters]

    SearchCasesFilters:
      type: object
      properties:
        searchQuery:
          type: string
          description: Case-insensitive match against subject, number, and internal_id.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/CaseFieldFilter'
          description: The generic filter expression array -- see CaseFieldFilter.
        anyOf:
          type: array
          items:
            $ref: '#/components/schemas/CaseFilterBranch'
          description: >-
            Cross-field OR: each entry is a branch whose own filters array is
            ANDed together; the branches themselves are OR'd against each
            other, and the whole anyOf result is
            ANDed with filters (if both are present). Only fields with a
            direct, non-subquery ServiceNow mapping are supported inside a
            branch: type, state, severity, engagementType, issueType,
            workState, projectId, deploymentId, assignedUserId,
            escalationLevel. A branch containing any other field (e.g. tag,
            taskSLABusinessElapsedPercent, createdOn) is rejected with a
            validation error. Requires ServiceNow data source.

    SearchCasesRequest:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/SearchCasesFilters'
        sortBy:
          type: object
          properties:
            field:
              type: string
              enum: [createdOn, updatedOn, severity, state]
              description: Column to sort by. Defaults to createdOn.
            order:
              type: string
              enum: [asc, desc]
              description: Sort direction. Defaults to desc.
        pagination:
          $ref: '#/components/schemas/Pagination'
        groupBy:
          type: string
          enum: [state, severity, type, engagementType, issueType, workState]
          description: >
            When set, the response returns aggregated per-value counts (see
            SearchCasesResponse.groups) instead of a case list. Only fields
            backed by a small fixed enum are groupable. Implemented as a
            fan-out of per-value count queries against the ServiceNow data
            source; not supported by the Postgres data source.

    GroupCasesByRequest:
      type: object
      required: [groupBy]
      properties:
        filters:
          $ref: '#/components/schemas/SearchCasesFilters'
        groupBy:
          type: string
          enum: [account, state, severity, type]
          description: The field to aggregate case counts by.
        maxGroups:
          type: integer
          description: >-
            Caps the response to the top maxGroups buckets by count; the
            remainder is folded into GroupByResponse.othersCount. Optional; a
            default is applied when omitted.

    UserReference:
      type: object
      nullable: true
      description: >-
        Canonical reference to a person: id, email and display name, nothing
        else. Emitted as a sibling of whatever actor fields a response already
        carried, so every "who did this" value has one shape.


        `id` is nullable by design. It is populated only where the backing data
        source already resolves the actor to a user record (comment and
        attachment authors, and the case assignee); it is deliberately left null
        elsewhere (case creator, activity-feed actors, watchers) rather than
        adding a per-row user lookup to hot list endpoints. `email` and `name`
        are populated everywhere, so a consumer that needs the id resolves it
        from the email through its own cached user lookup. The key is always
        present: null means "no id available here", never "this producer is too
        old to send one".
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          description: >-
            The actor as recorded. Usually an email address, but can be a
            non-user identifier such as an automation account.
        name:
          type: string
    AssignedEngineerRef:
      type: object
      nullable: true
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true

    CaseNumberRef:
      type: object
      nullable: true
      properties:
        id:
          type: string
        number:
          type: string
        type:
          type: string
          enum: [case, incident, change_request, problem]
          nullable: true
          description: >
            What kind of record this reference points at. Null when the
            backing data source could not resolve the referenced record's
            kind; a client must not then assume it is a case, since linking
            to a case detail page for a non-case record would 404.

    LinkedChangeRequestRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Human-readable change request number.
        name:
          type: string
          nullable: true
          description: >-
            Change request subject. Null when the record has none — an absent
            subject is never reported as an empty string, so a caller can tell
            "no subject recorded" from a subject deliberately left blank.

    AccountRef:
      type: object
      nullable: true
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string

    UserIDEmailRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    EntityRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    PersonRef:
      type: object
      description: >-
        A compact reference to a person (e.g. an account's manager or
        technical owner), carrying an optional email alongside id/name.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true

    DeployedProductRef:
      type: object
      description: >-
        A deployed product instance, together with the product catalogue entry it
        was deployed from. The two are different records with different ids; they
        often read alike because a catalogue name usually already embeds its
        version. id and displayName are null when the case names a catalogue
        product but no deployed instance of it.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        displayName:
          type: string
          nullable: true
          description: Product name combined with version (e.g. "API Manager 4.3.0").
        product:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Product catalogue entry this instance was deployed from.

    Case:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        internalId:
          type: string
        createdBy:
          type: string
        projectId:
          type: string
        deploymentId:
          type: string
        deployedProductId:
          type: string
        subject:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [catastrophic, critical, high, medium, low]
        issueType:
          type: string
          enum: [error, partial_outage, performance_degradation, question, security_or_compliance, total_outage]
        state:
          type: string
          enum: [open, work_in_progress, waiting_on_wso2, awaiting_info, reopened, solution_proposed, closed]
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        closedOn:
          type: string
          format: date-time
          nullable: true

    CaseView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        internalId:
          type: string
        subject:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [catastrophic, critical, high, medium, low]
        issueType:
          type: string
          enum: [error, partial_outage, performance_degradation, question, security_or_compliance, total_outage]
        state:
          type: string
          enum: [open, work_in_progress, waiting_on_wso2, awaiting_info, reopened, solution_proposed, closed]
        workState:
          type: string
          enum: [ongoing, paused]
          nullable: true
          description: Work sub-state, present only when state is work_in_progress.
        type:
          type: string
          nullable: true
          description: Case type label. Populated for ServiceNow cases; null for Postgres cases.
        engagementType:
          type: string
          nullable: true
          description: Engagement type label. Populated for ServiceNow cases; null for Postgres cases.
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        closedOn:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the case was closed. null if not yet closed.
        createdBy:
          nullable: true
          $ref: '#/components/schemas/UserReference'
        project:
          $ref: '#/components/schemas/EntityRef'
        deployment:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Deployment associated with the case. null for ServiceNow cases with no deployment.
        deployedProduct:
          nullable: true
          $ref: '#/components/schemas/DeployedProductRef'
          description: |
            Deployed product instance named by the case, together with the product
            catalogue entry it was deployed from. A case can name a catalogue product
            without naming a deployed instance of it, in which case this object is still
            returned with id and displayName null and product populated.
        catalog:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Service catalog entry. Populated for ServiceNow cases; null for Postgres cases.
        catalogItem:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Service catalog item. Populated for ServiceNow cases; null for Postgres cases.
        assignedTeam:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Team assigned to the case. Populated for ServiceNow cases; null for Postgres cases.
        conversation:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Linked conversation. Populated for ServiceNow cases; null for Postgres cases.
        assignedEngineer:
          nullable: true
          $ref: '#/components/schemas/UserReference'
          description: Engineer assigned to the case, or null when unassigned.
        acknowledgedBy:
          nullable: true
          $ref: '#/components/schemas/AssignedEngineerRef'
          description: |
            Engineer who acknowledged the case, or null if nobody has. Cleared by the
            backing data source when the case's type or severity changes or it is
            reopened, so a materially changed case has to be acknowledged again.
        parentCase:
          nullable: true
          $ref: '#/components/schemas/CaseNumberRef'
        relatedCase:
          nullable: true
          $ref: '#/components/schemas/CaseNumberRef'
        account:
          nullable: true
          $ref: '#/components/schemas/AccountRef'
        linkedChangeRequests:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/LinkedChangeRequestRef'
          description: >-
            Change requests raised from this case, in no particular order. Only
            service-request cases carry them; absent or empty for every other case
            type. This is a one-to-many relationship: promoting the same change
            through each environment produces one change request per environment,
            all pointing back at the same service request.
        resolvedOn:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the case was resolved. Populated for resolved/closed ServiceNow cases; null otherwise.
        resolutionCode:
          type: string
          nullable: true
          enum: [SOLVED_FIXED_BY_SUPPORT_GUIDANCE_PROVIDED, SOLVED_FIXED_BY_CLOSING_RELATED_INCIDENT, SOLVED_FIXED_BY_CLOSING_RELATED_RD_TICKET, SOLVED_WORKAROUND_PROVIDED, SOLVED_BY_CUSTOMER, CONSIDERED_FOR_ROADMAP, INCONCLUSIVE_OUT_OF_SCOPE, INCONCLUSIVE_CANNOT_REPRODUCE, INCONCLUSIVE_NO_WORKAROUND, DUPLICATE_ISSUE, VOIDED_CANCELED, ON_HOLD, CONSIDERED_FOR_ROADMAP_ALT, SOLVED_FIXED_THE_ISSUE, SOLVED_WORKAROUND_PROVIDED_ALT, SOLVED_BY_CONTRIBUTOR, SOLVED_BY_NOVERA, ABRUPTLY_CLOSED_DUE_TO_NON_RESPONSIVENESS]
          description: Resolution code. Populated for resolved/closed ServiceNow cases; null otherwise.
        cause:
          type: string
          nullable: true
          enum: [SOLUTION_ARCHITECTURE, DEPLOYMENT_ARCHITECTURE, USER_ERROR_CONFIGURATION, USER_ERROR_PRODUCT_CONCEPT, USER_ERROR_RUNTIME, USER_ERROR_RECOMMENDATION_BEST_PRACTICES, CUSTOMIZATION_LIMITATION, CUSTOMIZATION_BUG, DOCUMENTATION_GAP, DOCUMENTATION_ERROR, PRODUCT_LIMITATION, PRODUCT_BUG, PRODUCT_REGRESSION, PRODUCT_MIGRATION, INFRASTRUCTURE_DATABASE, INFRASTRUCTURE_OS, INFRASTRUCTURE_NETWORK, INFRASTRUCTURE_JDK, INFRASTRUCTURE_LDAP, INFRASTRUCTURE_LOAD_BALANCER, INFRASTRUCTURE_IAAS, INFRASTRUCTURE_EXTERNAL_PRODUCT, INFRASTRUCTURE_PROXY, INFRASTRUCTURE_OTHER, UNKNOWN]
          description: Root-cause category. Populated for resolved/closed ServiceNow cases; null otherwise.
        resolutionNotes:
          type: string
          nullable: true
          description: Free-text resolution/close notes. Populated for resolved/closed ServiceNow cases; null otherwise.
        bestCaseFixEta:
          type: string
          format: date
          nullable: true
          description: >-
            Internal-only best-case fix-commitment date (date-only, YYYY-MM-DD), visible to
            CSM engineers only. Populated for ServiceNow cases; null otherwise.
        mostLikelyFixEta:
          type: string
          format: date
          nullable: true
          description: >-
            Internal-only most-likely fix-commitment date (date-only, YYYY-MM-DD), visible
            to CSM engineers only. Populated for ServiceNow cases; null otherwise.
        worstCaseFixEta:
          type: string
          format: date
          nullable: true
          description: >-
            Internal-only worst-case fix-commitment date (date-only, YYYY-MM-DD), visible to
            CSM engineers only. Populated for ServiceNow cases; null otherwise.
        slaResponseTime:
          type: string
          nullable: true
        closedBy:
          $ref: '#/components/schemas/EntityRef'
        hasAutoClosed:
          type: boolean
          nullable: true
        engagementStartDate:
          type: string
          nullable: true
        engagementEndDate:
          type: string
          nullable: true
        engagementPaymentType:
          type: string
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Tag'
          description: >-
            Tags currently attached to the case, fetched via a best-effort lookup against the
            backing data source. null if that lookup failed; the rest of the case detail is
            still valid in that case, not an indication the case has no tags.

    CaseSearchView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        internalId:
          type: string
        number:
          type: string
        createdOn:
          type: string
          description: Creation timestamp. RFC3339 for Postgres; raw SN timestamp string for ServiceNow.
        updatedOn:
          type: string
          description: Last-updated timestamp. RFC3339 for Postgres; raw SN timestamp string for ServiceNow.
        createdBy:
          nullable: true
          $ref: '#/components/schemas/UserReference'
        subject:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        issueType:
          type: string
          nullable: true
          description: Issue type enum value (Postgres) or raw SN label (ServiceNow).
        state:
          type: string
          description: State enum value (Postgres) or raw SN label (ServiceNow).
        severity:
          type: string
          nullable: true
          description: Severity enum value (Postgres) or raw SN label (ServiceNow). Null for non-case types.
        catalog:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Populated for ServiceNow data source only.
        catalogItem:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Populated for ServiceNow data source only.
        assignedTeam:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
        product:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
        engagementType:
          type: string
          nullable: true
          description: Engagement type label. Non-null only when type is engagement.
        workState:
          type: string
          nullable: true
          description: Work sub-state label. Non-null only when state is work_in_progress.
        type:
          type: string
          description: Case type value (Postgres) or SN caseType label (ServiceNow).
        project:
          $ref: '#/components/schemas/EntityRef'
        projectKey:
          type: string
          nullable: true
          description: >-
            The project's short human-readable key (e.g. "TESTQUERYSUB").
            Populated for the ServiceNow data source only; null otherwise.
        deployment:
          $ref: '#/components/schemas/EntityRef'
        deployedProduct:
          $ref: '#/components/schemas/EntityRef'
        assignedEngineer:
          nullable: true
          $ref: '#/components/schemas/UserReference'
          description: Engineer assigned to the case, or null when unassigned.
        parentCase:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
        relatedCase:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
        conversation:
          nullable: true
          $ref: '#/components/schemas/EntityRef'
          description: Populated for ServiceNow data source only.
        account:
          nullable: true
          $ref: '#/components/schemas/AccountRef'
          description: >-
            The case's account, including support tier (type). Populated for
            the ServiceNow data source only; null otherwise.
        bestCaseFixEta:
          type: string
          format: date
          nullable: true
          description: >-
            Internal-only best-case fix-commitment date (date-only, YYYY-MM-DD),
            visible to CSM engineers only. Populated for the ServiceNow data
            source only; null otherwise.
        mostLikelyFixEta:
          type: string
          format: date
          nullable: true
          description: >-
            Internal-only most-likely fix-commitment date (date-only,
            YYYY-MM-DD), visible to CSM engineers only. Populated for the
            ServiceNow data source only; null otherwise.
        worstCaseFixEta:
          type: string
          format: date
          nullable: true
          description: >-
            Internal-only worst-case fix-commitment date (date-only,
            YYYY-MM-DD), visible to CSM engineers only. Populated for the
            ServiceNow data source only; null otherwise.

    SearchCasesResponse:
      type: object
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseSearchView'
          description: Populated when the request did not set groupBy.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CaseGroup'
          description: Populated instead of cases when the request set groupBy.
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    CaseGroup:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
          description: The group's field value (e.g. a case state).
        count:
          type: integer
          description: Number of matching cases in this group.

    GroupByBucket:
      type: object
      required: [key, label, count]
      description: >-
        One aggregated bucket in a server-side group-by result. Shared by
        every resource's dedicated group-by endpoint (cases, incidents,
        problems, change requests, incident tasks).
      properties:
        key:
          type: string
          description: The raw value of the grouped field for this bucket.
        label:
          type: string
          description: >-
            Human-readable display form of key (identical to key when the
            grouped field has no separate label).
        count:
          type: integer
          description: Number of matching records in this bucket.

    GroupByResponse:
      type: object
      required: [groups, othersCount, totalRecords]
      description: >-
        The shared result shape for every resource's dedicated group-by
        aggregation endpoint.
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupByBucket'
          description: The top buckets by count, capped at the request's maxGroups.
        othersCount:
          type: integer
          description: >-
            The number of matching records folded together because their
            bucket fell outside the top maxGroups.
        totalRecords:
          type: integer
          description: >-
            Total number of records matching the request's filters; always
            equals the sum of groups' counts plus othersCount.

    AddCaseTagRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: Free-text label to attach to the case.

    CreateCommentRequest:
      type: object
      required: [referenceId, referenceType, type, content]
      properties:
        referenceId:
          type: string
          format: uuid
          description: UUID of the entity the comment belongs to.
        referenceType:
          type: string
          enum: [conversation, change_request, deployment, incident]
          description: >-
            Deliberately a strict subset of ReferenceType: `case` is rejected with
            400 here, because case comments are owned by POST /cases/{id}/comments.
            Declared inline rather than referencing the shared ReferenceType, which
            must keep accepting `case` for attachments and comment search.
        type:
          type: string
          enum: [work_note, comment, activity]
          description: work_note is restricted to internal users; activity to internal and system users.
        content:
          type: string

    CreateCommentResponse:
      type: object
      properties:
        message:
          type: string
        comment:
          $ref: '#/components/schemas/CommentDetail'

    CommentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Email of the user who created the comment.

    CreateCaseCommentRequest:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [work_note, comment, activity]
          description: work_note is restricted to internal users; activity to internal and system users.
        content:
          type: string

    CaseComment:
      type: object
      properties:
        id:
          type: string
        caseId:
          type: string
        type:
          type: string
          enum: [work_note, comment, activity]
        content:
          type: string
        createdBy:
          nullable: true
          $ref: '#/components/schemas/UserReference'
        createdOn:
          type: string
          format: date-time

    SearchCaseCommentsRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            type:
              type: string
              enum: [work_note, comment, activity]
        pagination:
          $ref: '#/components/schemas/Pagination'

    SearchCaseCommentsResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CaseComment'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ActivityType:
      type: string
      enum:
        - comment
        - attachment
        - field_change

    FieldChange:
      type: object
      properties:
        field:
          type: string
        fieldLabel:
          type: string
        previousValue:
          type: string
        newValue:
          type: string

    CaseActivity:
      type: object
      description: >-
        A single entry in a case activity feed. A discriminated union on `type`:
        the shared fields are always present, while type-specific fields are set
        only for the matching `type` (`commentType` for comments;
        `fileName`/`contentType`/`sizeBytes`/`downloadUrl` for attachments;
        `changes` for field changes).
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ActivityType'
        content:
          type: string
        createdOn:
          type: string
          format: date-time
        createdByFirstName:
          type: string
        createdByLastName:
          type: string
        createdBy:
          nullable: true
          $ref: '#/components/schemas/UserReference'
          description: >-
            Actor behind this entry. Its name field is the actor's full display
            name; createdByFirstName/createdByLastName remain separate because a
            full name cannot be split back into them reliably.
        commentType:
          type: string
          enum: [work_note, comment, activity]
          description: Set only when type is comment.
        fileName:
          type: string
          description: Set only when type is attachment.
        contentType:
          type: string
          description: Set only when type is attachment.
        sizeBytes:
          type: integer
          description: Set only when type is attachment.
        downloadUrl:
          type: string
          description: Set only when type is attachment.
        changes:
          type: array
          description: Set only when type is field_change.
          items:
            $ref: '#/components/schemas/FieldChange'

    SearchCaseActivitiesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        includeFieldChanges:
          type: boolean
          description: >-
            When omitted or false, only comment and attachment entries are
            returned. When true, field-change entries are included as well.

    SearchCaseActivitiesResponse:
      type: object
      properties:
        activity:
          type: array
          items:
            $ref: '#/components/schemas/CaseActivity'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    SearchIncidentActivitiesRequest:
      type: object
      description: Mirrors SearchCaseActivitiesRequest -- see that endpoint's own notes.
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        includeFieldChanges:
          type: boolean
          description: >-
            When omitted or false, only comment and attachment entries are
            returned. When true, field-change entries are included as well.

    SearchIncidentActivitiesResponse:
      type: object
      description: >-
        Mirrors SearchCaseActivitiesResponse. CaseActivity is reused as-is since an
        activity feed entry is not inherently case-specific.
      properties:
        activity:
          type: array
          items:
            $ref: '#/components/schemas/CaseActivity'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CreateAttachmentRequest:
      type: object
      required: [referenceId, referenceType, name, type, file]
      properties:
        referenceId:
          type: string
          format: uuid
          description: UUID of the reference entity (case, change request, etc.)
        referenceType:
          $ref: '#/components/schemas/ReferenceType'
        name:
          type: string
          description: File name including extension.
        type:
          type: string
          description: MIME type of the file (e.g. image/png, application/pdf).
        file:
          type: string
          description: Base64 data URI of the file content (e.g. data:image/png;base64,...). Maximum decoded size is 10 MB.
        description:
          type: string
          nullable: true

    AttachmentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sizeBytes:
          type: integer
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string
        downloadUrl:
          type: string

    CreateAttachmentResponse:
      type: object
      properties:
        message:
          type: string
        attachment:
          $ref: '#/components/schemas/AttachmentDetail'

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceId:
          type: string
          format: uuid
        referenceType:
          $ref: '#/components/schemas/ReferenceType'
        name:
          type: string
        type:
          type: string
        sizeBytes:
          type: integer
        description:
          type: string
          nullable: true
        createdBy:
          nullable: true
          $ref: '#/components/schemas/UserReference'
        createdOn:
          type: string
          format: date-time
        downloadUrl:
          type: string
          nullable: true
        previewUrl:
          type: string
          nullable: true

    ReferenceType:
      type: string
      enum:
        - case
        - conversation
        - change_request
        - deployment
        - incident

    SearchAttachmentsRequest:
      type: object
      required: [referenceId, referenceType]
      properties:
        referenceId:
          type: string
          format: uuid
          description: UUID of the reference entity (case, change request, etc.)
        referenceType:
          $ref: '#/components/schemas/ReferenceType'
        pagination:
          $ref: '#/components/schemas/Pagination'

    SearchAttachmentsResponse:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    DeleteAttachmentResponse:
      type: object
      properties:
        message:
          type: string

    ChangeRequestFieldFilter:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          enum:
            - createdOn
            - assignmentGroupId
        op:
          type: string
          enum: [gte, lte, in]
        values:
          type: array
          items:
            type: string
          description: Required and non-empty for every supported field/op combination.
      description: |
        One predicate in a change request search's generic filter expression
        array: "field op values", additive to the search's other named filter
        fields (projectIds, states, impacts, closedStartDate/closedEndDate,
        number). Mirrors CaseFieldFilter's contract.

        - **createdOn** (gte / lte): a single RFC3339 timestamp, YYYY-MM-DD
          date, or relative-date placeholder (e.g. "__daysAgo:90__") bounding
          the change request's created timestamp. gte is inclusive "on or
          after"; lte is inclusive "on or before". A lte bound earlier than
          its own gte bound is rejected with a validation error.
        - **assignmentGroupId** (in): sys_user_group UUIDs to filter the
          assignment group by.

    SearchChangeRequestsRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            projectIds:
              type: array
              items:
                type: string
                format: uuid
            searchQuery:
              type: string
            states:
              type: array
              items:
                type: string
                enum: [new, assess, authorize, customer_approval, scheduled, implement, review, customer_review, rollback, closed, canceled]
            impacts:
              type: array
              items:
                type: string
                enum: [high, medium, low]
            closedStartDate:
              type: string
              format: date-time
              description: "ISO-8601 UTC datetime (YYYY-MM-DDTHH:MM:SSZ)"
            closedEndDate:
              type: string
              format: date-time
              description: "ISO-8601 UTC datetime (YYYY-MM-DDTHH:MM:SSZ)"
            number:
              type: string
              description: >-
                A single change request number (e.g. "CHG0010001"); matches
                exactly. Routed as a first-class filter rather than through
                the free-text searchQuery scan.
            filters:
              type: array
              items:
                $ref: '#/components/schemas/ChangeRequestFieldFilter'
              description: >-
                A generic field/op/values filter array, additive to the named
                filters above. See ChangeRequestFieldFilter for the supported
                field/op combinations.
        sortBy:
          type: object
          required: [field, order]
          properties:
            field:
              type: string
              enum: [createdOn, updatedOn]
            order:
              type: string
              enum: [asc, desc]
        pagination:
          type: object
          properties:
