    SearchInstancesRequest:
      type: object
      required: [pagination]
      properties:
        filters:
          $ref: '#/components/schemas/InstanceSearchFilters'
          nullable: true
        pagination:
          $ref: '#/components/schemas/Pagination'

    InstanceMetadata:
      type: object
      required: [id, createdOn, updatedOn]
      properties:
        id:
          type: string
          format: uuid
        coreCount:
          type: integer
          nullable: true
        updates:
          type: integer
          nullable: true
        jdkVersion:
          type: string
          nullable: true
        deploymentMetadata:
          type: object
          additionalProperties: true
          nullable: true
        createdOn:
          type: string
        updatedOn:
          type: string
        customCreatedOn:
          type: string
          nullable: true
        customUpdatedOn:
          type: string
          nullable: true

    Instance:
      type: object
      required: [id, key, createdOn, updatedOn]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        project:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        deployment:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        product:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        deployedProduct:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        createdOn:
          type: string
        updatedOn:
          type: string
        metadata:
          $ref: '#/components/schemas/InstanceMetadata'
          nullable: true

    SearchInstancesResponse:
      type: object
      required: [instances, total, offset, limit]
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    InstanceDateRangeFilters:
      type: object
      description: >
        Shared filters for POST /instances/metrics/search and POST /instances/usages/search.
        projectIds, deploymentIds, and deployedProductIds are mutually exclusive — at most
        one may be non-empty.
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        projectIds:
          type: array
          items:
            type: string
            format: uuid
        deploymentIds:
          type: array
          items:
            type: string
            format: uuid
        deployedProductIds:
          type: array
          items:
            type: string
            format: uuid

    InstanceMetricsRequest:
      type: object
      required: [filters]
      properties:
        filters:
          $ref: '#/components/schemas/InstanceDateRangeFilters'

    InstanceDataPoint:
      type: object
      required: [date, createdOn]
      properties:
        date:
          type: string
        createdOn:
          type: string
        coreCount:
          type: integer
          nullable: true
        jdkVersion:
          type: string
          nullable: true
        updates:
          type: integer
          nullable: true
        deploymentMetadata:
          type: object
          additionalProperties: true
          nullable: true

    InstanceMetric:
      type: object
      description: One instance's metric time series, ordered newest to oldest.
      required: [instanceId, instanceKey, dataPoints]
      properties:
        instanceId:
          type: string
          format: uuid
        instanceKey:
          type: string
        project:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        deployment:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        product:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        deployedProduct:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        dataPoints:
          type: array
          items:
            $ref: '#/components/schemas/InstanceDataPoint'

    InstanceMetricsResponse:
      type: object
      required: [metrics, totalInstances, startDate, endDate]
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/InstanceMetric'
        totalInstances:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    InstanceUsageRequest:
      type: object
      required: [filters]
      properties:
        filters:
          $ref: '#/components/schemas/InstanceDateRangeFilters'

    InstanceSummary:
      type: object
      description: >
        One period's usage counts for an instance, keyed by an open set of count-type names
        (e.g. "TOTAL_USERS", "TRANSACTION_COUNT").
      required: [period, counts]
      properties:
        period:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer

    InstanceUsageEntry:
      type: object
      required: [instanceId, instanceKey, periodSummaries]
      properties:
        instanceId:
          type: string
          format: uuid
        instanceKey:
          type: string
        project:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        deployment:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        product:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        deployedProduct:
          $ref: '#/components/schemas/ReferenceTableItem'
          nullable: true
        periodSummaries:
          type: array
          items:
            $ref: '#/components/schemas/InstanceSummary'

    InstanceUsageResponse:
      type: object
      required: [usages, totalInstances, startDate, endDate]
      properties:
        usages:
          type: array
          items:
            $ref: '#/components/schemas/InstanceUsageEntry'
        totalInstances:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    InstanceStatsFilters:
      type: object
      description: >
        Extends the shared date-range filters with an optional dataSource discriminator,
        used by the two .../stats/search endpoints only.
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        projectIds:
          type: array
          items:
            type: string
            format: uuid
        deploymentIds:
          type: array
          items:
            type: string
            format: uuid
        deployedProductIds:
          type: array
          items:
            type: string
            format: uuid
        dataSource:
          type: integer
          nullable: true
          description: "1 = API Call, 2 = File Upload."

    InstanceMetricsStatsRequest:
      type: object
      required: [filters]
      properties:
        filters:
          $ref: '#/components/schemas/InstanceStatsFilters'

    InstanceMetricSummary:
      type: object
      required: [current, min, max, avg]
      properties:
        current:
          type: number
        min:
          type: number
        max:
          type: number
        avg:
          type: number

    InstanceMetricsStatsResponse:
      type: object
      description: >
        stats is keyed by date, then by an open set of metric names (e.g. "TOTAL_CORES") —
        an open set defined by ServiceNow, not a fixed enum.
      required: [stats, summary, total, startDate, endDate]
      properties:
        stats:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        summary:
          $ref: '#/components/schemas/InstanceMetricSummary'
        total:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    InstanceUsageStatsRequest:
      type: object
      required: [filters]
      properties:
        filters:
          $ref: '#/components/schemas/InstanceStatsFilters'

    InstanceUsageStatsResponse:
      type: object
      description: >
        stats is keyed by date, then by an open set of metric names, same rationale as
        InstanceMetricsStatsResponse.stats. Unlike that response, there is no summary block.
      required: [stats, total, startDate, endDate]
      properties:
        stats:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        total:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    EventPublishFailure:
      description: >
        A durable record that a backend's publish to the event bus was never
        acknowledged by Event Hub. Has no ServiceNow equivalent — always
        backed by Postgres. Replaces the old event_outbox — there is no
        claim/dispatch lifecycle here, since csm-notification-service is a
        pure Kafka consumer now and never talks to this table.
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        entityId:
          type: string
        payload:
          type: object
          additionalProperties: true
        error:
          type: string
          description: The caller-supplied reason Event Hub didn't ack the publish.
        createdOn:
          type: string
          format: date-time
        resolvedOn:
          type: string
          format: date-time
          nullable: true

    CreateEventPublishFailureRequest:
      type: object
      required: [eventType, entityId, payload, error]
      properties:
        eventType:
          type: string
          description: e.g. "case.created", "incident.created" — the event type that failed to publish.
        entityId:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: The exact event payload that failed to publish.
        error:
          type: string
          description: Why Event Hub didn't ack the publish.

    SearchEventPublishFailuresFilters:
      type: object
      properties:
        resolved:
          type: boolean
          nullable: true
          description: Omit to match every row regardless of resolution state.

    SearchEventPublishFailuresRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          $ref: '#/components/schemas/SearchEventPublishFailuresFilters'

    SearchEventPublishFailuresResponse:
      type: object
      properties:
        failures:
          type: array
          items:
            $ref: '#/components/schemas/EventPublishFailure'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
