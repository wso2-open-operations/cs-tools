    IncidentFieldFilter:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          enum:
            - state
            - assignmentGroupId
            - businessServiceId
            - createdOn
        op:
          type: string
          enum: [in, gte, lte]
        values:
          type: array
          items:
            type: string
          description: Required and non-empty for every supported field/op combination.
      description: |
        One predicate in an incident search's generic filter expression
        array: "field op values". Mirrors CaseFieldFilter's contract.

        - **state** (in): one of NEW/IN_PROGRESS/ON_HOLD/RESOLVED/CLOSED/
          CANCELLED (the domain enum, not ServiceNow's raw numeric key).
        - **assignmentGroupId** (in): sys_user_group UUIDs to filter the
          assignment group by.
        - **businessServiceId** (in): business_service UUIDs to filter by
          (exact sys_id match, distinct from the product-name-matched filter
          used elsewhere).
        - **createdOn** (gte/lte): a single value, either an RFC3339
          timestamp, a YYYY-MM-DD date, or a relative-date placeholder (e.g.
          "__daysAgo:90__"), same syntax as case search's own createdOn
          filter.

    SearchIncidentsRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            priorities:
              type: array
              items:
                type: string
                enum: [CRITICAL, HIGH, MODERATE, LOW, PLANNING]
            parentIds:
              type: array
              items:
                type: string
                format: uuid
            number:
              type: string
              description: >-
                A single incident number (e.g. "INC0010001"); matches
                exactly. Routed as a first-class filter rather than through
                the free-text searchQuery scan.
            filters:
              type: array
              items:
                $ref: '#/components/schemas/IncidentFieldFilter'
              description: >-
                A generic field/op/values filter array. See
                IncidentFieldFilter for the supported field/op combinations.
        sortBy:
          type: object
          properties:
            field:
              type: string
              enum: [createdOn, updatedOn, openedOn]
            order:
              type: string
              enum: [asc, desc]
        pagination:
          $ref: '#/components/schemas/Pagination'

    GroupIncidentsByRequest:
      type: object
      required: [groupBy]
      properties:
        filters:
          type: object
          description: Same shape as SearchIncidentsRequest.filters.
          properties:
            searchQuery:
              type: string
            priorities:
              type: array
              items:
                type: string
                enum: [CRITICAL, HIGH, MODERATE, LOW, PLANNING]
            parentIds:
              type: array
              items:
                type: string
                format: uuid
            number:
              type: string
              description: >-
                A single incident number (e.g. "INC0010001"); matches
                exactly. Routed as a first-class filter rather than through
                the free-text searchQuery scan.
            filters:
              type: array
              items:
                $ref: '#/components/schemas/IncidentFieldFilter'
              description: >-
                A generic field/op/values filter array. See
                IncidentFieldFilter for the supported field/op combinations.
        groupBy:
          type: string
          enum: [state, assignmentGroup, businessService]
          description: The field to aggregate incident counts by.
        maxGroups:
          type: integer
          description: >-
            Caps the response to the top maxGroups buckets by count; the
            remainder is folded into GroupByResponse.othersCount. Optional; a
            default is applied when omitted.

