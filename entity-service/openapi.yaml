          description: |
            Case type. `default_case` is also accepted as an alias for `case`
            (ServiceNow's own raw caseType wire value; kept for the
            currently-in-production customer-portal frontend, which predates
            this API's `case` enum) and is normalized to `case` before any
            other validation runs. `announcement` is a valid case type
            elsewhere in this API (case search/stats filters) but cannot be
            created through this endpoint — no code path builds a valid
            payload for one — and is rejected with 400 if supplied here.
            - `case`: standard support case; requires `subject`, `description`, `severity`, `issueType`.
            - `service_request`: catalog-based service request (ServiceNow only); requires `catalogId`, `catalogItemId`, `variables`.
