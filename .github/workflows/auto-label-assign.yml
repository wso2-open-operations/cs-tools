name: Auto Label and Assign PR

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  auto-label-assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Apply labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const prNumber = pr.number;

            // Fetch all changed files (handles PRs with >30 files via pagination)
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const filenames = files.map(f => f.filename);
            core.info(`Changed files:\n${filenames.join('\n')}`);

            // Component labels: one per top-level component directory. Add a row here
            // when a new app, integration or operations service is created.
            const componentPrefixes = {
              'App/CSM Portal':                              'apps/csm-portal/',
              'App/Customer Portal':                         'apps/customer-portal/',
              'App/Git Internals Dashboard':                 'apps/git-internals-dashboard/',
              'App/Knowledge Portal':                        'apps/knowledge-portal/',
              'App/MTTR Application':                        'apps/mttr-application/',
              'App/Security Advisory Patches Portal':        'apps/security-advisory-patches-portal/',
              'App/Today I Learned':                         'apps/today-i-learned/',
              'Entity Service':                              'entity-service/',
              'Int/ACP Closure Service':                     'integrations/acp-closure-service/',
              'Int/CSM AI Integration Service':              'integrations/csm-ai-integration-service/',
              'Int/CSM Integration Service':                 'integrations/csm-integration-service/',
              'Int/CSM Mail Paging Service':                 'integrations/csm-mail-paging-service/',
              'Int/CSM Notification Service':                'integrations/csm-notification-service/',
              'Int/CSM Portal Activity Stream Service':      'integrations/csm-portal-activity-stream-service/',
              'Int/Customer Portal Activity Stream Service': 'integrations/customer-portal-activity-stream-service/',
              'Int/Customer Service':                        'integrations/customer-service/',
              'Int/SFTPGo Authentication Service':           'integrations/sftpgo-authentication-service/',
              'Int/SRE Alert Core Service':                  'integrations/sre-alert-core-service/',
              'Int/SRE Alert Ingestion Service':             'integrations/sre-alert-ingestion-service/',
              'Ops/CSM Scheduled Tasks':                     'operations/csm-scheduled-tasks/',
              'Ops/CSM Webhooks':                            'operations/csm-webhooks/',
            };

            // Area/Platform labels: generic across every app
            const fileRules = [
              ...Object.entries(componentPrefixes).map(([label, prefix]) => ({
                label,
                test: f => f.startsWith(prefix),
              })),
              { label: 'Area/Backend',        test: f => /^apps\/[^/]+\/backend(-v2)?\//.test(f) },
              { label: 'Area/Frontend',       test: f => /^apps\/[^/]+\/webapp\//.test(f) },
              { label: 'Platform/Microapp',   test: f => /^apps\/[^/]+\/microapp\//.test(f) },
              { label: 'Platform/Web',        test: f => /^apps\/[^/]+\/webapp\//.test(f) },
            ];

            const labelsToApply = [...new Set(
              fileRules
                .filter(({ test }) => filenames.some(test))
                .map(({ label }) => label)
            )];

            // Type label — inferred from the conventional-commit prefix in the PR title.
            // Strips leading [TAG] prefixes (e.g. "[CSM][Web] fix: ...") before matching.
            const titleBody = pr.title.toLowerCase().trim().replace(/^(\[[^\]]*\]\s*)+/, '');
            const typeRules = [
              { label: 'Type/Bug',         pattern: /^fix[:(!]/ },
              { label: 'Type/New Feature', pattern: /^feat[:(!]/ },
              { label: 'Type/Improvement', pattern: /^(perf|improve)[:(!]/ },
              { label: 'Type/Docs',        pattern: /^docs?[:(!]/ },
              { label: 'Type/UX',          pattern: /^ux[:(!]/ },
              { label: 'Type/Task',        pattern: /^(chore|ci|refactor|build|test)[:(!]/ },
            ];
            const typeLabel = typeRules.find(r => r.pattern.test(titleBody))?.label;
            if (typeLabel) labelsToApply.push(typeLabel);

            core.info(`Labels to apply: ${labelsToApply.join(', ') || '(none)'}`);

            if (labelsToApply.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: labelsToApply,
              });
            }

      - name: Assign PR author
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: pr.number,
              assignees: [pr.user.login],
            });
            core.info(`Assigned: ${pr.user.login}`);
