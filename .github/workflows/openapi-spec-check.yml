# Fails a pull request whose OpenAPI specs contain YAML that parses but says
# something else: a description split into a stray key by an unquoted comma
# (#2605), or a key written twice. See .github/scripts/check-openapi-specs.py.
name: OpenAPI spec check

on:
  pull_request:
    paths:
      - "**/*openapi*.yaml"
      - "**/*openapi*.yml"
      - ".github/scripts/check-openapi-specs.py"
      - ".github/workflows/openapi-spec-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A virtualenv, not --user: the runner's system Python refuses pip
      # installs (PEP 668).
      - name: Install PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyyaml==6.0.2"

      - name: Check every OpenAPI spec
        run: '"$RUNNER_TEMP/venv/bin/python" .github/scripts/check-openapi-specs.py'
