#
# LOCAL DEV ONLY -- compose override for the deferred Salesforce membership
# write (entity-service SALESFORCE_DEFERRED_WRITES_ENABLED). Adds a mock
# sales-entity-service that can be switched into an outage, points
# entity-service at it, turns the portal membership writes and the deferral
# on, and shortens the retry policies so the whole scenario runs in a couple
# of minutes. Driven by scripts/csm-compose/sf-deferred-e2e.sh:
#
#   docker compose -f docker-compose.yml -f scripts/csm-compose/sf-deferred-e2e.compose.yml up -d --build entity-service mock-sales-entity kafka-topics-init
#   scripts/csm-compose/sf-deferred-e2e.sh run
services:
  mock-sales-entity:
    build:
      context: ./scripts/csm-compose/mock-sales-entity
    environment:
      PORT: "9200"
      # The invitation validator refuses addresses outside the account's
      # domain list; every mock customer answers with this list.
      MOCK_SF_DOMAIN_LIST: example.com
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9200/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20

  kafka-topics-init:
    entrypoint:
      - sh
      - -c
      - |
        for t in case-events case-events-dlq sre-events sre-events-dlq project-events project-events-dlq salesforce-writes salesforce-writes-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        done

  entity-service:
    depends_on:
      mock-sales-entity:
        condition: service_healthy
      # The consumers join their groups at startup; the topics must exist by
      # then (the consumer also watches for late partitions, this just keeps
      # the first boot deterministic).
      kafka-topics-init:
        condition: service_completed_successfully
    environment:
      SALES_ENTITY_BASE_URL: http://mock-sales-entity:9200
      SALES_ENTITY_TOKEN_URL: http://mock-sales-entity:9200/oauth2/token
      SALES_ENTITY_CLIENT_ID: mock-sales-entity-client
      SALES_ENTITY_CLIENT_SECRET: mock-sales-entity-secret
      CSM_MIGRATION_PORTAL_WRITES_ENABLED: "true"
      SALESFORCE_DEFERRED_WRITES_ENABLED: "true"
      PROJECT_EVENT_HUB_TOPIC: project-events
      SALESFORCE_WRITE_EVENT_HUB_TOPIC: salesforce-writes
      SALESFORCE_WRITE_EVENT_HUB_DLQ_TOPIC: salesforce-writes-dlq
      # Short policies so the scenario exercises both tiers quickly: the
      # main topic gives up after ~2s and dead-letters; the dead-letter tier
      # retries 5s, 10s, 20s, 20s, 20s (~75s of cover) before marking FAILED.
      SALESFORCE_WRITE_RETRY_ATTEMPTS: "2"
      SALESFORCE_WRITE_RETRY_DELAY: "2s"
      SALESFORCE_WRITE_DLQ_RETRY_ATTEMPTS: "6"
      SALESFORCE_WRITE_DLQ_RETRY_DELAY: "5s"
      SALESFORCE_WRITE_DLQ_RETRY_MAX_DELAY: "20s"
