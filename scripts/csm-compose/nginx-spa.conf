# Shared SPA server block for both CSM webapps in the local docker-compose
# stack: serve static assets, fall back to index.html for client-side
# routing, cache the content-hashed bundle for a year and the two entry
# points (index.html, config.js) never.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # nginx drops every inherited add_header in a block that declares its
    # own, so these three are repeated in each location below that also
    # sets Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Dotfiles (.env, .git, .DS_Store, ...) are never served.
    location ~ /\. {
        deny all;
    }

    # Vite writes content-hashed filenames under /assets/: a changed file
    # has a new name, so the old one can be cached indefinitely.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # The entry points must be revalidated on every load: a cached
    # index.html would keep referencing hashed chunks that no longer exist
    # after a rebuild, and config.js is rendered fresh per container start.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files /config.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
