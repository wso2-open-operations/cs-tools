# Shared SPA server block for both CSM webapps in the local docker-compose
# stack: serve static assets, fall back to index.html for client-side
# routing, never cache config.js (it is rendered fresh per container start).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
