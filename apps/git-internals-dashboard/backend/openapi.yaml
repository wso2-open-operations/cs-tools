openapi: 3.0.1
info:
  title: git-internals-dashboard API
  description: >
    SLA monitor for CS-originated GitHub issues. Authless (an upstream API
    gateway validates the caller's JWT before traffic reaches this service);
    this spec declares no security scheme.
  version: 1.0.0
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /healthz:
    get:
      summary: Liveness probe. No dependencies checked; see GET /readyz for readiness.
      operationId: getHealthz
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /readyz:
    get:
      summary: >
        Readiness probe: a bounded DB ping plus connection-pool stats,
        briefly cached. 503 while draining after SIGTERM. Never checks
        GitHub reachability or application tables.
      operationId: getReadyz
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        "503":
          description: Not ready — database unreachable/timed out, pool saturated, or draining.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /taxonomy:
    get:
      summary: Config-driven status taxonomy. No DB hit.
      operationId: getTaxonomy
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'

  /issues:
    get:
      summary: Filterable issue list.
      operationId: getIssues
      parameters:
        - name: repo
          in: query
          description: '"owner/name". Repeatable; values are OR-ed together.'
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
        - name: priority
          in: query
          description: >-
            Repeatable; values are OR-ed together. The sentinel value
            __none__ matches an issue with no priority (i.priority IS NULL).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 50
        - name: state
          in: query
          schema:
            type: string
            enum: [OPEN, CLOSED]
        - name: slaState
          in: query
          description: >-
            Repeatable; values are OR-ed together. NO_SLA also matches an
            issue with no issue_sla row.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/SlaState'
        - name: status
          in: query
          description: Repeatable; values are OR-ed together.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 50
        - name: abtTeam
          in: query
          description: Repeatable; values are OR-ed together.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 100
        - name: q
          in: query
          description: Issue number.
          schema:
            type: string
            pattern: '^\d{1,10}$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: bucket
          in: query
          description: >-
            Defines a scope; every filter above is AND-ed on top of it
            (slaState replaces the base scope's implicit "not TERMINAL" rule
            instead of AND-ing with it, unless the bucket already picked its
            own SLA state).
          schema:
            type: string
            enum: [all, violated, at_risk, on_track, cs, product_side, tracked, untracked, attention]
        - name: sort
          in: query
          description: >-
            Whitelisted server-side sort column. sla_consumption (default)
            orders by issue_sla.pct_consumed; created and updated order by
            githubCreatedAt/githubUpdatedAt. Every column sorts NULLS LAST in
            both directions, with issues.id ascending as a deterministic
            tie-breaker.
          schema:
            type: string
            enum: [sla_consumption, created, updated]
            default: sla_consumption
        - name: order
          in: query
          description: Sort direction for the `sort` column.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /issues/{id}:
    get:
      summary: One issue plus its full status-event timeline (no actors).
      operationId: getIssue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /metrics/overview:
    get:
      summary: Dashboard hero counts, per-project/priority breakdowns, 12-week volume.
      operationId: getMetricsOverview
      parameters:
        - $ref: '#/components/parameters/RepoParam'
        - name: priority
          in: query
          schema:
            type: string
            maxLength: 50
        - $ref: '#/components/parameters/AbtTeamParam'
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /metrics/timeseries:
    get:
      summary: Gap-filled daily trend series.
      operationId: getMetricsTimeseries
      parameters:
        - $ref: '#/components/parameters/RepoParam'
        - name: days
          in: query
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 30
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [priority, none]
            default: priority
        - name: metric
          in: query
          schema:
            type: string
            enum: [violated, at_risk, total]
            default: violated
        - $ref: '#/components/parameters/AbtTeamParam'
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeseries'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /sync/runs:
    post:
      summary: >
        Triggers an incremental sync followed by an immediate recompute
        tick, under the job lock. Runs synchronously.
      operationId: postSyncRuns
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSummary'
        "400":
          description: sync_token_missing — GITHUB_TOKEN is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "409":
          description: sync_in_progress — the job lock is held elsewhere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /sync/status:
    get:
      summary: This replica's in-process lock flag, plus per-repo watermarks and the last run.
      operationId: getSyncStatus
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        "500":
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    RepoParam:
      name: repo
      in: query
      description: "owner/name"
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

    AbtTeamParam:
      name: abtTeam
      in: query
      schema:
        type: string
        maxLength: 100

  responses:
    BadRequest:
      description: validation_failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    NotFound:
      description: not_found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    InternalServerError:
      description: internal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'

  schemas:
    ErrorPayload:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [validation_failed, not_found, sync_in_progress, sync_token_missing, internal]
            message:
              type: string

    SlaState:
      type: string
      enum: [NO_SLA, OK, AT_RISK, VIOLATED, TERMINAL]

    StatusDef:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum: [PRODUCT_SIDE, CS_SIDE, OTHER, TRANSIENT]
        accruesSla:
          type: boolean
        isTerminal:
          type: boolean
        sortOrder:
          type: integer

    Taxonomy:
      type: object
      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/StatusDef'
        csStatuses:
          type: array
          items:
            type: string

    Readiness:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready, draining]
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, unreachable, timeout, pool_saturated]
                latencyMs:
                  type: integer
        pool:
          type: object
          nullable: true
          properties:
            acquired:
              type: integer
            idle:
              type: integer
            total:
              type: integer
            max:
              type: integer
            utilizationPercent:
              type: integer

    IssueSla:
      type: object
      nullable: true
      properties:
        budgetHours:
          type: number
          nullable: true
        consumedHours:
          type: number
        remainingHours:
          type: number
          nullable: true
        pctConsumed:
          type: number
          nullable: true
        slaState:
          $ref: '#/components/schemas/SlaState'
        slaRunning:
          type: boolean
        breachedEver:
          type: boolean
          description: >-
            Sticky: true once pctConsumed has ever reached 1.0, regardless
            of the issue's current slaState — slaState alone can't serve
            compliance reporting since a resolved issue reports TERMINAL
            even if it was VIOLATED beforehand.

    Issue:
      type: object
      properties:
        id:
          type: integer
        number:
          type: integer
        state:
          type: string
          enum: [OPEN, CLOSED]
        url:
          type: string
          nullable: true
        repo:
          type: string
        priority:
          type: string
          nullable: true
        currentStatus:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        abtTeam:
          type: string
          nullable: true
        openedBy:
          type: string
          nullable: true
        githubCreatedAt:
          type: string
          format: date-time
          nullable: true
        githubUpdatedAt:
          type: string
          format: date-time
          nullable: true
        sla:
          $ref: '#/components/schemas/IssueSla'

    IssueList:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        total:
          type: integer
          description: Total issues matching the filters, independent of limit/offset.
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: 'True when offset + issues.length < total.'

    IssueEvent:
      type: object
      properties:
        id:
          type: integer
        previousStatus:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time

    IssueDetail:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/IssueEvent'

    Overview:
      type: object
      properties:
        filters:
          type: object
          properties:
            repo:
              type: string
              nullable: true
            priority:
              type: string
              nullable: true
            abtTeam:
              type: string
              nullable: true
        abtTeams:
          type: array
          items:
            type: string

    Timeseries:
      type: object
      properties:
        window:
          type: integer
        metric:
          type: string
        groupBy:
          type: string
        dates:
          type: array
          items:
            type: string
        series:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              points:
                type: array
                items:
                  type: integer

    SyncRepoResult:
      type: object
      properties:
        repo:
          type: string
        status:
          type: string
          enum: [success, error]
        issuesProcessed:
          type: integer
        eventsInserted:
          type: integer
        error:
          type: string
          description: >-
            A short, stable failure classification (e.g. "github http 502",
            "ingest failed"), never raw GitHub response body or error detail
            — see backend internal/sync's sanitizeSyncError.

    SyncSummary:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        repos:
          type: array
          items:
            $ref: '#/components/schemas/SyncRepoResult'

    SyncStatus:
      type: object
      properties:
        running:
          type: boolean
        repos:
          type: array
          items:
            type: object
            properties:
              repo:
                type: string
              lastSyncedAt:
                type: string
                format: date-time
                nullable: true
        lastRun:
          type: object
          nullable: true
          properties:
            kind:
              type: string
            status:
              type: string
            finishedAt:
              type: string
              format: date-time
              nullable: true
            issuesProcessed:
              type: integer
            error:
              type: string
              nullable: true
