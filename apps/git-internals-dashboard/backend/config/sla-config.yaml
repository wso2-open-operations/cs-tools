# =============================================================================
# Git Internals Dashboard Configurations — single source of truth.
# Non-secret by rule: tokens, DB URLs, and Asgardeo values live in env vars.
# Loaded once at process start; changes require a restart (Choreo restarts the
# component on config-mount updates anyway).
# =============================================================================

repos:
  - owner: sample-org-01
    name: sample-repo-01
    githubProjectId: xxxxxxxxxxxxx
    projectTitle: Sample Repo 01
    issueQuery: 'label:"Test01" -label:"Test02"'
  - owner: sample-org-02
    name: sample-repo-02
    githubProjectId: yyyyyyyyyyyyy
    projectTitle: Sample Repo 02
    issueQuery: 'label:"Test01" -label:"Test02"'

taxonomy:
  statuses:
    # Product Team Side — accrues SLA
    - { name: "Open",                  category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 10 }
    - { name: "In Progress",           category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 20 }
    - { name: "WOW",                   category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 30 }
    - { name: "Reopened",              category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 40 }
    - { name: "Waiting-on-PC",         category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 41 }
    - { name: "POC Pending",           category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 42 }
    - { name: "Requests",              category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 43 }
    - { name: "Todo",                  category: PRODUCT_SIDE, accruesSla: true,  isTerminal: false, sortOrder: 44 }
    # CS Team Side — pauses (no accrual)
    - { name: "WOC",                   category: CS_SIDE,      accruesSla: false, isTerminal: false, sortOrder: 50 }
    - { name: "Pending Patch Queue",   category: CS_SIDE,      accruesSla: false, isTerminal: false, sortOrder: 60 }
    # Other — pauses
    - { name: "Added to Update Queue", category: OTHER,        accruesSla: false, isTerminal: false, sortOrder: 70 }
    - { name: "ETA Shared",            category: OTHER,        accruesSla: false, isTerminal: false, sortOrder: 80 }
    - { name: "Proactive Pending",     category: OTHER,        accruesSla: false, isTerminal: false, sortOrder: 90 }
    - { name: "On Hold",               category: OTHER,        accruesSla: false, isTerminal: false, sortOrder: 100 }
    # Other + terminal — pauses, excluded from alerts
    - { name: "Resolved",              category: OTHER,        accruesSla: false, isTerminal: true,  sortOrder: 110 }
    - { name: "Duplicate",             category: OTHER,        accruesSla: false, isTerminal: true,  sortOrder: 120 }
    # Transient empty status (item briefly removed from board) — pauses
    - { name: "",                      category: TRANSIENT,    accruesSla: false, isTerminal: false, sortOrder: 999 }
    # Real-board statuses discovered in the real-data validation round.
    # Decision A: the three "confirm with board owner" rows keep provisional
    # OTHER/pause behavior (today's effective behavior). Data-only to change.
    - { name: "Done",                  category: OTHER,        accruesSla: false, isTerminal: true,  sortOrder: 130 }
    - { name: "Doc Pending",           category: OTHER,        accruesSla: false, isTerminal: false, sortOrder: 140 } # confirm with board owner
    - { name: "Approved / Not Started", category: OTHER,       accruesSla: false, isTerminal: false, sortOrder: 150 } # confirm with board owner
    - { name: "Pending Approval",      category: OTHER,        accruesSla: false, isTerminal: false, sortOrder: 160 } # confirm with board owner
  aliases:
    - { alias: "Re-Opened", canonical: "Reopened" }
    - { alias: "On-Hold",   canonical: "On Hold" }

# Budgets in coverage-clock hours (time accrues only inside the coverage window).
# A 12x5 "business day" is the 12-hour 09:00–21:00 IST window, so
# P2 "2 days" = 24h and P3 "4 days" = 48h. P4 omitted -> NO_SLA.
budgets:
  - { priority: "Critical(P1)", budgetHours: 24, coverage: "24x7",     rank: 1 }
  - { priority: "High(P2)",     budgetHours: 24, coverage: "12x5_ist", rank: 2 }
  - { priority: "Medium(P3)",   budgetHours: 48, coverage: "12x5_ist", rank: 3 }

settings:
  # Fraction of an issue's budget consumed (strictly between 0 and 1) at or
  # above which its SLA state becomes AT_RISK; at/above 1.0 it's VIOLATED
  # instead.
  atRiskThreshold: 0.75
  # How often the background scheduler re-runs a recompute tick, advancing
  # issue_sla/sla_snapshots from already-synced state. Does not call GitHub.
  recomputeIntervalMinutes: 10
  # Minutes subtracted from a repo's last_synced_at watermark before each
  # incremental sync, so anything updated mid-previous-run is re-covered by
  # the next sync instead of silently missed.
  syncOverlapMinutes: 15
  # Hour of day (0-23, UTC) reserved for the daily SLA snapshot cutover.
  # Currently validated only — the recompute tick snapshots today's UTC date
  # on every run rather than gating on this hour.
  snapshotHourUtc: 0
  # How many days of history the seed command backfills into sla_snapshots
  # for synthetic/local data.
  seedSnapshotDays: 90
  # How far back (days) a closed issue still counts as recent enough to
  # seed/sync. Also incremental sync's fallback lookback window the first
  # time a repo has no last_synced_at yet.
  seedClosedLookbackDays: 90
  # How a board status absent from taxonomy.statuses (a renamed or newly
  # added column) affects the SLA clock:
  #   pause  (default) — today's behavior: the clock pauses, same as any
  #           other non-accruing status. Safe against over-counting, but
  #           silently undercounts if the status is actually product-side.
  #   accrue — treat it as product-side (assume-accrues until classified).
  #           Safer against hiding a stalled issue from breach alerts, at
  #           the cost of possibly over-counting until it's classified.
  # Either way, unknown statuses are always surfaced via
  # /metrics/overview.unknownStatuses so they get noticed and classified —
  # this setting only controls what happens to the SLA clock meanwhile. A
  # nil status (issue removed from the board) is never "unknown": it keeps
  # pausing regardless of this setting.
  # CAUTION: this applies to every historical event's status in the walk,
  # not just an issue's current status — changing this setting (or adding a
  # newly-recognized status to taxonomy.statuses, which has the same effect)
  # retroactively re-accrues/re-pauses every past interval that sat on the
  # affected status, on the very next tick. Same retroactive-recompute class
  # as editing holidays below.
  unknownStatusPolicy: pause

# IST calendar dates (YYYY-MM-DD) excluded from the 12x5_ist coverage window
# — e.g. Indian public holidays, if the SLA contract excludes them. Applies
# only to 12x5_ist budgets (P2/P3 today); 24x7 budgets (P1) are unaffected,
# since they already ignore weekends and holidays alike. Empty by default —
# confirm with the actual SLA contract before adding dates. Adding or
# removing a date here recomputes every issue's history retroactively on the
# next tick (same as any other coverage-window change), which can visibly
# shift consumed_hours/pct_consumed for issues whose intervals span the
# changed date.
holidays: []
