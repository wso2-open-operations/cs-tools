        title:
          type: string
        type:
          type: string
          description: "\"case\", \"service_request\", or \"security_report_analysis\""
        projectId:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        deployedProductId:
          type: string
          format: uuid
        description:
          type: string
        severityKey:
          type: integer
          description: ServiceNow numeric choice-list id — see case_enum_mapping.go.
        issueTypeKey:
          type: integer
          description: ServiceNow numeric choice-list id — see case_enum_mapping.go.
        catalogId:
          type: string
          description: Required when type is "service_request".
        catalogItemId:
          type: string
          description: Required when type is "service_request".
        variables:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              value:
                type: string
        relatedCaseId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        watchList:
          type: array
          items:
            type: string
        attachments:
          type: array
          description: Required (at least one) when type is "security_report_analysis".
          items:
            type: object
            properties:
              name:
                type: string
              file:
                type: string
