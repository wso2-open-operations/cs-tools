        createdOn:
          type: string
        createdBy:
          type: string

    # ---- deployments ----

    SearchDeploymentsRequest:
      description: >
        projectIds is set server-side from the path parameter and any
        client-supplied value here is ignored.
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
        projectIds:
          type: array
          items:
            type: string
        deploymentTypes:
          type: array
          items:
            type: string

    DeploymentSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/IdLabelRef'
        description:
          type: string
        createdBy:
          $ref: '#/components/schemas/Ref'
        project:
          $ref: '#/components/schemas/IdLabelRef'
        createdOn:
          type: string
        updatedOn:
          type: string
        productCount:
          type: integer
          description: >-
            Number of deployed products in this deployment, from
            entity-service's deployedProductCount. Named productCount to match
            the frontend contract — the Usage & Metrics page filters
            deployments on this field.
        url:
          type: string
          nullable: true

    SearchDeploymentsResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope.
      type: object
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentSummary'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CreateDeploymentRequest:
      description: >
        projectId is set server-side from the {id} path parameter — the
        request body carries no projectId field. deploymentTypeKey carries
        ServiceNow's numeric choice-list id (see deployment_enum_mapping.go).
      type: object
      required: [deploymentTypeKey, description, name]
      properties:
        deploymentTypeKey:
          type: integer
        description:
          type: string
        name:
          type: string

    DeploymentCreateResponse:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string

    UpdateDeploymentRequest:
      description: >
        Provide either name/typeKey/description or active=false, but not
        both. typeKey carries ServiceNow's numeric choice-list id (see
        deployment_enum_mapping.go).
      type: object
      properties:
        active:
          type: boolean
        description:
          type: string
          nullable: true
          description: >
            Three states: omit the field to leave the description
            unchanged, send null to clear it, send a string to set it.
        name:
          type: string
        typeKey:
          type: integer

    DeploymentUpdateResponse:
      type: object
      properties:
        id:
          type: string
        updatedOn:
          type: string

    # ---- deployed products ----

    SearchDeployedProductsRequest:
      description: >
        Always scoped to the deployment in the {deploymentId} path
        parameter — the request body carries no deploymentId field.
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'

    DeployedProductVersion:
      description: >
        label (not name), releasedOn/endOfLifeOn (not releasedDate/
        supportEoLDate) to match the frontend's IdLabelRef shape.
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        releasedOn:
          type: string
        endOfLifeOn:
          type: string

    DeployedProductSummary:
      description: >
        cores/tps are numbers (not strings) — parsed from entity-service's
        ServiceNow-string wire format.
      type: object
      properties:
        id:
          type: string
        deployment:
          $ref: '#/components/schemas/IdLabelRef'
        product:
          $ref: '#/components/schemas/IdLabelRef'
        version:
          $ref: '#/components/schemas/DeployedProductVersion'
        cores:
          type: integer
        tps:
          type: number
        category:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string

    SearchDeployedProductsResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope.
      type: object
      properties:
        deployedProducts:
          type: array
          items:
            $ref: '#/components/schemas/DeployedProductSummary'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CreateDeployedProductRequest:
      description: >
        deploymentId is set server-side from the {deploymentId} path
        parameter — the request body carries no deploymentId field.
      type: object
      required: [projectId, productId, versionId]
      properties:
        projectId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        cores:
          type: integer
        tps:
          type: number
        description:
          type: string

    DeployedProductCreateResponse:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string

    UpdateDeployedProductRequest:
      description: >
        Provide either cores/tps/description or active=false, but not both.
        deploymentId is always injected server-side from the
        {deploymentId} path parameter (an IDOR-style scope guard) — the
        request body carries no deploymentId field.
      type: object
      properties:
        cores:
          type: integer
        tps:
          type: number
        description:
          type: string
        active:
          type: boolean

    DeployedProductUpdateResponse:
      type: object
      properties:
        id:
          type: string
        updatedOn:
          type: string

    # ---- attachments ----

    CreateCaseAttachmentRequest:
      description: >
        The case is scoped by the {id} path parameter — referenceId/
        referenceType are injected server-side, not client-supplied.
      type: object
      required: [name, type, content]
      properties:
        name:
          type: string
        type:
          type: string
          description: MIME/content type of the file.
        content:
          type: string
          description: Base64-encoded file content.
        description:
          type: string

    CreateAttachmentRequest:
      type: object
      required: [referenceId, referenceType, name, type, file]
      properties:
        referenceId:
          type: string
          format: uuid
        referenceType:
          type: string
          description: "\"case\", \"conversation\", \"change_request\", \"deployment\", or \"incident\""
        name:
          type: string
        type:
          type: string
          description: MIME/content type of the file.
        file:
          type: string
          description: Base64-encoded file content.
        description:
          type: string

    DeploymentAttachmentsResponse:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentSummary'
        offset:
          type: integer
        limit:
          type: integer
        totalRecords:
          type: integer
    CreateDeploymentAttachmentRequest:
      type: object
      description: >-
        The deployment is taken from the {deploymentId} path parameter; there is
        deliberately no referenceId/referenceType field, so a client cannot
        attach a file to a different entity.
      required:
        - name
        - type
        - content
      properties:
        name:
          type: string
        type:
          type: string
        content:
          type: string
          description: Base64-encoded file content.
        description:
          type: string
          nullable: true
    AttachmentCreateResponse:
      type: object
      properties:
        id:
          type: string
        sizeBytes:
          type: integer
        createdOn:
          type: string
        downloadUrl:
          type: string
          nullable: true
          description: >-
            Null for a CSM-native (Postgres) data source attachment. Always
            set for ServiceNow-sourced attachments.

    AttachmentSummary:
      type: object
      properties:
        id:
          type: string
        referenceId:
          type: string
        referenceType:
          type: string
        name:
          type: string
        type:
          type: string
        sizeBytes:
          type: integer
        description:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
        downloadUrl:
          type: string
        previewUrl:
          type: string


    CaseAttachmentsResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope — see PaginationResponse in
        apps/customer-portal/webapp/src/types/common.ts.
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentSummary'
        offset:
          type: integer
        limit:
          type: integer
        totalRecords:
          type: integer

    DeleteResponse:
      type: object
      properties:
        message:
          type: string

    # ---- case activities ----

    CaseFieldChange:
      type: object
      properties:
        field:
          type: string
        fieldLabel:
          type: string
        previousValue:
          type: string
        newValue:
          type: string

    CaseActivity:
      description: >
        A discriminated union on type: "comment" entries additionally carry
        commentType; "attachment" entries carry fileName/contentType/
        sizeBytes/downloadUrl; "field_change" entries carry changes.
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: "\"comment\", \"attachment\", or \"field_change\""
        content:
          type: string
        createdOn:
          type: string
        createdBy:
          type: string
        createdByFirstName:
          type: string
        createdByLastName:
          type: string
        createdByFullName:
          type: string
        commentType:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        downloadUrl:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/CaseFieldChange'

    SearchCaseActivitiesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        includeFieldChanges:
          type: boolean
          description: When false or omitted, only comment and attachment entries are returned.

    SearchCaseActivitiesResponse:
      description: >
        activities (not activity) and totalRecords (not total) to match the
        frontend's actual read sites.
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/CaseActivity'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    # ---- comments ----
    #
    # Generic comments attached to any reference entity (case, conversation,
    # change_request, deployment, incident) — distinct from the case-specific
    # comment endpoint under POST /cases/{id}/comments.

    CommentCreateRequest:
      description: >
        Type is always "comment" server-side and is not client-settable.
      type: object
      required: [referenceId, referenceType, content]
      properties:
        referenceId:
          type: string
          format: uuid
        referenceType:
          type: string
          enum: [case, conversation, change_request, deployment, incident]
        content:
          type: string

    CommentCreateResponse:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string
        createdBy:
          type: string

    CommentView:
      description: >
        Used by GET /conversations/{id}/messages.
        type/createdByFirstName/createdByLastName let the chat-history view
        distinguish the AI's replies from the customer's own messages.
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        type:
          type: string
        createdOn:
          type: string
        createdBy:
          type: string
        createdByFirstName:
          type: string
        createdByLastName:
          type: string

    SearchCommentsResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope. Used by GET /conversations/{id}/messages.
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentView'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    # ---- products ----

    SearchProductsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string

    ProductSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        class:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string

    SearchProductsResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope. Shared by POST /products/search and GET /products.
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    SearchProductVersionsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string

    ProductVersionSummary:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        currentSupportStatus:
          type: string
        releaseDate:
          type: string
        supportEolDate:
          type: string
        earliestPossibleSupportEolDate:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string

    SearchProductVersionsResponse:
      description: >
        versions (not productVersions) and totalRecords (not total) to
        match the frontend's own ProductVersionsSearchResponse type.
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProductVersionSummary'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    # ---- product vulnerabilities ----

    SearchProductVulnerabilitiesRequest:
      description: >
        statusId is deliberately not a supported field — entity-service's
        ProductVulnerabilityView has no status data anywhere in its response
        (unlike severity/priority, which does have a numeric-id mirror
        table), so there is nothing to filter or even post-filter by. It is
        not accepted by this endpoint.
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            severityId:
              type: integer
              description: ServiceNow numeric choice-list id — see product_vulnerability_enum_mapping.go.
            productName:
              type: string
            productVersion:
              type: string
        pagination:
          $ref: '#/components/schemas/Pagination'

    ProductVulnerability:
      description: >
        severity (not priority) as an IdLabelRef to match the frontend's
        own ProductVulnerability type.
      type: object
      properties:
        id:
          type: string
        cveId:
          type: string
        vulnerabilityId:
          type: string
        severity:
          $ref: '#/components/schemas/IdLabelRef'
        productName:
          type: string
          nullable: true
        productVersion:
          type: string
          nullable: true
        componentName:
          type: string
        version:
          type: string
        type:
          type: string
        componentType:
          type: string
          nullable: true
        updateLevel:
          type: string
          nullable: true
        useCase:
          type: string
          nullable: true
        justification:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true

    SearchProductVulnerabilitiesResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope.
      type: object
      properties:
        productVulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/ProductVulnerability'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ---- catalogs ----

    SearchCatalogsRequest:
      description: >
        Always scoped to the deployed product in the {deployedProductId}
        path parameter — the request body carries no deployedProductId
        field.
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'

    CatalogItem:
      description: label (not name) to match the frontend's own CatalogItem type.
      type: object
      properties:
        id:
          type: string
        label:
          type: string

    Catalog:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        catalogItems:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'

    SearchCatalogsResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope.
      type: object
      properties:
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CatalogItemVariable:
      type: object
      properties:
        id:
          type: string
        questionText:
          type: string
        order:
          type: integer
        type:
          type: string

    CatalogItemVariablesResponse:
      type: object
      properties:
        variables:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemVariable'

    # ---- time cards ----

    SearchTimeCardsRequest:
      description: >
        projectId is set server-side from the {id} path parameter — the
        request body carries no projectIds/caseId field. entity-service
        also accepts userId/approverId/approvedById/userIds filters that
        scope results to a specific WSO2 engineer — deliberately not
        exposed here since the portal has no notion of a customer selecting
        a WSO2 engineer to filter by.
      type: object
      properties:
        filters:
          type: object
          properties:
            startDate:
              type: string
            endDate:
              type: string
            states:
              type: array
              items:
                type: string
        sortBy:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
