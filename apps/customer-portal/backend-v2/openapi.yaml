components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: x-jwt-assertion

  schemas:
    ErrorPayload:
      type: object
      properties:
        message:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Ref:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    NumberRef:
      type: object
      properties:
        id:
          type: string
        number:
          type: string

    PersonRef:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    # ---- users ----

    UserMeResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        timeZone:
          type: string
        roles:
          type: array
          items:
            type: string
        phoneNumber:
          type: string
        lastPasswordUpdateTime:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    UserUpdateResponse:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    # ---- accounts ----

    AccountDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string
        supportTier:
          type: string
        owner:
          $ref: '#/components/schemas/Ref'
        technicalOwner:
          $ref: '#/components/schemas/Ref'
        activationDate:
          type: string
        deactivationDate:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        createdOn:
          type: string
        updatedOn:
          type: string

    # ---- projects ----

    SearchProjectsFilters:
      type: object
      properties:
        searchQuery:
          type: string

    SearchProjectsRequest:
      description: >
        filters is nested, matching the frontend's own request shape — not
        entity-service's flat searchQuery field.
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          $ref: '#/components/schemas/SearchProjectsFilters'

    ProjectSummary:
      type: object
      properties:
        activeCasesCount:
          type: integer
          description: Number of currently active cases on the project. Always present.
        # Project type as an {id, label} reference. The label matches the portal's
        # ProjectType enum exactly: it gates the Operations navigation item and
        # drives severity and product-default rules. Omitted when the upstream
        # subscription type is empty.
        type:
          $ref: '#/components/schemas/IdLabelRef'
        id:
          type: string
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        closureState:
          type: string

    SearchProjectsResponse:
      description: >
        totalRecords (not total) to match the frontend's shared pagination
        envelope.
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        totalRecords:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProjectAccount:
      description: >
        supportTier (not tier) to match the frontend's read site.
      type: object
      properties:
        ownerEmail:
          type: string
          description: Email of the account owner.
        technicalOwnerEmail:
          type: string
          description: Email of the account technical owner.
        deactivationDate:
          type: string
          format: date
          description: Date the account was deactivated.
        id:
          type: string
        name:
          type: string
        supportTier:
          type: string
        region:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        activationDate:
          type: string

    ProjectDetails:
      type: object
      properties:
        totalQueryHours:
          type: number
          description: Total query hours entitlement. Omitted when not tracked.
        consumedQueryHours:
          type: number
          description: Query hours consumed. Omitted when not tracked.
        remainingQueryHours:
          type: number
          description: Query hours remaining. Omitted when not tracked; 0 means none remaining.
        totalOnboardingHours:
          type: number
          description: Total onboarding hours entitlement. Omitted when not tracked.
        consumedOnboardingHours:
          type: number
          description: Onboarding hours consumed. Omitted when not tracked.
        remainingOnboardingHours:
          type: number
          description: Onboarding hours remaining. Omitted when not tracked; 0 means none remaining.
        goLiveDate:
          type: string
          format: date
          description: Actual go-live date.
        goLivePlanDate:
          type: string
          format: date
          description: Planned go-live date.
        onboardingExpiryDate:
          type: string
          format: date
          description: Date the onboarding entitlement expires.
        onboardingStatus:
          type: string
          description: Onboarding status.
        # Project type as an {id, label} reference. The label matches the portal's
        # ProjectType enum exactly: it gates the Operations navigation item and
        # drives severity and product-default rules. Omitted when the upstream
        # subscription type is empty.
        type:
          $ref: '#/components/schemas/IdLabelRef'
        id:
          type: string
        account:
          $ref: '#/components/schemas/ProjectAccount'
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string
        closureState:
          type: string

    # ---- cases ----

    SearchCasesRequest:
      description: >
        filters uses the frontend's own field names and ServiceNow numeric
        choice-list ids (statusIds/severityIds/issueIds/engagementTypeKeys),
        not entity-service's own lowercase-snake-case string enums — this
        backend translates between the two (see case_enum_mapping.go). There
        is no projectIds filter: project scope comes exclusively from the
        {id} path parameter.
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        sortBy:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            statusIds:
              type: array
              items:
                type: integer
            caseTypes:
              type: array
              items:
                type: string
            severityIds:
              type: array
              items:
                type: integer
            issueIds:
              type: array
              items:
                type: integer
            deploymentIds:
              type: array
              items:
                type: string
            createdByMe:
              type: boolean
            createdBy:
              type: array
              items:
                type: string
            engagementTypeKeys:
              type: array
              items:
                type: integer
            closedStartDate:
              type: string
            closedEndDate:
              type: string
            startCreatedDate:
              type: string
            endCreatedDate:
              type: string
            startUpdatedDate:
              type: string
            endUpdatedDate:
              type: string

    IdLabelRef:
      description: >
        {id, label} pair. For case-search enum fields (status/severity/
        issueType/engagementType/type), id is a ServiceNow numeric
        choice-list key (as a string) matching what the frontend's
        CaseType/statusIds/etc already use — see case_enum_mapping.go.
      type: object
      properties:
        id:
          type: string
        label:
          type: string

    CaseSummary:
      type: object
      properties:
        id:
          type: string
        internalId:
          type: string
        number:
          type: string
        title:
          type: string
        description:
          type: string
        assignedEngineer:
