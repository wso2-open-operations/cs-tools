    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Registry team key. Stable across environments, unlike the group's id.
        name:
          type: string
        family:
          type: string
          enum: [cre-abt, cre, sre-abt, sre]
          description: >
            Team family classification. The `-abt` variants are account-based teams; the
            bare variants classify a member of the same discipline who is not on an
            account-based team. Omitted when the team is not classified into a family:
            not every team is. This is the field a discipline-scoped team picker filters
            on via `SearchTeamsRequest.filters.family` — an SRE-scoped dashboard's picker
            requests `sre-abt` and gets only those teams back.
        creGroupId:
          type: string
          description: >
            The backing CRE (Customer Renewal & Expansion) group's id, suitable for the
            case search creTeamIds filter. Present only when the deployment's team
            registry configured a backing CRE group id for this team; a team without
            one is still listed, just not filter-scopable.
        sreGroupId:
          type: string
          description: >
            The backing SRE (Site Reliability Engineering) group's id, suitable for the
            case search sreTeamIds filter. Present only when the deployment's team
            registry configured a backing SRE group id for this team; a team without
            one is still listed, just not filter-scopable.

    SearchTeamsRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            family:
              type: string
              enum: [cre-abt, cre, sre-abt, sre]
              description: >
                Restrict results to teams whose family exactly matches (case-insensitive).
                A team with no family configured never matches. Used by a discipline-scoped
                picker, e.g. a `cre`-type dashboard's team selector passes `cre-abt`.
        pagination:
          $ref: '#/components/schemas/UserPagination'

