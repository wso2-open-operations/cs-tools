    DashboardWidget:
      type: object
      properties:
        widgetId:
          type: string
          description: Static id of the widget template within its dashboard
        displayName:
          type: string
        description:
          type: string
          description: >
            Explanatory subtitle shown under displayName. Config-owned text,
            not hardcoded per resourceType/shape on the frontend.
        resourceType:
          type: string
          enum:
            - case
            - incident
            - change_request
            - account
            - project
            - user
            - time_card
            - problem
            - product_vulnerability
            - call_request
            - service_request
            - security_report_analysis
            - announcement
            - engagement
          description: >
            Which resource's /search endpoint this widget's filters target.
            service_request, security_report_analysis, announcement and
            engagement are additional values of the case-search "type" field
            (see Case's own type enum) exposed as their own widget
            resourceType alongside case itself — all five route to the same
            POST /cases/search.
        shape:
          type: string
          enum:
            - count
            - list
            - pie
            - bar
          description: >
            How the widget's data should be rendered once resolved. shapes
            "pie" and "bar" both resolve one search per slices entry, the
            same way "count" resolves its own single search (see slices
            below) — they differ only in how the frontend renders the same
            resolved data (wedges vs. bars), not in how it's fetched.
        gridWidth:
          type: integer
          minimum: 1
          maximum: 12
          description: CSS grid columns out of 12 this widget should occupy
        query:
          type: object
          additionalProperties: true
          description: >
            Search criteria for this widget, exactly as configured — any
            "__current_user__"/"__current_team__" placeholder a filter value
            carries is left unresolved for the caller to substitute
            client-side before use. Pass this directly as the filters of
            that resourceType's own POST /{resourceType}s/search request to
            resolve the widget's data. For shapes "pie"/"bar" this is a
            shared base merged under every slices entry's own query
            (caller-side; slices entry keys win on conflict) rather than
            queried on its own.
        groupBy:
          type: string
          description: Unused
        listLimit:
          type: integer
          description: Only meaningful for shape list; how many records to show
        slices:
          type: array
          description: >
            Only meaningful for shapes "pie"/"bar": one search per entry,
            each resolved via its own total, the same mechanism shape
            "count" uses. Merge each entry's query under this widget's
            own query (entry keys win on conflict) before searching.
          items:
            type: object
            properties:
              label:
                type: string
              color:
                type: string
                description: >
                  Palette key (e.g. "primary", "error") the frontend already
                  uses elsewhere in this system; not validated here, forwarded
                  verbatim. Falls back to a fixed rotation over the same
                  palette on the frontend if omitted.
              query:
                type: object
                additionalProperties: true
                description: >
                  This slice's own criteria only, exactly as configured — any
                  "__current_user__"/"__current_team__" placeholder a filter
                  value carries is left unresolved for the caller to
                  substitute client-side — merge under the parent widget's
                  own query to resolve this slice's total.
        section:
          type: string
          description: >
            Groups widgets sharing the same (non-empty) value under a
            titled sub-section within the dashboard, in the order that
            value first appears among the dashboard's widgets. Widgets
            with no section (the common case) render in one untitled
            group, same as before this field existed.
        columns:
          type: array
          description: >
            Only meaningful for shape "list": an ordered set of columns the
            frontend should render instead of that resourceType's own
            hardcoded list renderer. Absent/empty renders exactly as before
            this field existed (the existing hardcoded per-resourceType
            renderer).
          items:
            type: object
            properties:
              path:
                type: string
                description: >
                  Dot-separated path into one item of that resourceType's
                  own /search response, reaching into nested objects to
                  arbitrary depth (e.g. "project.key",
                  "project.account.tier") — search responses embed related
                  entities as nested JSON objects, not flat records. Not
                  validated server-side; a path that resolves to nothing
                  renders that cell empty.
              label:
                type: string
                description: Column header text.
              format:
                type: string
                description: >
                  Rendering hint. Omitted (or "text") renders plain text;
                  "date" formats a date/date-time value the same way the
                  frontend's existing hardcoded list renderers already do.
        sortBy:
          type: object
          additionalProperties: true
          description: >
            Only meaningful for shape "list": opaque sort criteria, forwarded
            verbatim as the sortBy object of that resourceType's own POST
            /{resourceType}s/search request — same passthrough philosophy as
            query/filters. Not validated here; an unsupported field name for
            that resourceType is surfaced by that resource's own /search
            endpoint, not caught here.

    DashboardListItem:
      type: object
      properties:
        id:
          type: string
          description: Static id of the dashboard
        displayName:
          type: string
        type:
          type: string
          enum: [cre, sre, cs]
          description: >
            Who the dashboard is built for. This is the field automatic
            dashboard selection is intended to key off: a caller whose team
            family is `cre-abt`/`cre` would land on the default `cre`
            dashboard, `sre-abt`/`sre` on the default `sre` one, and a caller
            with no team on the default `cs` one. That selection is NOT
            implemented yet: the frontend still picks on isDefault plus
            isTeamBased, and the loader correspondingly permits only one
            isDefault dashboard in total.
            `cre` and `sre` are team-scoped and always carry
            isTeamBased true; `cs` is organisation-wide and always carries it
            false — the loader rejects any other combination at startup.
            Omitted only for a definition that predates the field, which is
            possible solely via the deprecated single-variable configuration.
        isDefault:
          type: boolean
          description: >
            Whether this is the default dashboard to show first. At most one
            dashboard in the registry may set it: the loader rejects a second
            at startup, of any type, until selection becomes type-aware.
        isTeamBased:
          type: boolean
          description: >
            Whether the frontend should offer a team selector (from
            POST /teams/search) alongside the dashboard switcher when this
            dashboard is selected. UI skeleton only today — selecting a team
            does not yet scope any widget's data.

    Dashboard:
      type: object
      properties:
        id:
          type: string
          description: Static id of the dashboard
        displayName:
          type: string
        type:
          type: string
          enum: [cre, sre, cs]
          description: >
            Who the dashboard is built for. This is the field automatic
            dashboard selection is intended to key off: a caller whose team
            family is `cre-abt`/`cre` would land on the default `cre`
            dashboard, `sre-abt`/`sre` on the default `sre` one, and a caller
            with no team on the default `cs` one. That selection is NOT
            implemented yet: the frontend still picks on isDefault plus
            isTeamBased, and the loader correspondingly permits only one
            isDefault dashboard in total.
            `cre` and `sre` are team-scoped and always carry
            isTeamBased true; `cs` is organisation-wide and always carries it
            false — the loader rejects any other combination at startup.
            Omitted only for a definition that predates the field, which is
            possible solely via the deprecated single-variable configuration.
        isDefault:
          type: boolean
          description: >
            Whether this is the default dashboard to show first. At most one
            dashboard in the registry may set it: the loader rejects a second
            at startup, of any type, until selection becomes type-aware.
        targetTeam:
          type: string
          description: >
            Descriptive metadata for which team this dashboard targets; not
            enforced — every dashboard is returned to every caller.
        isTeamBased:
          type: boolean
          description: >
            Whether the frontend should offer a team selector (from
            POST /teams/search) alongside the dashboard switcher when this
            dashboard is selected. UI skeleton only today — selecting a team
            does not yet scope any widget's data.
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'

