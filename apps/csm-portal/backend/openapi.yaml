                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /incidents/{id}/activities/search:
    post:
      summary: Search the activity trail of an incident.
      description: >
        Confirmed as a distinct endpoint from POST /cases/{id}/activities/search, built on
        the same underlying activity-search mechanism. The request body is forwarded to
        the integration service as-is and the response is returned verbatim. Set
        includeFieldChanges to also include per-field value changes.
      operationId: postIncidentsIdActivitiesSearch
      parameters:
        - name: id
          in: path
          description: UUID of the incident.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Incident activity search payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseActivitySearchPayload'
        required: false
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseActivitySearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /cases/{id}/activities/search:
    post:
      summary: Search the activity trail of a case.
      description: >
        Returns the chronological activity trail for a case (comments, work notes,
        state transitions, and other recorded field changes). The request body is
        forwarded to the integration service as-is and the response is returned
        verbatim. Set includeFieldChanges to also include per-field value changes.
      operationId: postCasesIdActivitiesSearch
      parameters:
        - name: id
          in: path
          description: UUID of the case.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Case activity search payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseActivitySearchPayload'
        required: false
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseActivitySearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /cases/{id}/escalations:
    get:
      summary: Get a case's escalation history.
      description: >
        Returns the full escalation history for a case (each escalate/de-escalate
        step, newest first). Supported by the ServiceNow data source only.
      operationId: getCasesIdEscalations
      parameters:
        - name: id
          in: path
          description: UUID of the case.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEscalationSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
    post:
      summary: Escalate or de-escalate a case.
      description: >
        Raises or lowers a case's escalation level by one step. A work note
        recording the change is added to the case automatically as a side
        effect. Supported by the ServiceNow data source only.
      operationId: postCasesIdEscalations
      parameters:
        - name: id
          in: path
          description: UUID of the case.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Case escalation payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseEscalationCreatePayload'
        required: false
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEscalation'
        "400":
          description: BadRequest — an invalid action value, or reason missing while escalating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /attachments:
