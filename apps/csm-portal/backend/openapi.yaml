    ChangeRequestSearchPayload:
      type: object
      nullable: true
      properties:
        filters:
          type: object
          properties:
            projectIds:
              type: array
              items:
                type: string
                format: uuid
              description: Filter by project UUIDs (optional)
            searchQuery:
              type: string
              description: Search across subject and number (case-insensitive)
            states:
              type: array
              items:
                type: string
                enum:
                  - customer_approval
                  - scheduled
                  - implement
                  - review
                  - customer_review
                  - rollback
                  - closed
                  - canceled
              description: Filter by change request state (optional)
            impacts:
              type: array
              items:
                type: string
                enum:
                  - high
                  - medium
                  - low
              description: Filter by impact level (optional)
            closedStartDate:
              type: string
              format: date-time
              description: Filter change requests closed on or after this UTC datetime (optional)
            closedEndDate:
              type: string
              format: date-time
              description: Filter change requests closed on or before this UTC datetime (optional)
            number:
              type: string
              description: >-
                A single change request number (e.g. "CHG0010001"); matches
                exactly. Routed as a first-class filter rather than through
                the free-text searchQuery scan.
            filters:
              type: array
              items:
                type: object
                required: [field, op]
                properties:
                  field:
                    type: string
                    enum: [createdOn, assignmentGroupId, approval]
                  op:
                    type: string
                    enum: [gte, lte, in, eq]
                  values:
                    type: array
                    items:
                      type: string
              description: >-
                Generic field/op/values filter predicates, additive to the
                named fields above. Passed through as-is to the entity
                service. Supported fields:

                - **createdOn** (gte / lte): a single RFC3339 timestamp,
                  YYYY-MM-DD date, or relative-date placeholder (e.g.
                  "__daysAgo:90__") bounding the change request's created
                  timestamp.
                - **assignmentGroupId** (in): sys_user_group UUIDs.
                - **approval** (eq): ServiceNow's raw task.approval rollup on
                  the change request. Exactly one value, one of
                  "not requested", "requested", "approved", "rejected".
                  Distinct from the approvedBy/approvedOn fields on a change
                  request's detail view, which come from a narrower
                  Customer-Approval-stage record, not this CR-wide field.
        sortBy:
          type: object
          properties:
            field:
              type: string
              enum: [createdOn, updatedOn]
              default: createdOn
            order:
              type: string
              enum: [asc, desc]
              default: desc
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'
            - properties:
                limit:
                  default: 20
                  maximum: 100

