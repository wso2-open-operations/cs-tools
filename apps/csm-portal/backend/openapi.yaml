        parentCase:
          $ref: '#/components/schemas/CaseNumberRef'
        relatedCase:
          $ref: '#/components/schemas/CaseNumberRef'
        account:
          $ref: '#/components/schemas/AccountRef'
        escalationLevel:
          type: string
          nullable: true
          enum:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
          description: >-
