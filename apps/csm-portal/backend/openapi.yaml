    IncidentAggregatePayload:
      type: object
      required: [groupBy]
      properties:
        filters:
          type: object
          description: Same shape as IncidentSearchPayload.filters.
        groupBy:
          type: string
          enum: [state, assignmentGroup, businessService]
          description: The field to aggregate incident counts by.
        maxGroups:
          type: integer
          description: >-
            Caps the response to the top maxGroups buckets by count; the
            remainder is folded into AggregateResponse.othersCount. Optional;
