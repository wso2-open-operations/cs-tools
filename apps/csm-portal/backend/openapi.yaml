        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        timeZone:
          type: string
          description: User's preferred time zone (e.g. "America/New_York")
        roles:
          type: array
          items:
            type: string
        phoneNumber:
          type: string
          description: Mobile phone number in E.164 format (sourced from SCIM)
        team:
          nullable: true
          description: >
            The caller's resolved account-based team. Absent when the caller has no
            resolvable team membership, or when team resolution failed.
          allOf:
            - $ref: '#/components/schemas/UserTeam'

    UserTeam:
      type: object
      description: An account-based team the caller belongs to.
      properties:
        teamKey:
          type: string
        teamName:
          type: string
        family:
          type: string
          enum: [cre-abt, cre, sre-abt, sre]
          description: >
            Team family classification. The `-abt` variants are account-based teams; the
            bare variants classify a member of the same discipline who is not on an
            account-based team. Omitted when the team is not classified into a family:
            not every team is. This is the field a discipline-scoped team picker *can*
            filter on: it is what would let an SRE-scoped dashboard offer only
            `sre-abt` teams. Nothing does so yet. Today's picker renders every team
            this endpoint returns, and the scoping is a follow-up.

    UserUpdatePayload:
      type: object
