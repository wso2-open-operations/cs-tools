components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorPayload:
      type: object
      properties:
        message:
          type: string

    PatchChangeRequestPayload:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >
        Any combination of fields may be supplied; at least one is required.
        Omitted fields are left unchanged. isCustomerApproved, isCustomerReviewed,
        and requestApproval are mutually exclusive: at most one may be set.
      allOf:
        - not:
            required: [isCustomerApproved, isCustomerReviewed]
        - not:
            required: [isCustomerApproved, requestApproval]
        - not:
            required: [isCustomerReviewed, requestApproval]
      properties:
        title:
          type: string
        description:
          type: string
        projectId:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        deployedProductId:
          type: string
          format: uuid
        assignedEngineerId:
          type: string
          format: uuid
        assignedTeamId:
          type: string
          format: uuid
        plannedStartOn:
          type: string
          description: Planned start date and time (format YYYY-MM-DD HH:MM:SS).
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
        plannedEndOn:
          type: string
          description: Planned end date and time (format YYYY-MM-DD HH:MM:SS).
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
        impact:
          type: string
          enum: [high, medium, low]
        state:
          type: string
          enum: [new, assess, authorize, customer_approval, scheduled, implement, review, customer_review, rollback, closed, canceled]
        type:
          type: string
          enum: [standard, normal, emergency, model, site_reliability_ops, azure]
        justification:
          type: string
        impactDescription:
          type: string
        serviceOutage:
          type: string
        communicationPlan:
          type: string
        rollbackPlan:
          type: string
        testPlan:
          type: string
        isCustomerApproved:
          type: boolean
          description: >-
            Records the customer's approval decision on the change request.
            Mutually exclusive with isCustomerReviewed and requestApproval.
        isCustomerReviewed:
          type: boolean
          description: >-
            Records the customer's post-implementation review decision.
            Mutually exclusive with isCustomerApproved and requestApproval.
        requestApproval:
          type: boolean
          description: >-
            Transitions the change request from New to Assess and requests
            approval. Mutually exclusive with isCustomerApproved and
            isCustomerReviewed.

    PatchChangeRequestResponse:
      type: object
      required: [message, changeRequest]
      properties:
        message:
          type: string
        changeRequest:
          $ref: '#/components/schemas/ChangeRequestDetail'

    TimeCardState:
      type: string
      enum:
        - pending
        - submitted
        - approved
        - rejected
        - processed
        - recalled

    SearchTimeCardsFilters:
      type: object
      properties:
        projectIds:
          type: array
          items:
            type: string
            format: uuid
        caseId:
          type: string
          format: uuid
          description: Only time cards logged against this case.
        userId:
          type: string
          format: uuid
          description: Only time cards submitted by this user.
        approverId:
          type: string
          format: uuid
          description: Only time cards this user is eligible to approve (SN approver_list). The approver's own cards are always excluded server-side.
        approvedById:
          type: string
          format: uuid
          description: Only time cards actually approved by this user (SN approved_by).
        userIds:
          type: array
          items:
            type: string
            format: uuid
          description: Match cards submitted by any of these users.
        startDate:
          type: string
          description: ISO 8601 date (YYYY-MM-DD).
        endDate:
          type: string
          description: ISO 8601 date (YYYY-MM-DD).
        states:
          type: array
          items:
            $ref: '#/components/schemas/TimeCardState'

    SearchTimeCardsPayload:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/SearchTimeCardsFilters'
        pagination:
          type: object
          properties:
            offset:
              type: integer
              minimum: 0
              default: 0
            limit:
              type: integer
              minimum: 1
              maximum: 100
              default: 20

    TimeCardRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    TimeCardCaseRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        number:
          type: string

    TimeCardView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        totalTime:
          type: number
          format: double
        createdOn:
          type: string
        hasBillable:
          type: boolean
        state:
          type: string
        user:
          $ref: '#/components/schemas/TimeCardRef'
        approvedBy:
          $ref: '#/components/schemas/TimeCardRef'
        project:
          $ref: '#/components/schemas/TimeCardRef'
        case:
          $ref: '#/components/schemas/TimeCardCaseRef'

    SearchTimeCardsResponse:
      type: object
      properties:
        timeCards:
          type: array
          items:
            $ref: '#/components/schemas/TimeCardView'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateTimeCardPayload:
      type: object
      required: [caseId, projectId, date, approverIds]
      properties:
        caseId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        date:
          type: string
          description: ISO 8601 date (YYYY-MM-DD).
        approverIds:
          type: array
          items:
            type: string
            format: uuid
          description: Eligible approvers (approver_list). Must be non-empty.
        isBillable:
          type: boolean
        issueComplexity:
          type: string
        workLogComment:
          type: string
        timeAnalyzing:
          type: integer
        timeSettingUp:
          type: integer
        timeReproducingDebugging:
          type: integer
        timeProvidingSolution:
          type: integer
        timePatching:
          type: integer

    UpdateTimeCardPayload:
      type: object
      minProperties: 1
      description: >
        Either editable fields (no `state`), or a state transition: `state`
        = `approved`, or `state` = `rejected` with a `leadComment`. The two are
        mutually exclusive and an empty body is rejected; the entity service
        enforces this.
      properties:
        state:
          type: string
          enum: [approved, rejected]
        leadComment:
          type: string
          description: Required when state is rejected.
        date:
          type: string
          description: ISO 8601 date (YYYY-MM-DD).
        approverIds:
          type: array
          items:
            type: string
            format: uuid
        isBillable:
          type: boolean
        issueComplexity:
          type: string
        workLogComment:
          type: string
        timeAnalyzing:
          type: integer
        timeSettingUp:
          type: integer
        timeReproducingDebugging:
          type: integer
        timeProvidingSolution:
          type: integer
        timePatching:
          type: integer

    TimeCardMutationResponse:
      type: object
      properties:
        message:
          type: string
        timeCard:
          $ref: '#/components/schemas/TimeCardView'

    DeleteTimeCardResponse:
      type: object
      properties:
        message:
          type: string

    UpdateCaseRequest:
      type: object
      description: |
        Exactly one of `state`, `severity`, `workState`, `watchList`, `assigneeEmail`, `parentId`,
        `acknowledge`, `type`, `subject`, `description`, `deploymentId`, `deployedProductId`,
        `relatedCaseId`, `autocloseHoldUntil`, `bestCaseFixEta`, `mostLikelyFixEta`, or
        `worstCaseFixEta` must be provided. `watchList`, `assigneeEmail`, `parentId`, and `autocloseHoldUntil` are
        supported only for the ServiceNow data source.
        `resolutionCode`, `cause`, and `closeNotes` are optional resolution fields that may only be
        provided alongside `state: closed` or `state: solution_proposed`.
        `type` transfers the case to another type, ServiceNow only. Its companion fields carry
        the target type's mandatory data: `severity` and `issueType` alongside `type: case`;
        `engagementType` alongside `type: engagement`; `catalogId`, `catalogItemId` and a
        non-empty `variables` alongside `type: service_request`; none for
        `type: security_report_analysis`. A companion is rejected without `type`, or with a
        `type` it does not belong to. `severity` is the one field that may accompany `type`.
      oneOf:
        - required: [state]
        - required: [severity]
        - required: [workState]
        - required: [watchList]
        - required: [assigneeEmail]
        - required: [parentId]
        - required: [acknowledge]
        - required: [type]
        - required: [subject]
        - required: [description]
        - required: [deploymentId]
        - required: [deployedProductId]
        - required: [relatedCaseId]
        - required: [autocloseHoldUntil]
        - required: [bestCaseFixEta]
        - required: [mostLikelyFixEta]
        - required: [worstCaseFixEta]
      properties:
        state:
          type: string
          enum: [open, work_in_progress, waiting_on_wso2, awaiting_info, reopened, solution_proposed, closed]
          description: The new state to transition the case to.
        severity:
          type: string
          enum: [catastrophic, critical, high, medium, low]
          description: The new severity of the case.
        type:
          type: string
          enum: [case, engagement, security_report_analysis, service_request]
          description: >
            Transfers the case to this type (ServiceNow only). `announcement` is
            system-managed and never a valid transfer target.
        issueType:
          type: string
          enum: [total_outage, partial_outage, performance_degradation, question, security_or_compliance, error]
          description: "Required alongside `type: case`; rejected for every other target type."
        engagementType:
          type: string
          enum: [migration, consultancy, new_feature_improvement, follow_up, onboarding]
          description: "Required alongside `type: engagement`."
        catalogId:
          type: string
          format: uuid
          description: "Required alongside `type: service_request`."
        catalogItemId:
          type: string
          format: uuid
          description: "Required alongside `type: service_request`."
        variables:
          type: array
          description: >
            Answers to the target catalog item's questions, only meaningful alongside
            `type: service_request`. Optional even then — a catalog item with no
            questions has nothing to answer.
          items:
            type: object
            required: [id, value]
            properties:
              id:
                type: string
                format: uuid
              value:
                type: string
        workState:
          type: string
          enum: [ongoing, paused]
          description: The new work sub-state of the case. Only applicable when the case state is work_in_progress.
        watchList:
          type: array
          items:
            type: string
            format: email
          description: List of email addresses to set as the case watch list (ServiceNow only).
        assigneeEmail:
          type: string
          format: email
          description: Email of the engineer to assign to this case (ServiceNow only).
        acknowledge:
          type: boolean
          enum: [true]
          description: |
            Acknowledge the case as the calling engineer: a first-write-wins claim that
            someone has seen it and picked it up, which is distinct from assignment.
            Succeeds without changing anything if the case is already acknowledged, in
            which case the response carries `alreadyAcknowledged: true`. Only `true` is
            accepted; there is no way to remove an acknowledgement. Requires an elevated
            support role, and is supported only by data sources that record
            acknowledgement.
        resolutionCode:
          $ref: '#/components/schemas/CaseResolutionCode'
          description: Resolution code — only allowed when state is closed or solution_proposed.
        cause:
          $ref: '#/components/schemas/CaseCause'
          description: Root-cause category — only allowed when state is closed or solution_proposed.
        closeNotes:
          type: string
          description: Free-text closure notes — only allowed when state is closed or solution_proposed.
        parentId:
          type: string
          format: uuid
          description: >
            UUID of another case, incident, change request, or problem to link this case to as
            its parent — e.g. linking a service-request case back to the case or incident that
            spawned it, or establishing the hierarchical major-case/child-case relationship
            (ServiceNow only). Linking to a closed/inactive record may silently no-op upstream;
            the response's parentCase reflects whether the link actually changed. A case may not
            be closed while it has open children linked via this relationship.
        subject:
          type: string
          description: New subject/title for the case.
        description:
          type: string
          description: New description for the case.
        deploymentId:
          type: string
          format: uuid
          description: >
            UUID of the deployment to associate with this case, replacing the existing one. May
            carry SLA/entitlement side effects owned by the backing data source — the portal
            performs no validation of those effects.
        deployedProductId:
          type: string
          format: uuid
          description: UUID of the deployed product to associate with this case, replacing the existing one.
        relatedCaseId:
          type: string
          format: uuid
          description: >
            UUID of another case to cross-link to this one as a related case. A looser,
            non-hierarchical link — not subject to the child-case close restriction that applies
            to `parentId`.
        autocloseHoldUntil:
          type: string
          format: date-time
          description: >
            Places the case on hold in the backing data source's staged auto-closure sequence
            until this date, mirroring the real ServiceNow UX (an engineer picks a hold-until
            date). This is the only supported write against that sequence — the raw
            `autoclosureStep` state is not directly settable (ServiceNow only).
        bestCaseFixEta:
          type: string
          format: date
          description: >
            Sets the internal-only best-case fix-commitment date estimate for the case
            (date-only, YYYY-MM-DD). Never surfaced to the customer.
        mostLikelyFixEta:
          type: string
          format: date
          description: >
            Sets the internal-only most-likely fix-commitment date estimate for the case
            (date-only, YYYY-MM-DD). Never surfaced to the customer.
        worstCaseFixEta:
          type: string
          format: date
          description: >
            Sets the internal-only worst-case fix-commitment date estimate for the case
            (date-only, YYYY-MM-DD). Never surfaced to the customer.

    UpdateCaseResponse:
      type: object
      required: [message, case]
