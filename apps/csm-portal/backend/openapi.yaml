      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ProjectContact'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Total number of matching contacts

    ProjectClosureFields:
      type: object
      description: >
        Closure-tracking fields shared by the project search row and the project
        detail response. Only populated for projects sourced from the backing
        data source; null otherwise.
      properties:
        closureState:
          type: string
          nullable: true
          description: >
            The project's overall closure/access state. Derived by the backing data
            source from the three sub-states below; never settable directly.
        endDateClosureState:
          type: string
          nullable: true
        invoiceDueDateClosureState:
          type: string
          nullable: true
        complianceViolationClosureState:
          type: string
          nullable: true
        complianceViolationDate:
          type: string
          nullable: true
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing suspension
            flow in the backing data source. This is opaque JSON passed through
            as-is — its shape is not defined or validated by this layer.

    Project:
      description: >
        A project search result row. Deliberately leaner than ProjectDetails: the
        search projection carries no sfId and no updatedOn.
      allOf:
        - $ref: '#/components/schemas/ProjectClosureFields'
        - type: object
          properties:
            id:
              type: string
            name:
              type: string
            key:
              type: string
            subscriptionType:
              type: string
              enum:
                - development_support
                - managed_cloud_subscription
                - evaluation_subscription
                - subscription
                - cloud_evaluation_support
                - internal
                - platformer_subscription
                - cloud_support
                - professional_services
            startDate:
              type: string
              format: date-time
              nullable: true
              description: >
                Start of the project's current renewed period. Null when the backing
                data source has no start date recorded.
            endDate:
              type: string
              format: date-time
              nullable: true
              description: End of the project's current renewed period.
            createdOn:
              type: string
              format: date-time
              description: >
                When the project record was created. Distinct from startDate, which
                moves forward on each renewal.
            account:
              nullable: true
              description: Null when the project has no linked account.
              allOf:
                - $ref: '#/components/schemas/EntityRef'

    ProjectDetails:
      description: >
        The enriched single-project response. Adds sfId, updatedOn, and a fuller
        account reference on top of what the search row returns.
      allOf:
        - $ref: '#/components/schemas/ProjectClosureFields'
        - type: object
          properties:
            id:
              type: string
            account:
              $ref: '#/components/schemas/ProjectAccountRef'
            sfId:
              type: string
            name:
              type: string
            key:
              type: string
            subscriptionType:
              type: string
              enum:
                - development_support
                - managed_cloud_subscription
                - evaluation_subscription
                - subscription
                - cloud_evaluation_support
                - internal
                - platformer_subscription
                - cloud_support
                - professional_services
            startDate:
              type: string
              format: date-time
              nullable: true
              description: Start of the project's current renewed period.
            endDate:
              type: string
              format: date-time
              nullable: true
              description: End of the project's current renewed period.
            createdOn:
              type: string
              format: date-time
            updatedOn:
              type: string
              format: date-time
            hasSr:
              type: boolean
              description: >
                Whether this project is eligible to raise service requests, per the
                backing data source's own project classification.

    ProjectAccountRef:
      type: object
      description: The parent account summary embedded in a project detail response.
      properties:
        id:
          type: string
        name:
          type: string
        activationDate:
          type: string
          format: date-time
          nullable: true
        tier:
          type: string
          description: Free-form tier label, not the lowercase account tier enum.
        region:
          type: string
          nullable: true
        agentEnabled:
          type: boolean
        kbReferencesEnabled:
          type: boolean

    ProjectUpdatePayload:
      type: object
      minProperties: 1
      description: >
        At least one field must be provided. hasAgent and hasKbReferences are
        simple toggles; the closure-state fields track sub-states of an
        Account Closure Process and are only applicable to projects sourced
        from the backing data source.
      properties:
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        endDateClosureState:
          type: string
        invoiceDueDateClosureState:
          type: string
        complianceViolationClosureState:
          type: string
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing ServiceNow
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectUpdateResponse:
      type: object
      required: [message, project]
      properties:
        message:
          type: string
        project:
          type: object
          required: [id, updatedBy, updatedOn]
          properties:
            id:
              type: string
              format: uuid
            updatedBy:
              type: string
            updatedOn:
              type: string
              format: date-time
            closureState:
              type: string
              nullable: true
            endDateClosureState:
              type: string
              nullable: true
            invoiceDueDateClosureState:
              type: string
              nullable: true
            complianceViolationClosureState:
              type: string
              nullable: true
            suspensionProcessState:
              type: object
              additionalProperties: true
              nullable: true

    DeploymentCreatePayload:
      type: object
      required: [projectId, name, type, description]
      properties:
        projectId:
          type: string
          format: uuid
          description: UUID of the project this deployment belongs to.
        name:
          type: string
          description: Display name of the deployment.
        type:
          type: string
          enum: [primary_production, staging, qa, stress, uat, development]
          description: Deployment environment type.
        description:
          type: string
          description: Description of the deployment.

    DeploymentCreateResponse:
      type: object
      properties:
        message:
          type: string
        deployment:
          type: object
          properties:
            id:
              type: string
              format: uuid
            createdOn:
              type: string
              format: date-time
            createdBy:
              type: string

    DeploymentUpdatePayload:
      oneOf:
        - description: Update deployment detail fields. At least one of name, type, or description must be provided.
          type: object
          minProperties: 1
          properties:
            name:
              type: string
            type:
              type: string
              enum: [primary_production, staging, qa, stress, uat, development]
              description: Deployment environment type.
            description:
              type: string
              nullable: true
        - description: Deactivate the deployment. active must be false; no other fields may be present.
          type: object
          required: [active]
          properties:
            active:
              type: boolean
              enum: [false]

    DeploymentUpdateResponse:
      type: object
      required: [message, deployment]
      properties:
        message:
          type: string
        deployment:
          type: object
          required: [id, updatedOn, updatedBy]
          properties:
            id:
              type: string
              format: uuid
            updatedOn:
              type: string
              format: date-time
            updatedBy:
              type: string

    DeploymentSearchPayload:
      type: object
      properties:
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'
            - properties:
                limit:
                  default: 20
                  maximum: 100
        searchQuery:
          type: string
          description: Searches across name (case-insensitive); max 200 characters
        projectIds:
          type: array
          items:
            type: string
          description: Filter by project IDs (optional)
        deploymentTypes:
          type: array
          items:
            type: string
            enum:
              - primary_production
              - staging
              - qa
              - stress
              - uat
              - development
          description: Filter by deployment type (optional)

    DeploymentSearchResponse:
      type: object
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
        total:
          type: integer
          description: Total number of matching deployments
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    Deployment:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - primary_production
            - staging
            - qa
            - stress
            - uat
            - development
        description:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    ProductSearchPayload:
      type: object
      properties:
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'
            - properties:
                limit:
                  default: 20
                  maximum: 100
        searchQuery:
          type: string
          description: Searches across name (case-insensitive); max 200 characters

    ProductSearchResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          description: Total number of matching products
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    Product:
      description: >
        Product entry. When backed by the ServiceNow data source,
        createdOn/updatedOn are absent and class is a ServiceNow label
        (e.g. "Software Model").
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        class:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    ProductVersionSearchPayload:
      type: object
      properties:
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'
            - properties:
                limit:
                  default: 20
                  maximum: 100
        searchQuery:
          type: string
          description: Searches across version (case-insensitive); max 200 characters

    ProductVersionSearchResponse:
      type: object
      properties:
        productVersions:
          type: array
          items:
            $ref: '#/components/schemas/ProductVersion'
        total:
          type: integer
          description: Total number of matching product versions
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProductVersion:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        version:
          type: string
        currentSupportStatus:
          type: string
          enum: [available, extended, deprecated, discontinued]
        releaseDate:
          type: string
          format: date-time
        supportEolDate:
          type: string
          format: date-time
        earliestPossibleSupportEolDate:
          type: string
          format: date-time
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    DeployedProductSearchPayload:
      type: object
      properties:
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'
            - properties:
                limit:
                  default: 20
                  maximum: 100

    DeployedProductSearchResponse:
      type: object
      properties:
        deployedProducts:
          type: array
          items:
            $ref: '#/components/schemas/DeployedProduct'
        total:
          type: integer
          description: Total number of matching deployed products
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    DeployedProduct:
      type: object
      properties:
        id:
          type: string
        deploymentId:
          type: string
        productId:
          type: string
        productVersionId:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time

    DeployedProductCreatePayload:
      type: object
      required: [projectId, productId, versionId]
      properties:
        projectId:
          type: string
          format: uuid
          description: UUID of the project this deployed product belongs to.
        productId:
          type: string
          format: uuid
          description: UUID of the product being deployed.
        versionId:
          type: string
          format: uuid
          description: UUID of the product version being deployed.
        cores:
          type: integer
          description: Number of cores allocated for the product.
        tps:
          type: number
          description: Transactions per second allocated for the product.
        description:
          type: string
          description: Description of the deployed product.

    DeployedProductCreateResponse:
      type: object
      properties:
        message:
          type: string
        deployedProduct:
          type: object
          properties:
            id:
              type: string
              format: uuid
            createdOn:
              type: string
              format: date-time
            createdBy:
              type: string

    DeployedProductUpdatePayload:
      oneOf:
        - description: Update detail fields. At least one of cores, tps, or description must be provided.
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            cores:
              type: integer
              nullable: true
            tps:
              type: number
              nullable: true
            description:
              type: string
              nullable: true
        - description: Deactivate the deployed product. active must be false; no other fields may be present.
          type: object
          required: [active]
          additionalProperties: false
          properties:
            active:
              type: boolean
              enum: [false]

    DeployedProductUpdateResponse:
      type: object
      properties:
        message:
          type: string
        deployedProduct:
          type: object
          properties:
            id:
              type: string
              format: uuid
            updatedOn:
              type: string
              format: date-time
            updatedBy:
              type: string

    Pagination:
      type: object
      properties:
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          default: 10

    CaseCommentCreatePayload:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum: [work_note, comment, activity]
          description: work_note is restricted to internal users; activity to internal and system users
        content:
          type: string
          description: Comment text

    RequestCaseUpdatePayload:
      type: object
      required:
        - stage
      description: >
        The category (generic vs. migration) is never accepted here — it is
        always resolved server-side from the case's own type/engagementType.
      properties:
        stage:
          type: string
          enum: [first, second, final, custom]
          description: >
            One of the three fixed reminder templates, or "custom" to supply
            customContent instead.
        customContent:
          type: string
          description: >
            Required and non-empty when stage is "custom"; rejected (must be
            absent) for every other stage.

    CaseUpdateRequestTemplates:
      type: object
      description: >
        Both categories' full stage->message maps. Neither category includes
        a "custom" entry.
      properties:
        generic:
          type: object
          additionalProperties:
            type: string
          example:
            first: "<p>Hi Team,</p>..."
            second: "<p>Hi Team,</p>..."
            final: "<p>Hi Team,</p>..."
        migration:
          type: object
          additionalProperties:
            type: string
          example:
            first: "<p>Hi Team,</p>..."
            second: "<p>Hi Team,</p>..."
            final: "<p>Hi Team,</p>..."

    SnCommentCreatePayload:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum: [work_note, comment]
          description: >
            work_note is restricted to internal users. activity is not offered here --
            it is not supported for ServiceNow-backed comment creation (change request,
            incident).
        content:
          type: string
          description: Comment text

    CommentCreateResult:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string

    CreateCommentResponse:
      type: object
      properties:
        message:
          type: string
        comment:
          $ref: '#/components/schemas/CommentCreateResult'

    CaseComment:
      type: object
      properties:
        id:
          type: string
        caseId:
          type: string
        type:
          type: string
          enum: [work_note, comment, activity]
        content:
          type: string
        createdBy:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserReference'
        createdOn:
          type: string
          format: date-time

    CaseCommentSearchPayload:
      type: object
      nullable: true
      description: Payload for paginating comments on a case. The case ID is taken from the URL path.
      properties:
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'
            - properties:
                limit:
                  default: 20
                  maximum: 100

    CaseCommentSearchResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CaseComment'
        total:
          type: integer
          description: Total number of comments on the case
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CaseActivitySearchPayload:
      type: object
      nullable: true
      description: >
        Payload for paginating the activity trail of a case. The case ID is taken
        from the URL path. The payload is forwarded to the integration service as-is.
      properties:
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'
            - properties:
                limit:
                  default: 20
                  maximum: 100
        includeFieldChanges:
          type: boolean
          description: When true, include per-field value changes in each activity entry.

    CaseActivity:
      type: object
      description: A single entry in a case's activity trail. Shape is defined by the integration service.
      additionalProperties: true
      properties:
        id:
          type: string
        caseId:
          type: string
        type:
          type: string
        createdBy:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserReference'
        createdOn:
          type: string
          format: date-time

    CaseActivitySearchResponse:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/CaseActivity'
        total:
          type: integer
          description: Total number of activity entries on the case
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CaseEscalationNotifiedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        userName:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    CaseEscalation:
      type: object
      description: >
        One escalation-level change recorded against a case: either an escalate
        or a de-escalate step, with the level it moved from and to. Supported
        by the ServiceNow data source only.
      properties:
        id:
          type: string
        caseId:
          type: string
        currentLevel:
          type: string
          description: >
            The escalation-level id ("0" through "5": EL0 "not escalated"
            through EL5 "CEO") after this change — the same id space the case
            search's escalationLevel filter accepts and returns.
        previousLevel:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        notifiedUsers:
          type: array
          items:
            $ref: '#/components/schemas/CaseEscalationNotifiedUser'

    CaseEscalationSearchResponse:
      type: object
      description: The response for GET /cases/{id}/escalations — the case's full escalation history, newest first.
      properties:
        escalations:
          type: array
          items:
            $ref: '#/components/schemas/CaseEscalation'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    CaseEscalationCreatePayload:
      type: object
      description: >
        The case ID is taken from the URL path. action defaults to ESCALATE
        when omitted. reason is required when escalating and optional when
        de-escalating.
      properties:
        reason:
          type: string
        action:
          type: string
          enum: [ESCALATE, DEESCALATE]

    AssignedEngineerRef:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true

    CaseNumberRef:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        type:
          type: string
          enum: [case, incident, change_request, problem]
          nullable: true
          description: >
            What kind of record this reference points at. Null when the
            backing data source could not resolve the referenced record's
            kind; a client must not then assume it is a case, since linking
            to a case detail page for a non-case record would 404.

    LinkedServiceRequestRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        name:
          type: string
      description: >
        A service-request case whose parent points to this case or incident (the
