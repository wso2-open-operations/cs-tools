        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /change-requests/{id}/comments/search:
    post:
      summary: Search comments on a change request.
      operationId: postChangeRequestsIdCommentsSearch
      parameters:
        - name: id
          in: path
          description: UUID of the change request.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Change request comment search payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCommentSearchPayload'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCommentSearchResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /incidents/{id}/comments:
    post:
      summary: Create a comment on an incident.
      operationId: postIncidentsIdComments
      parameters:
        - name: id
          in: path
          description: UUID of the incident.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Incident comment creation payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnCommentCreatePayload'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommentResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /incidents/{id}/comments/search:
    post:
      summary: Search comments on an incident.
      operationId: postIncidentsIdCommentsSearch
