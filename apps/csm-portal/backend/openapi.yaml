    UserTeamRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        family:
          type: string
          enum: [cre-abt, cre, sre-abt, sre]
          description: >
            Team family classification. The `-abt` variants are account-based teams; the
            bare variants classify a member of the same discipline who is not on an
            account-based team. Omitted when the team is not classified into a family:
            not every team is. This is the field a discipline-scoped team picker *can*
            filter on: it is what would let an SRE-scoped dashboard offer only
            `sre-abt` teams. Nothing does so yet. Today's picker renders every team
            this endpoint returns, and the scoping is a follow-up.

    UserProjectAccess:
      type: object
      description: >
        One project-contact row for a user, reported as stored rather than as filtered. A
        row with no linked contact record makes the project, and every case on it, silently
        invisible to that user. grantsCaseAccess is the access rule applied per row:
        contactRecordPresent AND contactEmail matching contactRecordEmail, compared
        case-insensitively. It is deliberately not a restatement of contactRecordPresent --
        a row invited under one address but linked to a contact whose own address differs is
        invisible to both people, and that does happen on genuine customer rows. Both halves
        of the comparison are returned above, so a false verdict can be explained from the
        row itself.
      required: [projectId, projectName, projectKey, contactEmail, contactRecordPresent, grantsCaseAccess]
      properties:
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        projectKey:
          type: string
        contactEmail:
          type: string
        contactRecordPresent:
          type: boolean
        contactRecordEmail:
          type: string
        registrationState:
          type: string
        notificationsEnabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
        grantsCaseAccess:
          type: boolean

    SNUserDetail:
      type: object
      description: >
        One user's full profile. The membership, project-access, and externalAccount blocks
        are best-effort: each is empty/absent rather than failing the whole request when its
        upstream lookup fails.
      allOf:
        - $ref: '#/components/schemas/SNUser'
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: '#/components/schemas/UserGroupRef'
            teams:
              type: array
              items:
                $ref: '#/components/schemas/UserTeamRef'
            projectAccess:
              type: array
              description: Present for external contacts only.
              items:
                $ref: '#/components/schemas/UserProjectAccess'
            externalAccount:
              allOf:
                - $ref: '#/components/schemas/ExternalAccountStatus'
              description: >
                SCIM "external" org existence/lock status. Present for external contacts only
                (userType other than internal); absent when the SCIM lookup itself failed.

    ExternalAccountStatus:
      type: object
      description: SCIM "external" org existence/lock status for one user.
      required: [exists, locked]
      properties:
        exists:
          type: boolean
          description: Whether the user's account exists in the SCIM "external" org.
        locked:
          type: boolean
          nullable: true
          description: >
            Whether the account is locked. Null when the account does not exist or the lock
            state could not be determined.

    UserSearchFilters:
      type: object
      properties:
        searchQuery:
          type: string
          maxLength: 200
          description: Case-insensitive match against username and email.
        roleIds:
          type: array
          maxItems: 20
