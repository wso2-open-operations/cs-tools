          description: Filter by one or more roles. ServiceNow data source only.
        userIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
          description: >
            Restrict to specific users. Intersects with the other filters. Supplying this
            also lifts the active-only default, so a deactivated user stays retrievable by
            id. ServiceNow data source only.
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          description: Restrict to members of these groups. ServiceNow data source only.
        teamIds:
          type: array
          maxItems: 50
          items:
            type: string
          description: >
            Restrict to members of these teams, by team key, as returned by POST
            /teams/search. Each key is resolved to its group name from the startup-resolved
            registry before the membership query runs; a key that is not in the registry is
            a 400, not an empty result. ServiceNow data source only.
        userNames:
          type: array
          maxItems: 50
          items:
            type: string
          description: Filter to specific usernames (exact match).
        emails:
          type: array
          maxItems: 50
          items:
            type: string
          description: Filter to specific email addresses (exact match).
        active:
          type: boolean
          nullable: true
          description: When set, restricts results to active or inactive users. ServiceNow data source only.

