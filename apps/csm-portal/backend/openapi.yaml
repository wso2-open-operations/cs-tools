        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /roles/search:
    post:
      summary: Search the role catalogue.
      description: >
        The platform's curated set of assignable role keys — the same values the user search
