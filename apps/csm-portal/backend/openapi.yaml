          type: array
          items:
            $ref: '#/components/schemas/ProjectContact'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Total number of matching contacts

    ProjectClosureFields:
      type: object
      description: >
        Closure-tracking fields shared by the project search row and the project
        detail response. Only populated for projects sourced from the backing
        data source; null otherwise.
      properties:
        closureState:
          type: string
          nullable: true
          description: >
            The project's overall closure/access state. Derived by the backing data
            source from the three sub-states below; never settable directly.
        endDateClosureState:
          type: string
          nullable: true
        invoiceDueDateClosureState:
          type: string
          nullable: true
        complianceViolationClosureState:
          type: string
          nullable: true
        complianceViolationDate:
          type: string
          nullable: true
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing suspension
            flow in the backing data source. This is opaque JSON passed through
            as-is — its shape is not defined or validated by this layer.

    Project:
      description: >
        A project search result row. Deliberately leaner than ProjectDetails: the
        search projection carries no sfId and no updatedOn.
      allOf:
        - $ref: '#/components/schemas/ProjectClosureFields'
        - type: object
          properties:
            id:
              type: string
            name:
              type: string
            key:
              type: string
            subscriptionType:
              type: string
              enum:
                - development_support
                - managed_cloud_subscription
                - evaluation_subscription
                - subscription
                - cloud_evaluation_support
                - internal
                - platformer_subscription
                - cloud_support
                - professional_services
            startDate:
              type: string
              format: date-time
              nullable: true
              description: >
                Start of the project's current renewed period. Null when the backing
                data source has no start date recorded.
            endDate:
              type: string
              format: date-time
              nullable: true
              description: End of the project's current renewed period.
            createdOn:
              type: string
              format: date-time
              description: >
                When the project record was created. Distinct from startDate, which
                moves forward on each renewal.
            account:
              nullable: true
              description: Null when the project has no linked account.
              allOf:
                - $ref: '#/components/schemas/EntityRef'

    ProjectDetails:
      description: >
        The enriched single-project response. Adds sfId, updatedOn, and a fuller
        account reference on top of what the search row returns.
      allOf:
        - $ref: '#/components/schemas/ProjectClosureFields'
        - type: object
          properties:
            id:
              type: string
            account:
              $ref: '#/components/schemas/ProjectAccountRef'
            sfId:
              type: string
            name:
              type: string
            key:
              type: string
            subscriptionType:
              type: string
              enum:
                - development_support
                - managed_cloud_subscription
                - evaluation_subscription
                - subscription
                - cloud_evaluation_support
                - internal
                - platformer_subscription
                - cloud_support
                - professional_services
            startDate:
              type: string
              format: date-time
              nullable: true
              description: Start of the project's current renewed period.
            endDate:
              type: string
              format: date-time
              nullable: true
              description: End of the project's current renewed period.
            createdOn:
              type: string
              format: date-time
            updatedOn:
              type: string
              format: date-time

    ProjectAccountRef:
      type: object
      description: The parent account summary embedded in a project detail response.
      properties:
        id:
          type: string
        name:
          type: string
        activationDate:
          type: string
          format: date-time
          nullable: true
        tier:
          type: string
          description: Free-form tier label, not the lowercase account tier enum.
        region:
          type: string
          nullable: true
        agentEnabled:
          type: boolean
        kbReferencesEnabled:
          type: boolean

    ProjectUpdatePayload:
      type: object
      minProperties: 1
      description: >
        At least one field must be provided. hasAgent and hasKbReferences are
        simple toggles; the closure-state fields track sub-states of an
        Account Closure Process and are only applicable to projects sourced
        from the backing data source.
      properties:
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        endDateClosureState:
          type: string
        invoiceDueDateClosureState:
          type: string
        complianceViolationClosureState:
          type: string
        suspensionProcessState:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Free-form, per-dimension Account Closure Process (ACP) suspension-process
            state (event type + action results) written by an existing ServiceNow
            suspension flow. This is opaque JSON passed through as-is — its shape is
            not defined or validated by this layer.

    ProjectUpdateResponse:
      type: object
      required: [message, project]
      properties:
        message:
          type: string
        project:
          type: object
          required: [id, updatedBy, updatedOn]
          properties:
            id:
              type: string
              format: uuid
            updatedBy:
              type: string
            updatedOn:
              type: string
              format: date-time
            closureState:
              type: string
              nullable: true
            endDateClosureState:
              type: string
              nullable: true
            invoiceDueDateClosureState:
              type: string
              nullable: true
            complianceViolationClosureState:
              type: string
              nullable: true
            suspensionProcessState:
              type: object
              additionalProperties: true
              nullable: true

