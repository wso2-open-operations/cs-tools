  /users/{id}:
    get:
      summary: Get one user's full profile.
      description: >
        Returns the user row plus every group they belong to, the subset of those that are
        teams, and for external contacts their per-project access with the reason access is
        or is not granted. ServiceNow data source only. A deactivated user is still
        returned — that state is usually the answer the caller is looking for.
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SNUserDetail'
        "400":
