  /incidents/{id}/activities/search:
    post:
      summary: Search the activity trail of an incident.
      description: >
        Confirmed as a distinct endpoint from POST /cases/{id}/activities/search, built on
        the same underlying activity-search mechanism. The request body is forwarded to
        the integration service as-is and the response is returned verbatim. Set
        includeFieldChanges to also include per-field value changes.
      operationId: postIncidentsIdActivitiesSearch
      parameters:
        - name: id
          in: path
          description: UUID of the incident.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Incident activity search payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseActivitySearchPayload'
        required: false
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseActivitySearchResponse'
        "400":
          description: BadRequest
