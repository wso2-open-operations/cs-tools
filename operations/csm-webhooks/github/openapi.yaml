openapi: 3.0.3
info:
  title: CSM GitHub Webhook
  version: "1.0.0"
  description: >-
    The public endpoint GitHub posts issue and issue-comment webhooks to. It
    verifies the HMAC signature over the raw body and forwards the delivery to
    entity-service, which is Organization-visible and cannot be reached from
    the internet. This component holds no database credentials and makes no
    decisions about what a delivery means.

paths:
  /webhooks/github:
    post:
      summary: >-
        Receive a GitHub webhook. Authenticated by the X-Hub-Signature-256
        HMAC rather than by OAuth2 -- GitHub cannot obtain a token. The
        gateway must leave the body byte-for-byte intact: the signature
        covers the raw bytes, and any re-serialisation invalidates it.
      operationId: handleGithubWebhook
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: HMAC-SHA256 of the raw body, keyed by the webhook secret.
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          description: The event name, e.g. "issues" or "issue_comment".
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub's delivery id, used downstream as the idempotency key.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's webhook payload, forwarded unchanged.
      responses:
        "200":
          description: >-
            Accepted. Also returned for a delivery that was deliberately
            skipped or already applied, so GitHub stops retrying it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  action: { type: string }
                  skipped: { type: string }
        "400":
          description: Unreadable body, or a missing delivery/event header.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          description: >-
            The signature did not verify. Deliberately identical for every
            cause -- a caller must not learn which check failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "413":
          description: >-
            The body exceeded the 2 MiB cap. Answered explicitly rather than
            truncating: a truncated body would fail the HMAC and be reported
            as a signature failure, pointing at the wrong cause.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: >-
            Forwarding to entity-service failed. GitHub retries, which is the
            only recovery: nothing else re-reads its event stream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /health:
    get:
      summary: Liveness probe.
      operationId: health
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

components:
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
