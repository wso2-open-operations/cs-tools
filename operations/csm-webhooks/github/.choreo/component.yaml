schemaVersion: 1.2

endpoints:
  - name: csm-github-webhook
    displayName: CSM GitHub Webhook
    service:
      basePath: /
      port: 8080
    type: REST
    # PUBLIC ON PURPOSE, AND THIS IS THE WHOLE REASON THE COMPONENT EXISTS.
    # GitHub must reach it from the internet. entity-service is
    # Organization-visible and must stay that way -- exposing it to make one
    # route reachable would publish every other route with it.
    networkVisibilities:
      - Public
    schemaFilePath: openapi.yaml
