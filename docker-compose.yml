# LOCAL DEVELOPMENT ONLY. Brings up the whole Postgres-backed CSM platform:
# both webapps, both BFFs, entity-service, the M2M/notification/activity-
# stream/alert-ingestion integrations, Postgres, a local Kafka broker
# standing in for production's Azure Event Hub, and a mock OIDC provider
# standing in for a real identity provider. See apps/csm-portal/README.md
# for the full walkthrough, prerequisites, and troubleshooting.
#
# Everything under scripts/csm-compose/ is local-dev tooling only -- it is
# never shipped or deployed anywhere else; Choreo builds and deploys every
# component in this file from source through its own pipeline.
#
# Every Dockerfile this stack builds from lives under docker/local/, not
# inside the component's own source directory: Choreo never reads or uses
# these Dockerfiles (it builds every component from source via its own
# buildpack), so keeping them out of tree avoids anyone mistaking a
# docker-compose build artifact for how the component is actually built and
# deployed. Each service below still sets `build.context` to the component's
# own directory (so COPY/ADD inside the Dockerfile resolve unchanged) and
# points `build.dockerfile` back at docker/local/ with a relative `../`
# path.

name: csm-platform

networks:
  default:
    name: csm-platform-net

volumes:
  # Named for the major version on purpose. postgres:18 images keep data under
  # /var/lib/postgresql/18/docker and refuse to start if they find an older
  # cluster's PG_VERSION at the mount root or any mount at
  # /var/lib/postgresql/data -- which is exactly what a csm-pgdata volume
  # from the postgres:16 era contains. A fresh volume name sidesteps that;
  # the old csm-pgdata volume is left untouched (remove it with
  # `docker volume rm csm-platform_csm-pgdata` once it is no longer wanted).
  # Everything in it is rebuilt by migrate + seed on first `up`.
  csm-pgdata-18:
  csm-dev-certs:

services:
  # ── Data plane ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - csm-pgdata-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The call-escalation ladder's wake index and per-incident state. Nothing
  # else in this stack needs Redis, which is why it was absent: the ladder is
  # the first thing here that has to remember something between ticks.
  #
  # Unpersisted on purpose. A ladder is a few minutes of state about an
  # incident happening right now; there is nothing worth surviving a
  # `docker compose down`, and plenty of confusion in a half-finished ladder
  # resuming days later against a database reseeded underneath it.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies entity-service's raw SQL migrations (it doesn't wire
  # up a migration tool) and loads dummy seed data. Every service that reads
  # from Postgres waits on this completing.
  migrate:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      ENTITY_DB_NAME: csm_platform
    volumes:
      - ./entity-service/migrations:/migrations/entity-service:ro
      - ./scripts/csm-compose/seed-entity-service.sql:/migrations/seed-entity-service.sql:ro
      - ./scripts/csm-compose/seed-team-schedule.sql:/migrations/seed-team-schedule.sql:ro
      - ./scripts/csm-compose/seed-escalation-roles.sql:/migrations/seed-escalation-roles.sql:ro
      - ./scripts/csm-compose/fixtures:/migrations/fixtures:ro
      - ./scripts/csm-compose/migrate-and-seed.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]

  # One-shot: generates a broader, randomized set of dummy CSM data (extra
  # accounts/projects/deployments/products/users and a spread of work items
  # across case/service_request/change_request/incident/engagement/problem,
  # plus comments, time cards, watchers, tags, escalations, and SLAs) into
  # entity-service's database, on top of migrate's fixed single-case seed --
  # see scripts/csm-compose/seed-generator's doc comment. Deliberately its
  # own one-shot service, not an extra step appended to migrate-and-seed.sh:
  # migrate's image (postgres:18-alpine) has no Go toolchain to build or run
  # this program inside that container, so it gets its own image, built the
  # same way mock-oidc and gateway-shim already are, and chains off
  # migrate's completion the same way kafka-topics-init chains off kafka's.
  # Idempotent via a marker table (see main.go): safe to leave running on
  # every `docker compose up`.
  seed-generator:
    build:
      context: ./scripts/csm-compose/seed-generator
      dockerfile: ../../../docker/local/seed-generator.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: devpassword
      DB_NAME: csm_platform
      DB_SSLMODE: disable

  # KRaft-mode Kafka broker standing in for production's Azure Event Hub
  # Kafka-compatible endpoint. entity-service/internal/eventbus,
  # csm-notification-service, and both activity-stream services all
  # hardcode TLS + SASL/PLAIN in their kafka-go client (there is no
  # plaintext code path -- see apps/csm-portal/README.md), so this broker
  # terminates real TLS with a throwaway CA generated by `certgen` on every
  # `docker compose up`, and accepts SASL/PLAIN with the same literal
  # username ("$ConnectionString") those clients hardcode.
  certgen:
    image: alpine:3.20
    volumes:
      - csm-dev-certs:/certs
      - ./scripts/csm-compose/gen-dev-certs.sh:/gen.sh:ro
    environment:
      EVENT_HUB_LOCAL_SHARED_SECRET: local-dev-shared-secret
    entrypoint: ["sh", "-c", "apk add --no-cache openssl >/dev/null && sh /gen.sh"]

  kafka:
    image: apache/kafka:3.8.0
    depends_on:
      certgen:
        condition: service_completed_successfully
    hostname: kafka
    volumes:
      - csm-dev-certs:/etc/kafka/secrets:ro
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SASL_SSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SASL_SSL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore-creds
      KAFKA_SSL_KEY_CREDENTIALS: key-creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-broker cluster: every internal topic (including
      # __consumer_offsets, which every consumer group needs) must be
      # creatable at replication factor 1, or consumer group coordination
      # fails outright with "Group Coordinator Not Available".
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: csm-local-dev-cluster-1
    ports:
      - "19094:9094"
    healthcheck:
      # Each probe starts a whole JVM (kafka-broker-api-versions.sh), which on a
      # laptop-sized Docker VM pins several cores while it JIT-compiles. So probe
      # quickly only while starting up (start_interval, within start_period), then
      # rarely once healthy, or the healthcheck itself becomes the stack's largest
      # steady CPU consumer and starves the UI under test.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 90s
      start_interval: 5s

  # One-shot: creates the topics this stack needs (auto-create is enabled
  # above too, but explicit creation makes first-boot deterministic).
  kafka-topics-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic case-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic case-events-dlq --partitions 1 --replication-factor 1

  # Mock OpenID Connect provider. LOCAL DEV ONLY -- see
  # scripts/csm-compose/mock-oidc/main.go. Issues real RS256-signed JWTs so
  # every backend's normal JWT-validation code path is exercised for real,
  # just against a throwaway signing key instead of a real identity
  # provider.
  mock-oidc:
    build:
      context: ./scripts/csm-compose/mock-oidc
    environment:
      MOCK_OIDC_ISSUER: http://localhost:9100
      PORT: "9100"
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/oauth2/jwks"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ── Core platform ─────────────────────────────────────────────────────────

  entity-service:
    build:
      context: ./entity-service
      dockerfile: ../docker/local/entity-service.Dockerfile
    depends_on:
      # seed-generator itself depends on migrate completing (see above), so
      # this transitively waits for migrations + both seed steps -- not just
      # migrate directly -- so the API never starts serving before the bulk
      # seed data exists.
      seed-generator:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DATA_SOURCE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      # Not `postgres`: a superuser skips every row-level-security policy, so as
      # `postgres` any signed-in customer could read another project's change
      # request or case by id (production's non-superuser role answers 404).
      # The migrate service creates csm_app (scripts/csm-compose/migrate-and-seed.sh)
      # and re-grants it on every pass, before this service starts.
      DB_USER: csm_app
      DB_PASSWORD: devpassword
      DB_NAME: csm_platform
      DB_SSLMODE: disable
      EVENT_HUB_BROKER: kafka:9094
      EVENT_HUB_CONNECTION_STRING: local-dev-shared-secret
      EVENT_HUB_TOPIC: case-events
      EVENT_PUBLISHING_ENABLED: "true"
      # A customer sees only the change requests designated to them (the customer's
      # approval or review was asked of them); a change request created BEFORE this
      # instant is "legacy" and keeps being visible to its project's registered
      # contacts past Authorize. Unset = every change request is legacy, which would
      # leave this stack NOT strict. Far in the past on purpose: every change request
      # the local seed and the specs create is strict, as production's will be after
      # its own cutover. See entity-service/CLAUDE.md, "Customer visibility and the
      # cutover".
      CR_STRICT_VISIBILITY_FROM: "2000-01-01T00:00:00Z"
      SSL_CERT_FILE: /certs/ca.crt
      # Token validation is always on (see internal/config/config.go), so this
      # stack needs a real issuer to start at all -- mock-oidc, the same one
      # csm-portal-backend/customer-portal-backend already validate against,
      # exercising the same code path this compose stack otherwise wouldn't
      # cover.
      AUTH_ISSUER: http://localhost:9100/oauth2/token
      AUTH_JWKS_URL: http://mock-oidc:9100/oauth2/jwks
      AUTH_USER_TOKEN_AUDIENCES: csm-portal-webapp,customer-portal-webapp
      # How entity-service classifies a caller that arrives with a client-credentials token
      # (x-jwt-assertion): internal/service/access_service.go ResolveScope, entity-service/README.md.
      # (This file used to set AUTH_INTERNAL_CLIENT_IDS, which nothing reads any more -- it was renamed
      # M2M_CLIENT_IDS -- so it had no effect, and its csm-portal-backend entry would have been wrong
      # anyway: a client id in the M2M list is unrestricted whatever user token it forwards.)
      #
      # customer-portal-backend-v2: its calls are ALWAYS scoped by the x-user-id-token it forwards, so
      # each customer sees only the projects they are a registered contact of -- never unrestricted,
      # even if this id were also listed in M2M_CLIENT_IDS by mistake. It resolves this way without
      # the line below (an unlisted client falls through to the user token); the line makes it a
      # guarantee rather than a side effect.
      CUSTOMER_PORTAL_BACKEND_CLIENT_ID: customer-portal-backend-dev-client
      # Pure machine-to-machine callers, no signed-in person: unrestricted. Without an entry these get
      # no caller identity and a 500 on every scoped endpoint. Not listed on purpose: the portal
      # backends and both activity-stream services, which forward a person's token and must resolve
      # to that person's own scope.
      # csm-notification-service is here for the call-escalation ladder: it reads the rota and the
      # ranks behind it to decide who each rung reaches, machine to machine, with no user to carry a
      # token. Both of those reads are internal-staff-only, so without it every rung resolves to
      # nobody and the ladder silently reaches no one.
      M2M_CLIENT_IDS: csm-integration-service-dev-client,csm-notification-service-dev-client
      # CSM_PORTAL_BACKEND_CLIENT_ID / CSM_PORTAL_USER_DOMAIN are deliberately NOT set. They make the
      # CSM BFF unrestricted for any user whose email is in that domain (and refuse everyone else),
      # but this stack's staff and customer personas share example.com, so the domain cannot tell them
      # apart. Unset, each CSM portal user resolves from their own user record: internal sees
      # everything, a customer only their registered projects.
    volumes:
      - csm-dev-certs:/certs:ro
    ports:
      - "127.0.0.1:8081:8080"

  csm-portal-backend:
    build:
      context: ./apps/csm-portal/backend
      dockerfile: ../../../docker/local/csm-portal-backend.Dockerfile
    depends_on:
      - entity-service
      - mock-oidc
    environment:
      OAUTH2_CLIENT_ID: csm-portal-backend-dev-client
      OAUTH2_CLIENT_SECRET: dev-secret
      OAUTH2_TOKEN_URL: http://mock-oidc:9100/oauth2/token
      CUSTOMER_ENTITY_BASE_URL: http://entity-service:8080
      # Out of scope for this compose stack (see apps/csm-portal/README.md);
      # only required to be a non-empty string at startup, never dialed by
      # anything this stack's verification checks exercise.
      UPDATES_BASE_URL: https://updates.local.invalid
      SCIM_BASE_URL: https://scim.local.invalid
      AUTH_JWKS_ENDPOINT: http://mock-oidc:9100/oauth2/jwks
      AUTH_ISSUER: http://localhost:9100/oauth2/token
      AUTH_AUDIENCE: csm-portal-webapp
      AUTH_TOKEN_VALIDATOR_ENABLED: "true"
      # Local-dev role-group mappings: mock-oidc's login form "Groups"
      # field becomes the token's roles claim verbatim, so these names are
      # what you type there to sign in at each portal-access tier (cs_engineer
      # gets full support-engineer-level access -- see internal/handler/access.go).
      AUTH_VIEWER_ROLES: cs_viewer
      AUTH_COMMENTER_ROLES: cs_commenter
      AUTH_ESCALATOR_ROLES: cs_escalator
      AUTH_ATTACHMENT_DOWNLOADER_ROLES: cs_attachment_downloader
      AUTH_USAGE_METRICS_VIEWER_ROLES: cs_usage_metrics_viewer
      AUTH_SUPPORT_ENGINEER_ROLES: cs_engineer
      AUTH_ADMIN_ROLES: cs_admin
      AUTH_TIMECARD_APPROVER_ROLES: cs_timecard_approver
      AUTH_DASHBOARD_DESIGNER_ROLES: cs_dashboard_designer
      # Marker role, not a capability tier like the ones above -- picks the
      # Sales/Solutions-Architecture (SPL) nav over CS Portal's own (see
      # usePortalView.ts and internal/handler/access.go's AccessConfig.SalesSolutions).
      AUTH_SALES_SOLUTIONS_ROLES: cs_sales_solutions
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      PORT: "8080"
      DASHBOARDS_DIR: ./dashboards.example
      # The team catalogue. Unset, every team filter returns nothing and the
      # backend warns "team registry is empty" at startup. These are the teams
      # seed-team-schedule.sql creates; the display names must match the seeded
      # team.name exactly, because members are resolved by name.
      CSM_TEAM_REGISTRY: "castor|Castor|CRE-ABT,draco|Draco|CRE-ABT,vega|Vega|CRE-ABT,sirius|Sirius|CRE-ABT,atlas|Atlas|CRE-ABT,phoenix|Phoenix|CRE-ABT,rigel|Rigel|CRE-ABT,americas|Americas|CRE,migration|Migration|CRE,apollo|Apollo|SRE-ABT,artemis|Artemis|SRE-ABT"
      # PLG refuses a plaintext OAuth2 token URL to a non-loopback host, and
      # this stack's mock identity provider is plain http on a compose hostname
      # -- so the backend exits 1 before it ever binds a port. The guard permits
      # loopback, so PLG gets a loopback URL of its own here. PLG's own routes
      # are not exercised by this stack; every other client keeps using
      # OAUTH2_TOKEN_URL and reaches mock-oidc normally.
      PLG_ENTITY_OAUTH_TOKEN_URL: http://localhost:9100/oauth2/token
    # No host port published: csm-portal-gateway-shim below takes over
    # :8082 on the host so it sits on the request path (Authorization ->
    # x-jwt-assertion), the one job Choreo's real gateway does in
    # production. The backend stays reachable from other containers via
    # Docker DNS at csm-portal-backend:8080.

  # LOCAL DEV ONLY. Stands in for the one job Choreo's real API gateway
  # does in production for this BFF: turn the webapp's
  # `Authorization: Bearer <token>` into the `x-jwt-assertion` header
  # csm-portal-backend's auth middleware requires. See
  # scripts/csm-compose/gateway-shim/main.go for why no claim synthesis is
  # needed against this stack's mock-oidc. Takes over the host port
  # (:8082) that csm-portal-backend published before this shim existed --
  # CSM_PORTAL_BACKEND_BASE_URL below is unchanged, so this is transparent
  # to the webapp.
  csm-portal-gateway-shim:
    build:
      context: ./scripts/csm-compose/gateway-shim
      dockerfile: ../../../docker/local/gateway-shim.Dockerfile
    depends_on:
      - csm-portal-backend
    environment:
      PORT: "8080"
      UPSTREAM_URL: http://csm-portal-backend:8080
    ports:
      - "127.0.0.1:8082:8080"

  csm-portal-webapp:
    build:
      context: .
      dockerfile: docker/local/csm-portal-webapp.Dockerfile
    depends_on:
      - csm-portal-backend
      - mock-oidc
    environment:
      CSM_PORTAL_AUTH_BASE_URL: http://localhost:9100
      CSM_PORTAL_AUTH_CLIENT_ID: csm-portal-webapp
      CSM_PORTAL_AUTH_SIGN_IN_REDIRECT_URL: http://localhost:3001
      CSM_PORTAL_AUTH_SIGN_OUT_REDIRECT_URL: http://localhost:3001
      CSM_PORTAL_BACKEND_BASE_URL: http://localhost:8082
    ports:
      - "127.0.0.1:3001:8080"

  customer-portal-backend-v2:
    build:
      context: ./apps/customer-portal/backend-v2
      dockerfile: ../../../docker/local/customer-portal-backend-v2.Dockerfile
    depends_on:
      - entity-service
      - mock-oidc
    environment:
      OAUTH2_CLIENT_ID: customer-portal-backend-dev-client
      OAUTH2_CLIENT_SECRET: dev-secret
      OAUTH2_TOKEN_URL: http://mock-oidc:9100/oauth2/token
      ENTITY_SERVICE_BASE_URL: http://entity-service:8080
      # Out of scope for this compose stack; only required to be non-empty
      # (or, for the two *_BASE_URL vars below, syntactically https://) at
      # startup -- see apps/csm-portal/README.md.
      UPDATES_BASE_URL: https://updates.local.invalid
      SCIM_BASE_URL: https://scim.local.invalid
      AI_CHAT_AGENT_BASE_URL: https://ai-chat.local.invalid
      AI_CHAT_AGENT_WS_BASE_URL: wss://ai-chat.local.invalid/ws
      PRODUCT_CONSUMPTION_SUBSCRIPTION_URL: https://product-consumption.local.invalid
      REGISTRY_BASE_URL: https://registry.local.invalid
      USER_MANAGEMENT_BASE_URL: https://usermanagement.local.invalid
      # There is no pre-cutover user-management service in this stack (the URL
      # above is a placeholder that never resolves), so with this off
      # GET /projects/{id}/contacts answers 500 and the portal's contact list
      # and admin check fail. On, contacts are read from the CSM database
      # through entity-service, which is what this stack seeds.
      CSM_MIGRATION_PORTAL_CONTACTS_ENABLED: "true"
      AUTH_ADMIN_ROLE: cs_admin
      AUTH_JWKS_ENDPOINT: http://mock-oidc:9100/oauth2/jwks
      AUTH_ISSUER: http://localhost:9100/oauth2/token
      AUTH_AUDIENCE: customer-portal-webapp
      AUTH_TOKEN_VALIDATOR_ENABLED: "true"
      PORT: "8080"
      # Must be set explicitly: this service's own WS_PORT default (8081)
      # collides with entity-service's default port.
      WS_PORT: "8092"
    # No host port published for :8080 -- customer-portal-gateway-shim
    # below takes over :8090 on the host (see the comment on that
    # service). The WebSocket listener on :8092 is unaffected: it
    # authenticates the client's id token itself (see
    # internal/middleware/auth.go's DecodeUnverified), never reads
    # x-jwt-assertion, and this shim does not proxy it -- so :8092 keeps
    # publishing directly from this service.
    ports:
      - "127.0.0.1:8092:8092"

  # LOCAL DEV ONLY. Same job as csm-portal-gateway-shim above, for
  # customer-portal-backend-v2. Takes over the host port (:8090) that
  # backend published before this shim existed --
  # CUSTOMER_PORTAL_BACKEND_BASE_URL below is unchanged, so this is
  # transparent to the webapp.
  customer-portal-gateway-shim:
    build:
      context: ./scripts/csm-compose/gateway-shim
      dockerfile: ../../../docker/local/gateway-shim.Dockerfile
    depends_on:
      - customer-portal-backend-v2
    environment:
      PORT: "8080"
      UPSTREAM_URL: http://customer-portal-backend-v2:8080
    ports:
      - "127.0.0.1:8090:8080"

  customer-portal-webapp:
    build:
      context: .
      dockerfile: docker/local/customer-portal-webapp.Dockerfile
    depends_on:
      - customer-portal-backend-v2
      - mock-oidc
    environment:
      CUSTOMER_PORTAL_AUTH_BASE_URL: http://localhost:9100
      CUSTOMER_PORTAL_AUTH_CLIENT_ID: customer-portal-webapp
      CUSTOMER_PORTAL_AUTH_SIGN_IN_REDIRECT_URL: http://localhost:3000
      CUSTOMER_PORTAL_AUTH_SIGN_OUT_REDIRECT_URL: http://localhost:3000
      CUSTOMER_PORTAL_BACKEND_BASE_URL: http://localhost:8090
    ports:
      - "127.0.0.1:3000:8080"

  # ── Integrations ──────────────────────────────────────────────────────────

  csm-integration-service:
    build:
      context: ./integrations/csm-integration-service
      dockerfile: ../../docker/local/csm-integration-service.Dockerfile
    depends_on:
      - entity-service
      - mock-oidc
    environment:
      ENTITY_BASE_URL: http://entity-service:8080
      ENTITY_TOKEN_URL: http://mock-oidc:9100/oauth2/token
      ENTITY_CLIENT_ID: csm-integration-service-dev-client
      ENTITY_CLIENT_SECRET: dev-secret
      PORT: "8080"
    ports:
      - "127.0.0.1:8084:8080"

  csm-notification-service:
    build:
      context: ./integrations/csm-notification-service
      dockerfile: ../../docker/local/csm-notification-service.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      entity-service:
        condition: service_started
    environment:
      EVENT_HUB_BROKER: kafka:9094
      EVENT_HUB_CONNECTION_STRING: local-dev-shared-secret
      EVENT_HUB_TOPIC: case-events
      EVENT_HUB_DLQ_TOPIC: case-events-dlq
      SSL_CERT_FILE: /certs/ca.crt
      CUSTOMER_ENTITY_BASE_URL: http://entity-service:8080
      OAUTH2_CLIENT_ID: csm-notification-service-dev-client
      OAUTH2_CLIENT_SECRET: dev-secret
      OAUTH2_TOKEN_URL: http://mock-oidc:9100/oauth2/token
      # No real email/chat/voice credentials in local dev: disabling
      # sending still dispatches and logs every consumed event (see
      # apps/csm-portal/README.md), which is what the verification checks
      # for.
      EMAIL_SENDING_ENABLED: "false"
      # Off unless trigger-escalation.sh -c call|both turns it on for one run.
      CALL_SENDING_ENABLED: ${CALL_SENDING_ENABLED:-false}
      # Twilio, only used when a call channel is chosen. Supplied by
      # trigger-escalation.sh from the service's own .env, never committed.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # The escalation ladder. REDIS_ADDR is what makes the engine exist at
      # all: without it cmd/server never builds one, and an incident.created
      # is consumed and ignored.
      REDIS_ADDR: redis:6379
      # chat, not call: CALL_SENDING_ENABLED above is false and there is no
      # telephony account here, so a voice rung would reach nobody and prove
      # nothing.
      # The configuration file decides what actually gets dialled: which
      # incidents escalate, how far, and over which channel. It ships set to
      # `log`, so `docker compose up` runs the whole ladder for real and
      # reaches nobody. INCIDENT_ESCALATION_CHANNEL below is the pre-file
      # fallback and is ignored whenever this path is set.
      INCIDENT_ESCALATION_CONFIG: /config/escalation.yaml
      INCIDENT_ESCALATION_CHANNEL: chat
      # Both of these are yours, not the repository's. GOOGLE_CHAT_SPACES
      # carries a webhook URL, which is a credential: anyone holding it can
      # post into the space as the app. Export them in your own shell and
      # compose passes them through. Unset, the ladder is built but reaches
      # nobody, and says so at startup.
      GOOGLE_CHAT_SPACES: ${GOOGLE_CHAT_SPACES:-}
      # The CRE ladder's own room, named by escalation.yaml cre.chat.webhookUrlEnv.
      # Supplied by trigger-escalation.sh from the service's .env; never committed.
      CRE_CHAT_WEBHOOK_URL: ${CRE_CHAT_WEBHOOK_URL:-}
      # The SRE ladder's room, named by escalation.yaml sre.chat.webhookUrlEnv.
      # Kept in scripts/csm-compose/.env (git-ignored); export it before
      # `docker compose up`. Never committed.
      SRE_CHAT_WEBHOOK_URL: ${SRE_CHAT_WEBHOOK_URL:-}
      INCIDENT_ESCALATION_ROSTER: ${INCIDENT_ESCALATION_ROSTER:-}
      # Resolve rungs from the Team Schedule -- the rule table escalation.yaml
      # and rules.go describe. Unset, the server falls back to the stand-in
      # roster above, which routes by the retired fourteen-row table: a local
      # run then reported rule=R13 for an incident R5 should have routed.
      INCIDENT_ESCALATION_RESOLVER: ${INCIDENT_ESCALATION_RESOLVER:-team-schedule}
      PORT: "8080"
    volumes:
      - csm-dev-certs:/certs:ro
      # ESCALATION_CONFIG_FILE lets trigger-escalation.sh mount a per-run copy
      # (a different channel, your own number); unset, the committed file.
      - ${ESCALATION_CONFIG_FILE:-./scripts/csm-compose/escalation.yaml}:/config/escalation.yaml:ro
    ports:
      - "127.0.0.1:8083:8080"

